schema_version: worldfoundry.runtime_defaults.v1

x-echo-common: &echo_common
  wan_base_dir: ${WORLDFOUNDRY_CKPT_DIR}/Wan2.1-T2V-1.3B
  task: t2v-1.3B
  width: 640
  height: 352
  frames: 81
  fps: 15
  num_chunks: 2
  sample_steps: 50
  sample_shift: 5.0
  sample_solver: unipc
  sample_guide_scale: 5.0
  base_seed: 42
  negative_prompt: "oversaturated colors, overexposed, static, blurry details"
  camera_trajectory: "z*80"
  camera_translation_step: 0.08
  camera_rotation_step_degrees: 3.0
  offload_model: true
  t5_cpu: false
  t5_fsdp: false
  dit_fsdp: false
  ulysses_size: 1
  ring_size: 1

defaults:
  echo-memory-context-k1:
    <<: *echo_common
    checkpoint_path: ${WORLDFOUNDRY_CKPT_DIR}/Echo-Memory/context_k1/epoch-0.safetensors
  echo-memory-context-k20:
    <<: *echo_common
    checkpoint_path: ${WORLDFOUNDRY_CKPT_DIR}/Echo-Memory/context_k20/epoch-0.safetensors
  echo-memory-spatial:
    <<: *echo_common
    sample_shift: 15.0
    checkpoint_path: ${WORLDFOUNDRY_CKPT_DIR}/Echo-Memory/spatial_mem/epoch-0.safetensors
  echo-memory-block-ssm:
    <<: *echo_common
    sample_shift: 15.0
    checkpoint_path: ${WORLDFOUNDRY_CKPT_DIR}/Echo-Memory/block_wise_ssm_two_chunk/epoch-0.safetensors
  echo-memory-videossm-hybrid:
    <<: *echo_common
    sample_shift: 15.0
    checkpoint_path: ${WORLDFOUNDRY_CKPT_DIR}/Echo-Memory/videossm_hybrid/epoch-0.safetensors
  echo-memory-spatial-concat-text:
    <<: *echo_common
    sample_shift: 15.0
    checkpoint_path: ${WORLDFOUNDRY_CKPT_DIR}/Echo-Memory/spatial_concat_text_two_chunk/epoch-0.safetensors
  echo-memory-spatial-no-injection:
    <<: *echo_common
    sample_shift: 15.0
    checkpoint_path: ${WORLDFOUNDRY_CKPT_DIR}/Echo-Memory/spatial_inject_none_two_chunk/epoch-0.safetensors
  echo-memory-spatial-cross-attn-t32:
    <<: *echo_common
    sample_shift: 15.0
    checkpoint_path: ${WORLDFOUNDRY_CKPT_DIR}/Echo-Memory/spatial_cross_attn_readout_t32_g4_two_chunk/epoch-0.safetensors
  echo-memory-ssm-ctx1-every4-hint21:
    <<: *echo_common
    sample_shift: 15.0
    checkpoint_path: ${WORLDFOUNDRY_CKPT_DIR}/Echo-Memory/ssm_ablation_ctx1_every4_hint21/epoch-0.safetensors
  echo-memory-ssm-ctx5-every1-hint21:
    <<: *echo_common
    sample_shift: 15.0
    checkpoint_path: ${WORLDFOUNDRY_CKPT_DIR}/Echo-Memory/ssm_ablation_ctx5_every1_hint21/epoch-0.safetensors
  echo-memory-ssm-ctx5-every4-hint81:
    <<: *echo_common
    sample_shift: 15.0
    checkpoint_path: ${WORLDFOUNDRY_CKPT_DIR}/Echo-Memory/ssm_ablation_ctx5_every4_hint81/epoch-0.safetensors
