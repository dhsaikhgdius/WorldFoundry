  overview_zh: EO-1（Embodied One）是 EO-Robotics 项目的具身 VLA 策略。WorldFoundry 通过树内 Transformers processor.select_action 运行时适配器路由，源码来自官方 EO 仓库；尚未记录 checkpoint，运行输出运行时计划。
