  usage_notes: Checkpoint absence is reported by runtime missing_assets and is not a catalog blocker; stage official weights when available.
  usage_notes_zh: checkpoint 缺失由运行时 missing_assets 报告，不视为 catalog 阻塞；官方权重可用后就位即可。
