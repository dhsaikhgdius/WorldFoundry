docs:
  overview: |
    EO-1 (EO-Robotics/EO) is an open-source embodied VLA foundation model line. WorldFoundry routes EO-1 through an in-tree Transformers `processor.select_action` runtime adapter; checkpoint absence is reported by runtime `missing_assets` and is not a catalog blocker. No Hugging Face checkpoints are recorded in this catalog file.

    Within the WorldFoundry model catalog this entry is tracked as `eo1` in the `vla_va_wam` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/EO-Robotics/EO.
  overview_zh: |
    EO-1（EO-Robotics/EO）是开源具身 VLA 基础模型系列。WorldFoundry 通过树内 Transformers `processor.select_action` 运行时适配器接入 EO-1；权重缺失由运行时 `missing_assets` 报告，不构成目录阻塞。本目录文件未记录 Hugging Face 权重。

    在 WorldFoundry 模型目录中，该条目以 `eo1` 收录于 `vla_va_wam` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/EO-Robotics/EO。
  architecture: |
    Publicly, EO-1 is described as a unified embodied foundation model that interleaves multimodal understanding with action generation (autoregressive decoding combined with flow-matching action denoising over a shared backbone). The catalog itself records only the runtime adapter route; layer-level details are not recorded in the repository.
  architecture_zh: |
    公开资料中，EO-1 被描述为统一的具身基础模型，在共享骨干上交错进行多模态理解与动作生成（自回归解码结合 flow-matching 动作去噪）。目录本身仅记录运行时适配器路线；层级细节仓库未记录。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `eo1` and runtime profile `runtime-profile:eo1`.
    Catalog integration status: `runtime_ported`.
    Integration notes recorded in the catalog:
    - Concrete EO-1 algorithm entry sourced from the EO official repository.
    - WorldFoundry routes EO-1 through an in-tree Transformers processor.select_action runtime adapter.
    - Checkpoint absence is reported by runtime missing_assets and is not a catalog blocker.

    Embodiment contract:
    - Simulator: none bundled — WorldFoundry integrates this entry as an action-inference runtime that emits action traces; closed-loop simulator rollouts are executed by separate benchmark runners, not by this catalog entry.
    - Sensors: RGB camera observations plus a language instruction; the exact camera/state contract is not recorded in this catalog file.
    - Action space: continuous robot end-effector/joint action chunks; the exact action dimensionality is not recorded in this catalog file.
    - Dedicated environment: no dedicated simulation environment ships with this entry; upstream simulators, datasets, and training stacks are explicitly excluded from the in-tree runtime.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `eo1`，运行时配置为 `runtime-profile:eo1`。
    目录集成状态：运行时已移植（runtime_ported）。
    目录中记录的集成备注（保留原文）：
    - Concrete EO-1 algorithm entry sourced from the EO official repository.
    - WorldFoundry routes EO-1 through an in-tree Transformers processor.select_action runtime adapter.
    - Checkpoint absence is reported by runtime missing_assets and is not a catalog blocker.

    具身接口（embodiment contract）：
    - 仿真器：不内置仿真器——WorldFoundry 将该条目集成为动作推理运行时，输出 action trace；闭环仿真 rollout 由独立的 benchmark runner 执行，不属于本目录条目。
    - 传感器：RGB 相机观测加语言指令；具体相机/状态契约本目录文件未记录。
    - 动作空间：连续的机器人末端/关节动作块；具体动作维度本目录文件未记录。
    - 是否专用环境：该条目不附带专用仿真环境；上游仿真器、数据集与训练栈被明确排除在 in-tree 运行时之外。
