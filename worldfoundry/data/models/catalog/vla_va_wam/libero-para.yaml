docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'LIBERO-Para is a paraphrase-robustness evaluation line around the LIBERO benchmark: it tests how VLA policies behave when task instructions are reworded (paper: hf.co/papers/2603.28301, MIT license). The HAI-Lab/LIBERO-Para dataset is confirmed on Hugging Face; WorldFoundry routes action evaluation through an in-tree official-policy runtime adapter.'
  overview_zh: LIBERO-Para 是围绕 LIBERO 基准的指令改写鲁棒性评测线：测试 VLA 策略在任务指令被改写时的表现（论文：hf.co/papers/2603.28301，MIT 许可）。HAI-Lab/LIBERO-Para 数据集已在 Hugging Face 确认； WorldFoundry 通过树内官方策略运行时适配器路由动作评测。
  architecture: This is an evaluation/dataset-centered entry rather than a new policy architecture; the recorded artifact is the paraphrased-instruction dataset plus an evaluation route. Further internals are not recorded in this repository.
  architecture_zh: 这是以评测/数据集为中心的条目，而非新策略架构；记录的工件为指令改写数据集与评测路由。更多内部细节仓库未记录。
  usage_notes: Checkpoint absence is reported by runtime missing_assets and is not a catalog blocker; runs emit a runtime plan until weights are staged. Pair it with a LIBERO-capable policy to measure paraphrase robustness.
  usage_notes_zh: checkpoint 缺失由运行时 missing_assets 报告，不视为 catalog 阻塞；权重就位前运行输出运行时计划。与支持 LIBERO 的策略搭配即可测量指令改写鲁棒性。
  limitations:
  - No policy checkpoint of its own; it evaluates other policies.
  limitations_zh:
  - 自身无策略 checkpoint；用于评测其他策略。
  recommended_benchmarks:
  - id: libero-para
    reason: This entry is the LIBERO-Para evaluation itself.
    reason_zh: 本条目即 LIBERO-Para 评测本身。
  - id: libero
    reason: Built on the LIBERO task suite.
    reason_zh: 构建于 LIBERO 任务套件之上。
