docs:
  overview: |
    HY-Embodied (Tencent-Hunyuan/HY-Embodied, Tencent Hunyuan community license) is Tencent Hunyuan's embodied policy entry, tracked separately from the Hy-Embodied-0.5-VLA action runtime. WorldFoundry routes it through an in-tree official Transformers image-text runtime adapter; checkpoint absence (`tencent/HY-Embodied-0.5`) is reported by runtime `missing_assets` and is not a catalog blocker.

    Within the WorldFoundry model catalog this entry is tracked as `hy-embodied` in the `vla_va_wam` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/Tencent-Hunyuan/HY-Embodied; Hugging Face `tencent/HY-Embodied-0.5`.
  overview_zh: |
    HY-Embodied（Tencent-Hunyuan/HY-Embodied，腾讯混元社区许可证）是腾讯混元的具身策略条目，与 Hy-Embodied-0.5-VLA 动作运行时分开跟踪。WorldFoundry 通过树内官方 Transformers 图文运行时适配器接入；权重（`tencent/HY-Embodied-0.5`）缺失由运行时 `missing_assets` 报告，不构成目录阻塞。

    在 WorldFoundry 模型目录中，该条目以 `hy-embodied` 收录于 `vla_va_wam` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/Tencent-Hunyuan/HY-Embodied；Hugging Face `tencent/HY-Embodied-0.5`。
  architecture: |
    The repository records this entry as an image-text (VLM-style) embodied policy route over the official Transformers stack. Architecture details beyond that are not recorded in the repository.
  architecture_zh: |
    仓库将该条目记录为基于官方 Transformers 栈的图文（VLM 式）具身策略路线。除此之外的架构细节仓库未记录。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `hy-embodied` and runtime profile `runtime-profile:hy-embodied`.
    Catalog integration status: `runtime_ported`.
    Integration notes recorded in the catalog:
    - WorldFoundry routes HY-Embodied through an in-tree official Transformers image-text runtime adapter.
    - Checkpoint absence is reported by runtime missing_assets and is not a catalog blocker.

    Embodiment contract:
    - Simulator: none bundled — WorldFoundry integrates this entry as an action-inference runtime that emits action traces; closed-loop simulator rollouts are executed by separate benchmark runners, not by this catalog entry.
    - Sensors: RGB camera observations plus a language instruction; the exact camera/state contract is not recorded in this catalog file.
    - Action space: continuous robot end-effector/joint action chunks; the exact action dimensionality is not recorded in this catalog file.
    - Dedicated environment: no dedicated simulation environment ships with this entry; upstream simulators, datasets, and training stacks are explicitly excluded from the in-tree runtime.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `hy-embodied`，运行时配置为 `runtime-profile:hy-embodied`。
    目录集成状态：运行时已移植（runtime_ported）。
    目录中记录的集成备注（保留原文）：
    - WorldFoundry routes HY-Embodied through an in-tree official Transformers image-text runtime adapter.
    - Checkpoint absence is reported by runtime missing_assets and is not a catalog blocker.

    具身接口（embodiment contract）：
    - 仿真器：不内置仿真器——WorldFoundry 将该条目集成为动作推理运行时，输出 action trace；闭环仿真 rollout 由独立的 benchmark runner 执行，不属于本目录条目。
    - 传感器：RGB 相机观测加语言指令；具体相机/状态契约本目录文件未记录。
    - 动作空间：连续的机器人末端/关节动作块；具体动作维度本目录文件未记录。
    - 是否专用环境：该条目不附带专用仿真环境；上游仿真器、数据集与训练栈被明确排除在 in-tree 运行时之外。
  limitations: |
