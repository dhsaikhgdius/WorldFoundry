docs:
  publisher: Physical Intelligence
  publisher_kind: company
  publisher_zh: Physical Intelligence（PI）
  overview: 'pi0.5 is Physical Intelligence''s open-world generalization upgrade of pi0: trained for broader scene and task transfer while keeping the flow-matching VLA recipe. This catalog entry is the concrete pi0.5 algorithm route, reusing the in-tree OpenPI runtime with pi05-specific configuration and checkpoint selection — the pi05_libero path is checkpoint-validated under the openpi entry.'
  overview_zh: pi0.5 是 Physical Intelligence 对 pi0 的开放世界泛化升级：面向更广的场景与任务迁移训练，同时保持 flow-matching VLA 配方。本 catalog 条目是具体的 pi0.5 算法路由，复用树内 OpenPI 运行时与 pi05 专用配置及 checkpoint 选择——pi05_libero 路径已在 openpi 条目下完成 checkpoint 验证。
  architecture: Same family architecture as pi0 — a PaliGemma-based VLA with a flow-matching action expert — trained with pi0.5's open-world recipe. Do not route this through LeRobot policy-zoo; the catalog uses the official openpi runtime.
  architecture_zh: 与 pi0 同族架构——基于 PaliGemma 的 VLA 加 flow-matching 动作专家——按 pi0.5 的开放世界配方训练。请勿经 LeRobot 策略库路由；catalog 使用官方 openpi 运行时。
  usage_notes: Stage GCS checkpoints (gs://openpi-assets) with gsutil/gcloud. The pi05_libero configuration is the validated reference path in this repository.
  usage_notes_zh: 用 gsutil/gcloud 就位 GCS checkpoint（gs://openpi-assets）。pi05_libero 配置是本仓库中已验证的参照路径。
  limitations:
  - GCS-hosted checkpoints require gsutil/gcloud tooling.
  - No license is recorded on this entry (see the openpi entry, Apache-2.0).
  limitations_zh:
  - GCS 托管 checkpoint 需要 gsutil/gcloud 工具。
  - 本条目未记录许可证（参见 openpi 条目，Apache-2.0）。
  recommended_benchmarks:
  - id: libero
    reason: pi05_libero is the validated in-tree reference.
    reason_zh: pi05_libero 是树内已验证参照。
