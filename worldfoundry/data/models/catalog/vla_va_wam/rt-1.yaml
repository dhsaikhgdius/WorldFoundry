docs:
  publisher: Google Research
  publisher_kind: company
  publisher_zh: 谷歌研究院（Google Research）
  overview: RT-1 (Robotics Transformer 1) is Google Research's pioneering large-scale robot transformer, trained on 130k real-robot episodes to output discretized actions from images and instructions. WorldFoundry vendors the RT-1 SavedModel runtime and upstream source in-tree; py_compile, import, and plan generation passed, but the configured checkpoint directory is not yet staged locally.
  overview_zh: RT-1（Robotics Transformer 1）是谷歌研究院开创性的大规模机器人 transformer，在 13 万条真实机器人示范上训练，从图像与指令输出离散化动作。WorldFoundry 将 RT-1 SavedModel 运行时与上游源码内置树内；py_compile、导入与计划生成已通过，但配置的 checkpoint 目录尚未本地就位。
  architecture: An EfficientNet-B3 image tokenizer with FiLM language conditioning, TokenLearner compression, and a decoder-only transformer emitting discretized action tokens — served as a TensorFlow SavedModel.
  architecture_zh: EfficientNet-B3 图像 token 化配 FiLM 语言条件、TokenLearner 压缩与 decoder-only transformer，输出离散化动作 token——以 TensorFlow SavedModel 提供。
  usage_notes: The official checkpoint and TensorFlow rollout command must be validated before integrated status; stage the SavedModel checkpoint directory to run beyond plan generation. This is a TensorFlow entry, unlike most PyTorch policies in the catalog.
  usage_notes_zh: 在验证官方 checkpoint 与 TensorFlow rollout 命令前不会进入 integrated 状态；就位 SavedModel checkpoint 目录后方可超出计划生成执行。这是 TensorFlow 条目，与 catalog 中多数 PyTorch 策略不同。
  limitations:
  - TensorFlow SavedModel stack; checkpoint directory is not yet staged.
  - No license is recorded in this repository.
  limitations_zh:
  - TensorFlow SavedModel 栈；checkpoint 目录尚未就位。
  - 仓库未记录许可证。
