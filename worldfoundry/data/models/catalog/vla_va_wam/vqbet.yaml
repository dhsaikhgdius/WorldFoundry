docs:
  overview: |
    VQ-BeT (jayLEE0301/vq_bet_official, 'Behavior Generation with Latent Actions', ICML 2024 Spotlight) is a behavior-generation model in the Behavior Transformer lineage: it tokenizes continuous action chunks with a hierarchical residual VQ-VAE and predicts those latent action codes with a GPT-style transformer, capturing multimodal demonstration distributions without diffusion-style iterative sampling. WorldFoundry tracks it as a concrete algorithm entry from the official repository and routes it through an in-tree action runtime adapter; checkpoint absence is reported by runtime missing_assets and is not a catalog blocker.

    Within the WorldFoundry model catalog this entry is tracked as `vqbet` in the `vla_va_wam` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/jayLEE0301/vq_bet_official.
  overview_zh: |
    VQ-BeT（jayLEE0301/vq_bet_official，《Behavior Generation with Latent Actions》，ICML 2024 Spotlight）是 Behavior Transformer 谱系的行为生成模型：用分层残差 VQ-VAE 对连续动作块做 token 化，再用 GPT 式 transformer 预测这些隐动作码，无需扩散式迭代采样即可刻画多模态示教分布。WorldFoundry 将其作为来自官方仓库的具体算法条目跟踪，通过树内动作运行时适配器接入；权重缺失由运行时 missing_assets 报告，不构成目录阻塞。

    在 WorldFoundry 模型目录中，该条目以 `vqbet` 收录于 `vla_va_wam` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/jayLEE0301/vq_bet_official。
  architecture: |
    Two stages: (1) a residual VQ-VAE learns a discrete hierarchical codebook over short action sequences; (2) a minGPT-style transformer conditioned on observation history (and optionally goals) predicts primary plus residual code indices, with a small offset head refining the decoded continuous actions. Public evaluations span simulated manipulation and self-driving environments plus real-robot tasks; those environments are not part of this entry.
  architecture_zh: |
    两阶段：（1）残差 VQ-VAE 在短动作序列上学习离散分层码本；（2）minGPT 式 transformer 以观测历史（可选目标）为条件，预测主码与残差码索引，另有小的偏移头精修解码后的连续动作。公开评测覆盖仿真操作、自动驾驶环境与真机任务；这些环境不属于本条目。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `vqbet` and runtime profile `runtime-profile:vqbet`.
    Catalog integration status: `runtime_ported`.
    Integration notes recorded in the catalog:
    - Concrete algorithm entry sourced from the official VQ-BeT repository.
    - WorldFoundry routes VQ-BeT through an in-tree action runtime adapter against the concrete VQ-BeT policy.
    - Checkpoint absence is reported by runtime missing_assets and is not a catalog blocker.

    Embodiment contract:
    - Simulator: none bundled — WorldFoundry integrates this entry as an action-inference runtime that emits action traces; closed-loop simulator rollouts are executed by separate benchmark runners, not by this catalog entry.
    - Sensors: visual and/or state observation history per the trained task configuration; goal conditioning is optional.
    - Action space: continuous action chunks decoded from predicted residual-VQ latent codes plus a learned offset.
    - Dedicated environment: no dedicated simulation environment ships with this entry; upstream simulators, datasets, and training stacks are explicitly excluded from the in-tree runtime.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `vqbet`，运行时配置为 `runtime-profile:vqbet`。
    目录集成状态：运行时已移植（runtime_ported）。
    目录中记录的集成备注（保留原文）：
    - Concrete algorithm entry sourced from the official VQ-BeT repository.
    - WorldFoundry routes VQ-BeT through an in-tree action runtime adapter against the concrete VQ-BeT policy.
    - Checkpoint absence is reported by runtime missing_assets and is not a catalog blocker.

    具身接口（embodiment contract）：
    - 仿真器：不内置仿真器——WorldFoundry 将该条目集成为动作推理运行时，输出 action trace；闭环仿真 rollout 由独立的 benchmark runner 执行，不属于本目录条目。
    - 传感器：按训练任务配置的视觉与/或状态观测历史；目标条件可选。
    - 动作空间：由预测的残差 VQ 隐码解码、再加学习偏移量的连续动作块。
    - 是否专用环境：该条目不附带专用仿真环境；上游仿真器、数据集与训练栈被明确排除在 in-tree 运行时之外。
