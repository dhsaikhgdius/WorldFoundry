docs:
  overview: |
    LingBot-VLA (Robbyant/lingbot-vla, Apache-2.0) is the first-generation LingBot VLA with a 4B pretraining checkpoint plus RoboTwin post-train variants (including a depth-augmented one). WorldFoundry integrates the official policy/model, feature transforms, robot mapping, and normalization assets directly in-tree, reusing shared core device selection, compile dispatch, Hugging Face snapshot coordination, and streaming safetensors loading.

    Within the WorldFoundry model catalog this entry is tracked as `lingbot-vla` in the `vla_va_wam` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/Robbyant/lingbot-vla; Hugging Face `robbyant/lingbot-vla-4b`, `robbyant/lingbot-vla-4b-posttrain-robotwin`, `robbyant/lingbot-vla-4b-depth-posttrain-robotwin`.
  overview_zh: |
    LingBot-VLA（Robbyant/lingbot-vla，Apache-2.0）是第一代 LingBot VLA，含 4B 预训练权重及 RoboTwin 后训练变体（包括深度增强版）。WorldFoundry 将官方策略/模型、特征变换、机器人映射与归一化资产直接集成树内，复用共享的设备选择、编译分发、Hugging Face 快照协调与流式 safetensors 加载。

    在 WorldFoundry 模型目录中，该条目以 `lingbot-vla` 收录于 `vla_va_wam` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/Robbyant/lingbot-vla；Hugging Face `robbyant/lingbot-vla-4b`、`robbyant/lingbot-vla-4b-posttrain-robotwin`、`robbyant/lingbot-vla-4b-depth-posttrain-robotwin`。
  architecture: |
    The recorded stack is a 4B vision-language policy (the runner notes reference Qwen2.5-VL processor assets) with post-training on RoboTwin data; the depth post-train variant consumes depth-teacher distillation at training time only. The WebSocket transport, training stack, and depth teacher repositories are not needed for direct policy inference.
  architecture_zh: |
    目录记录的栈为 4B 视觉-语言策略（runner 备注提及 Qwen2.5-VL processor 资产），在 RoboTwin 数据上后训练；深度后训练变体仅在训练期消费深度教师蒸馏。WebSocket 传输、训练栈与深度教师仓库对直接策略推理均非必需。
  usage_notes: |
    No runner target is registered for this entry; the catalog tracks upstream provenance metadata without a runnable in-tree pipeline.
    Catalog integration status: `in_tree_in_process_checkpoint_runtime`.
    Integration notes recorded in the catalog:
    - Official policy/model, feature transforms, robot mapping, and normalization assets are integrated directly in-tree.
    - Runtime uses shared WorldFoundry core device selection, compile dispatch, Hugging Face snapshot coordination, and streaming safetensors loading.
    Recorded variant `lingbot-vla-4b`, task `vla.pretraining`.
    Recorded variant `lingbot-vla-4b-posttrain-robotwin`, task `vla.policy_rollout`.
    Recorded variant `lingbot-vla-4b-depth-posttrain-robotwin`, task `vla.policy_rollout`.

    Embodiment contract:
    - Simulator: none bundled — WorldFoundry integrates this entry as an action-inference runtime that emits action traces; closed-loop simulator rollouts are executed by separate benchmark runners, not by this catalog entry.
    - Sensors: RGB camera observations plus a language instruction; the exact camera/state contract is not recorded in this catalog file.
    - Action space: continuous robot end-effector/joint action chunks; the exact action dimensionality is not recorded in this catalog file.
    - Dedicated environment: no dedicated simulation environment ships with this entry; upstream simulators, datasets, and training stacks are explicitly excluded from the in-tree runtime.
  usage_notes_zh: |
    该条目未注册 runner target；目录仅跟踪上游来源元数据，暂无可运行的 in-tree 管线。
    目录集成状态：`in_tree_in_process_checkpoint_runtime`。
    目录中记录的集成备注（保留原文）：
    - Official policy/model, feature transforms, robot mapping, and normalization assets are integrated directly in-tree.
    - Runtime uses shared WorldFoundry core device selection, compile dispatch, Hugging Face snapshot coordination, and streaming safetensors loading.
    目录记录：变体 `lingbot-vla-4b`，任务 `vla.pretraining`。
    目录记录：变体 `lingbot-vla-4b-posttrain-robotwin`，任务 `vla.policy_rollout`。
    目录记录：变体 `lingbot-vla-4b-depth-posttrain-robotwin`，任务 `vla.policy_rollout`。

    具身接口（embodiment contract）：
    - 仿真器：不内置仿真器——WorldFoundry 将该条目集成为动作推理运行时，输出 action trace；闭环仿真 rollout 由独立的 benchmark runner 执行，不属于本目录条目。
    - 传感器：RGB 相机观测加语言指令；具体相机/状态契约本目录文件未记录。
    - 动作空间：连续的机器人末端/关节动作块；具体动作维度本目录文件未记录。
    - 是否专用环境：该条目不附带专用仿真环境；上游仿真器、数据集与训练栈被明确排除在 in-tree 运行时之外。
