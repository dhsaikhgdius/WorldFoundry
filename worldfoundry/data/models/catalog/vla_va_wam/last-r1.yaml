docs:
  overview: |
    LaST-R1 (CHEN-H01/LaST-R1, MIT) is a VLA/reinforcement-learning policy entry. WorldFoundry routes it through the in-tree official-policy runtime adapter; checkpoint absence (`chenhao01/LaST-R1`) is reported by runtime `missing_assets` and is not a catalog blocker. The repository records modalities (vla, reinforcement_learning, policy_rollout) and sources only.

    Within the WorldFoundry model catalog this entry is tracked as `last-r1` in the `vla_va_wam` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/CHEN-H01/LaST-R1; Hugging Face `chenhao01/LaST-R1`.
