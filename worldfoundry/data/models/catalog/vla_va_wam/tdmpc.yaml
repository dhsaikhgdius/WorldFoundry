docs:
  overview: |
    TD-MPC (nicklashansen/tdmpc, 'Temporal Difference Learning for Model Predictive Control', ICML 2022) is a model-based reinforcement-learning algorithm rather than a VLA: it learns a task-oriented latent dynamics model (TOLD) and combines short-horizon MPC planning in latent space with a terminal value function learned by temporal-difference learning. Its public evaluations cover DMControl and Meta-World continuous-control suites. WorldFoundry tracks it as a concrete algorithm entry sourced from the official repository (not the LeRobot policy zoo) and routes it through an in-tree action runtime adapter; checkpoint absence is reported by runtime missing_assets and is not a catalog blocker.

    Within the WorldFoundry model catalog this entry is tracked as `tdmpc` in the `vla_va_wam` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/nicklashansen/tdmpc.
  overview_zh: |
    TD-MPC（nicklashansen/tdmpc，《Temporal Difference Learning for Model Predictive Control》，ICML 2022）是基于模型的强化学习算法而非 VLA：它学习任务导向的隐空间动力学模型（TOLD），把隐空间短时程 MPC 规划与时间差分学习得到的终端价值函数结合。其公开评测覆盖 DMControl 与 Meta-World 连续控制套件。WorldFoundry 将其作为来自官方仓库的具体算法条目跟踪（不经 LeRobot policy zoo），通过树内动作运行时适配器接入；权重缺失由运行时 missing_assets 报告，不构成目录阻塞。

    在 WorldFoundry 模型目录中，该条目以 `tdmpc` 收录于 `vla_va_wam` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/nicklashansen/tdmpc。
  architecture: |
    TOLD consists of an encoder into a latent state, a latent dynamics head, and reward/value/policy heads, all trained jointly; at decision time, MPPI-style sampling plans action sequences over a short latent horizon, with the learned value function bootstrapping beyond the horizon and a learned policy prior accelerating the search. It supports both state and pixel observations.
  architecture_zh: |
    TOLD 由隐状态编码器、隐空间动力学头与奖励/价值/策略头组成，联合训练；决策时用 MPPI 式采样在短隐空间时程上规划动作序列，学习到的价值函数在时程外做自举，学习到的策略先验加速搜索。支持状态与像素两种观测。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `tdmpc` and runtime profile `runtime-profile:tdmpc`.
    Catalog integration status: `runtime_ported`.
    Integration notes recorded in the catalog:
    - Concrete algorithm entry sourced from the official TD-MPC repository, not from the generic LeRobot policy zoo.
    - WorldFoundry routes TD-MPC through an in-tree action runtime adapter against the concrete TD-MPC policy.
    - Checkpoint absence is reported by runtime missing_assets and is not a catalog blocker.

    Embodiment contract:
    - Simulator: none bundled — the algorithm is publicly evaluated on DMControl and Meta-World; those simulators are not part of this catalog entry.
    - Sensors: low-dimensional proprioceptive state or raw pixels, per the trained task configuration; no language input.
    - Action space: continuous control actions selected by latent-space MPC planning; dimensionality follows the trained environment.
    - Dedicated environment: no dedicated simulation environment ships with this entry; upstream simulators, datasets, and training stacks are explicitly excluded from the in-tree runtime.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `tdmpc`，运行时配置为 `runtime-profile:tdmpc`。
    目录集成状态：运行时已移植（runtime_ported）。
    目录中记录的集成备注（保留原文）：
    - Concrete algorithm entry sourced from the official TD-MPC repository, not from the generic LeRobot policy zoo.
    - WorldFoundry routes TD-MPC through an in-tree action runtime adapter against the concrete TD-MPC policy.
    - Checkpoint absence is reported by runtime missing_assets and is not a catalog blocker.

    具身接口（embodiment contract）：
    - 仿真器：不内置仿真器——该算法公开评测于 DMControl 与 Meta-World；这些仿真器不属于本目录条目。
    - 传感器：低维本体状态或原始像素（取决于训练任务配置）；无语言输入。
    - 动作空间：由隐空间 MPC 规划选择的连续控制动作；维度取决于训练环境。
    - 是否专用环境：该条目不附带专用仿真环境；上游仿真器、数据集与训练栈被明确排除在 in-tree 运行时之外。
