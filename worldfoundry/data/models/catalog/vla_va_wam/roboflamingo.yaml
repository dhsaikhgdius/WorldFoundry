docs:
  overview: |
    RoboFlamingo (RoboFlamingo/RoboFlamingo, ICLR 2024 Spotlight) adapts the open-source OpenFlamingo VLM into a language-conditioned robot manipulation policy with a deliberately cheap fine-tuning recipe: the VLM backbone stays frozen and only a lightweight policy head is trained on manipulation demonstrations, achieving state-of-the-art results on the CALVIN long-horizon benchmark at the time. WorldFoundry vendors the RoboFlamingo/OpenFlamingo architecture and inference source in tree; the public pipeline passed CUDA action_trace validation with the staged RoboFlamingo, OpenFlamingo, and MPT checkpoints.

    Within the WorldFoundry model catalog this entry is tracked as `roboflamingo` in the `vla_va_wam` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/RoboFlamingo/RoboFlamingo.
  overview_zh: |
    RoboFlamingo（RoboFlamingo/RoboFlamingo，ICLR 2024 Spotlight）把开源 OpenFlamingo VLM 改造为语言条件的机器人操作策略，微调代价刻意做低：冻结 VLM 骨干，只在操作示教上训练轻量策略头，当时在 CALVIN 长时程基准上取得最先进结果。WorldFoundry 在树内内嵌 RoboFlamingo/OpenFlamingo 架构与推理源码；公开管线用暂存的 RoboFlamingo、OpenFlamingo 与 MPT 权重通过了 CUDA action_trace 验证。

    在 WorldFoundry 模型目录中，该条目以 `roboflamingo` 收录于 `vla_va_wam` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/RoboFlamingo/RoboFlamingo。
  architecture: |
    The published architecture keeps OpenFlamingo's design — a frozen language model (the staged in-tree route uses an MPT backbone) with gated cross-attention layers over CLIP ViT visual features — and appends a recurrent (LSTM-based) policy head that consumes per-step VLM features and history to output continuous end-effector actions plus a gripper command. Only the policy head and cross-attention adaptation are fine-tuned on CALVIN demonstrations.
  architecture_zh: |
    公开架构保留 OpenFlamingo 设计——冻结语言模型（树内暂存路线使用 MPT 骨干）加对 CLIP ViT 视觉特征的门控交叉注意力层——并追加一个循环（LSTM）策略头，消费逐步 VLM 特征与历史，输出连续末端动作加夹爪指令。仅策略头与交叉注意力适配部分在 CALVIN 示教上微调。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `roboflamingo` and runtime profile `runtime-profile:roboflamingo`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - RoboFlamingo/OpenFlamingo architecture and inference source are vendored in-tree; public pipeline CUDA action_trace validation passed.

    Embodiment contract:
    - Simulator: none bundled — WorldFoundry integrates this entry as an action-inference runtime that emits action traces; closed-loop simulator rollouts are executed by separate benchmark runners, not by this catalog entry.
    - Sensors: the CALVIN observation contract: a static RGB camera and a gripper RGB camera plus a language instruction.
    - Action space: 7-DoF continuous actions (6-DoF relative end-effector pose plus binary gripper), one step per pass with recurrent history.
    - Dedicated environment: no dedicated simulation environment ships with this entry; upstream simulators, datasets, and training stacks are explicitly excluded from the in-tree runtime.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `roboflamingo`，运行时配置为 `runtime-profile:roboflamingo`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - RoboFlamingo/OpenFlamingo architecture and inference source are vendored in-tree; public pipeline CUDA action_trace validation passed.

    具身接口（embodiment contract）：
    - 仿真器：不内置仿真器——WorldFoundry 将该条目集成为动作推理运行时，输出 action trace；闭环仿真 rollout 由独立的 benchmark runner 执行，不属于本目录条目。
    - 传感器：CALVIN 观测契约：静态 RGB 相机与夹爪 RGB 相机，加语言指令。
    - 动作空间：7 自由度连续动作（6 自由度相对末端位姿加二值夹爪），带循环历史逐步输出。
    - 是否专用环境：该条目不附带专用仿真环境；上游仿真器、数据集与训练栈被明确排除在 in-tree 运行时之外。
