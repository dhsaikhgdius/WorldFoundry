docs:
  overview: |
    EventVLA (InternRobotics/EventVLA, MIT) is a VLA policy with long-horizon memory: WorldFoundry runs Qwen3-VL encoding, action-token gathering, a checkpoint-compatible MLP action head, an event head, temporal anchors, and raw keyframe-image memory in process. Local assets (`ganlinyang/EventVLA` plus the `Qwen/Qwen3-VL-4B-Instruct` backbone) are restored strictly; no upstream checkout, server, or custom Hub implementation is loaded.

    Within the WorldFoundry model catalog this entry is tracked as `eventvla` in the `vla_va_wam` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/InternRobotics/EventVLA; Hugging Face `ganlinyang/EventVLA`, `Qwen/Qwen3-VL-4B-Instruct`.
  overview_zh: |
    EventVLA（InternRobotics/EventVLA，MIT）是具备长时程记忆的 VLA 策略：WorldFoundry 在进程内运行 Qwen3-VL 编码、action-token 收集、与权重兼容的 MLP 动作头、事件头、时间锚点与原始关键帧图像记忆。本地资产（`ganlinyang/EventVLA` 加 `Qwen/Qwen3-VL-4B-Instruct` 骨干）严格恢复；不加载上游 checkout、服务器或自定义 Hub 实现。

    在 WorldFoundry 模型目录中，该条目以 `eventvla` 收录于 `vla_va_wam` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/InternRobotics/EventVLA；Hugging Face `ganlinyang/EventVLA`、`Qwen/Qwen3-VL-4B-Instruct`。
  architecture: |
    Per the integration notes, the architecture extends a Qwen3-VL-4B vision-language backbone with an MLP action head, a dedicated event head, temporal anchors, and a raw keyframe-image memory for long-horizon action prediction. Training, datasets, simulators, benchmark launchers, and WebSocket transport are excluded. Further details are not recorded in the repository.
  architecture_zh: |
    按集成备注，架构在 Qwen3-VL-4B 视觉-语言骨干上扩展 MLP 动作头、专用事件头、时间锚点与原始关键帧图像记忆，用于长时程动作预测。训练、数据集、仿真器、基准启动器与 WebSocket 传输被排除。更多细节仓库未记录。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `eventvla` and runtime profile `runtime-profile:eventvla`.
    Catalog integration status: `in_tree_checkpoint_runtime`.
    Integration notes recorded in the catalog:
    - Qwen3-VL encoding, action-token gathering, the checkpoint-compatible MLP action head, event head, temporal anchors, and raw keyframe-image memory run in process.
    - Local assets are restored strictly; no upstream checkout, server, or custom Hub implementation is loaded.
    - Training, datasets, simulators, benchmark launchers, and WebSocket transport are excluded.

    Embodiment contract:
    - Simulator: none bundled — WorldFoundry integrates this entry as an action-inference runtime that emits action traces; closed-loop simulator rollouts are executed by separate benchmark runners, not by this catalog entry.
    - Sensors: RGB observations plus a language instruction, with keyframe-image memory retained across steps per the recorded runtime contract.
    - Action space: continuous robot end-effector/joint action chunks; the exact action dimensionality is not recorded in this catalog file.
    - Dedicated environment: no dedicated simulation environment ships with this entry; upstream simulators, datasets, and training stacks are explicitly excluded from the in-tree runtime.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `eventvla`，运行时配置为 `runtime-profile:eventvla`。
    目录集成状态：`in_tree_checkpoint_runtime`。
    目录中记录的集成备注（保留原文）：
    - Qwen3-VL encoding, action-token gathering, the checkpoint-compatible MLP action head, event head, temporal anchors, and raw keyframe-image memory run in process.
    - Local assets are restored strictly; no upstream checkout, server, or custom Hub implementation is loaded.
    - Training, datasets, simulators, benchmark launchers, and WebSocket transport are excluded.

    具身接口（embodiment contract）：
    - 仿真器：不内置仿真器——WorldFoundry 将该条目集成为动作推理运行时，输出 action trace；闭环仿真 rollout 由独立的 benchmark runner 执行，不属于本目录条目。
    - 传感器：RGB 观测加语言指令，并按目录记录的运行时契约跨步保留关键帧图像记忆。
    - 动作空间：连续的机器人末端/关节动作块；具体动作维度本目录文件未记录。
    - 是否专用环境：该条目不附带专用仿真环境；上游仿真器、数据集与训练栈被明确排除在 in-tree 运行时之外。
  limitations: |
