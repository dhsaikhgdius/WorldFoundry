    - The pinned pretrained foundation checkpoint and released statistics are staged; numerical and GPU rollout validation remain pending.
    - Any downstream fine-tune must remain paired with the exact statistics emitted during that fine-tune.

    The release is non-commercial (CC-BY-NC-SA-4.0). The pinned pretrained foundation checkpoint and released statistics are staged; numerical and GPU rollout validation remain pending, and any downstream fine-tune must stay paired with the exact statistics emitted during that fine-tune.

    This documentation only restates metadata already recorded in the catalog; it claims no GPU execution evidence beyond the parity fields above.
