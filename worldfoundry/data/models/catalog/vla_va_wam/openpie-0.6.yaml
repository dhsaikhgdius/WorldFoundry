docs:
  overview: |
    OpenPIE 0.6 (exla-ai/fla; checkpoint `exla-ai/openpie-0.6`, open weights) is tracked as its own model entry, separate from OpenPI pi0/pi0.5. WorldFoundry routes it through the in-tree official-policy runtime using the FLA policy factory; checkpoint absence is reported by runtime `missing_assets` and is not a catalog blocker.

    Within the WorldFoundry model catalog this entry is tracked as `openpie-0.6` in the `vla_va_wam` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/exla-ai/fla; Hugging Face `exla-ai/openpie-0.6`.
  overview_zh: |
    OpenPIE 0.6（exla-ai/fla；权重 `exla-ai/openpie-0.6`，开放权重）作为独立模型条目跟踪，与 OpenPI 的 pi0/pi0.5 区分。WorldFoundry 通过树内官方策略运行时以 FLA 策略工厂接入；权重缺失由运行时 `missing_assets` 报告，不构成目录阻塞。

    在 WorldFoundry 模型目录中，该条目以 `openpie-0.6` 收录于 `vla_va_wam` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/exla-ai/fla；Hugging Face `exla-ai/openpie-0.6`。
  architecture: |
    The repository records only the FLA policy-factory route, the open-weights availability, and the official sources. Architecture details are not recorded in the repository.
  architecture_zh: |
    仓库仅记录 FLA 策略工厂路线、开放权重可用性与官方来源；除此之外的架构细节（骨干网络、参数量、训练数据与动作头设计）仓库未记录。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `openpie-0.6` and runtime profile `runtime-profile:openpie-0.6`.
    Catalog integration status: `runtime_ported`.
    Integration notes recorded in the catalog:
    - OpenPIE 0.6 is tracked as its own model entry, separate from OpenPI pi0/pi0.5.
    - WorldFoundry routes OpenPIE 0.6 through the in-tree official-policy runtime using the FLA policy factory.
    - Checkpoint absence is reported by runtime missing_assets and is not a catalog blocker.

    Embodiment contract:
    - Simulator: none bundled — WorldFoundry integrates this entry as an action-inference runtime that emits action traces; closed-loop simulator rollouts are executed by separate benchmark runners, not by this catalog entry.
    - Sensors: RGB camera observations plus a language instruction; the exact camera/state contract is not recorded in this catalog file.
    - Action space: continuous robot end-effector/joint action chunks; the exact action dimensionality is not recorded in this catalog file.
    - Dedicated environment: no dedicated simulation environment ships with this entry; upstream simulators, datasets, and training stacks are explicitly excluded from the in-tree runtime.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `openpie-0.6`，运行时配置为 `runtime-profile:openpie-0.6`。
    目录集成状态：运行时已移植（runtime_ported）。
    目录中记录的集成备注（保留原文）：
    - OpenPIE 0.6 is tracked as its own model entry, separate from OpenPI pi0/pi0.5.
    - WorldFoundry routes OpenPIE 0.6 through the in-tree official-policy runtime using the FLA policy factory.
    - Checkpoint absence is reported by runtime missing_assets and is not a catalog blocker.

    具身接口（embodiment contract）：
    - 仿真器：不内置仿真器——WorldFoundry 将该条目集成为动作推理运行时，输出 action trace；闭环仿真 rollout 由独立的 benchmark runner 执行，不属于本目录条目。
    - 传感器：RGB 相机观测加语言指令；具体相机/状态契约本目录文件未记录。
    - 动作空间：连续的机器人末端/关节动作块；具体动作维度本目录文件未记录。
    - 是否专用环境：该条目不附带专用仿真环境；上游仿真器、数据集与训练栈被明确排除在 in-tree 运行时之外。
