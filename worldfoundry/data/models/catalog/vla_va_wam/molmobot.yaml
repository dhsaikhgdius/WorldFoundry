docs:
  overview: |
    MolmoBot (allenai/MolmoBot, Apache-2.0) is AI2's robot policy family in the Molmo lineage, with released DROID, image-DROID, RBY1 multitask, and Pi0-DROID checkpoints. WorldFoundry records the MolmoBot OLMo/MolmoBot-Pi0 action inference contracts with an independent synthesis entrypoint calling the flattened in-tree SynthManip wrapper under `worldfoundry/synthesis/action_generation/molmobot`; resolver, runtime import, and compileall checks pass without an external checkout, while checkpoint-backed action-chunk validation remains required before demo parity is claimed.

    Within the WorldFoundry model catalog this entry is tracked as `molmobot` in the `vla_va_wam` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/allenai/MolmoBot; Hugging Face `allenai/MolmoBot-DROID`, `allenai/MolmoBot-Img-DROID`, `allenai/MolmoBot-RBY1Multitask`, `allenai/MolmoBot-Pi0-DROID`.
  overview_zh: |
    MolmoBot（allenai/MolmoBot，Apache-2.0）是 AI2 Molmo 谱系的机器人策略家族，发布了 DROID、图像版 DROID、RBY1 多任务与 Pi0-DROID 权重。WorldFoundry 以独立合成入口记录 MolmoBot OLMo/MolmoBot-Pi0 动作推理契约，调用 `worldfoundry/synthesis/action_generation/molmobot` 下扁平化的树内 SynthManip 包装器；解析器、运行时导入与 compileall 检查无需外部 checkout 即通过，但在声称演示一致性之前仍需权重支撑的动作块验证。

    在 WorldFoundry 模型目录中，该条目以 `molmobot` 收录于 `vla_va_wam` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/allenai/MolmoBot；Hugging Face `allenai/MolmoBot-DROID`、`allenai/MolmoBot-Img-DROID`、`allenai/MolmoBot-RBY1Multitask`、`allenai/MolmoBot-Pi0-DROID`。
  architecture: |
    The recorded contracts are: the OLMo-backboned MolmoBot served via `launch_scripts/serve_molmo.py --hf-repo allenai/MolmoBot-DROID`, and the MolmoBot-Pi0 route using `PiJointPosPolicy` with qpos arm/gripper, `exo_camera_1`, `wrist_camera`, and a task prompt. Further architecture details are not recorded in the repository.
  architecture_zh: |
    目录记录的契约为：以 OLMo 为骨干的 MolmoBot 通过 `launch_scripts/serve_molmo.py --hf-repo allenai/MolmoBot-DROID` 提供服务；MolmoBot-Pi0 路线使用 `PiJointPosPolicy`，输入 qpos 手臂/夹爪、`exo_camera_1`、`wrist_camera` 与任务提示。更多架构细节仓库未记录。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `molmobot` and runtime profile `runtime-profile:molmobot`.
    Catalog integration status: `in_tree_import_verification_in_progress`.
    Integration notes recorded in the catalog:
    - WorldFoundry records MolmoBot OLMo/MolmoBot-Pi0 action inference contracts with an independent synthesis entrypoint.
    - The current runtime directly calls the flattened in-tree SynthManip MolmoBot inference wrapper under worldfoundry/synthesis/action_generation/molmobot.
    - Resolver, runtime import, and compileall checks pass without an external github_repos checkout; checkpoint-backed action chunk validation remains required before demo parity is claimed.
    Recorded variant `molmobot-droid`, task `vla.policy_rollout`.
    Recorded variant `molmobot-pi0-droid`, task `vla.policy_rollout`.

    Embodiment contract:
    - Simulator: none bundled — WorldFoundry integrates this entry as an action-inference runtime that emits action traces; closed-loop simulator rollouts are executed by separate benchmark runners, not by this catalog entry.
    - Sensors: external and wrist RGB cameras plus joint positions (qpos) and a task prompt, per the recorded Pi0-DROID demo contract.
    - Action space: continuous robot end-effector/joint action chunks; the exact action dimensionality is not recorded in this catalog file.
    - Dedicated environment: no dedicated simulation environment ships with this entry; upstream simulators, datasets, and training stacks are explicitly excluded from the in-tree runtime.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `molmobot`，运行时配置为 `runtime-profile:molmobot`。
    目录集成状态：`in_tree_import_verification_in_progress`。
    目录中记录的集成备注（保留原文）：
    - WorldFoundry records MolmoBot OLMo/MolmoBot-Pi0 action inference contracts with an independent synthesis entrypoint.
    - The current runtime directly calls the flattened in-tree SynthManip MolmoBot inference wrapper under worldfoundry/synthesis/action_generation/molmobot.
    - Resolver, runtime import, and compileall checks pass without an external github_repos checkout; checkpoint-backed action chunk validation remains required before demo parity is claimed.
    目录记录：变体 `molmobot-droid`，任务 `vla.policy_rollout`。
    目录记录：变体 `molmobot-pi0-droid`，任务 `vla.policy_rollout`。

    具身接口（embodiment contract）：
    - 仿真器：不内置仿真器——WorldFoundry 将该条目集成为动作推理运行时，输出 action trace；闭环仿真 rollout 由独立的 benchmark runner 执行，不属于本目录条目。
    - 传感器：外部与腕部 RGB 相机加关节位置（qpos）与任务提示（按目录记录的 Pi0-DROID 演示契约）。
    - 动作空间：连续的机器人末端/关节动作块；具体动作维度本目录文件未记录。
    - 是否专用环境：该条目不附带专用仿真环境；上游仿真器、数据集与训练栈被明确排除在 in-tree 运行时之外。
