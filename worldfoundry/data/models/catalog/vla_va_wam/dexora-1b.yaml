docs:
  overview: |
    Dexora 1B (dexoravla/Dexora, MIT) is a 1B-parameter RDT-based policy for bimanual dexterous manipulation with a 36-DoF action contract. WorldFoundry keeps the 1B RDT policy, SigLIP/T5 encoders, strict checkpoint loader, and diffusion sampler in-tree. The authors publish data and training code but no official policy weight repository, so the runtime requires a locally trained Stage-1 or Stage-3 checkpoint.

    Within the WorldFoundry model catalog this entry is tracked as `dexora-1b` in the `vla_va_wam` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/dexoravla/Dexora.
  overview_zh: |
    Dexora 1B（dexoravla/Dexora，MIT）是基于 RDT 的 10 亿参数双臂灵巧操作策略，动作契约为 36 自由度。WorldFoundry 在树内保留 1B RDT 策略、SigLIP/T5 编码器、严格权重加载器与扩散采样器。作者公开了数据与训练代码但没有官方策略权重仓库，因此运行时需要本地训练的 Stage-1 或 Stage-3 权重。

    在 WorldFoundry 模型目录中，该条目以 `dexora-1b` 收录于 `vla_va_wam` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/dexoravla/Dexora。
  architecture: |
    Per the integration notes, the architecture is an RDT-style (Robotics Diffusion Transformer) 1B policy with SigLIP vision and T5 language encoders and a diffusion action sampler over a 36-DoF bimanual dexterous action space. Training, datasets, teleoperation, ZMQ services, robot SDKs, and simulator code are excluded from the in-tree runtime.
  architecture_zh: |
    按集成备注，架构为 RDT 式（Robotics Diffusion Transformer）1B 策略，配 SigLIP 视觉与 T5 语言编码器，在 36 自由度双臂灵巧动作空间上做扩散采样。训练、数据集、遥操作、ZMQ 服务、机器人 SDK 与仿真器代码被排除在树内运行时之外。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `dexora-1b` and runtime profile `runtime-profile:dexora-1b`.
    Catalog integration status: `in_tree_checkpoint_runtime`.
    Integration notes recorded in the catalog:
    - The 1B RDT policy, SigLIP/T5 encoders, strict checkpoint loader, diffusion sampler, and 36-DoF action contract are in-tree.
    - The authors publish data and training code but no official policy weight repository; runtime therefore requires a locally trained Stage-1 or Stage-3 checkpoint.
    - Training, datasets, teleoperation, ZMQ services, robot SDKs, and simulator code are excluded.

    Embodiment contract:
    - Simulator: none bundled — WorldFoundry integrates this entry as an action-inference runtime that emits action traces; closed-loop simulator rollouts are executed by separate benchmark runners, not by this catalog entry.
    - Sensors: RGB camera observations plus a language instruction; the exact camera/state contract is not recorded in this catalog file.
    - Action space: a 36-DoF bimanual dexterous action vector per step, per the recorded in-tree action contract.
    - Dedicated environment: no dedicated simulation environment ships with this entry; upstream simulators, datasets, and training stacks are explicitly excluded from the in-tree runtime.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `dexora-1b`，运行时配置为 `runtime-profile:dexora-1b`。
    目录集成状态：`in_tree_checkpoint_runtime`。
    目录中记录的集成备注（保留原文）：
    - The 1B RDT policy, SigLIP/T5 encoders, strict checkpoint loader, diffusion sampler, and 36-DoF action contract are in-tree.
    - The authors publish data and training code but no official policy weight repository; runtime therefore requires a locally trained Stage-1 or Stage-3 checkpoint.
    - Training, datasets, teleoperation, ZMQ services, robot SDKs, and simulator code are excluded.

    具身接口（embodiment contract）：
    - 仿真器：不内置仿真器——WorldFoundry 将该条目集成为动作推理运行时，输出 action trace；闭环仿真 rollout 由独立的 benchmark runner 执行，不属于本目录条目。
    - 传感器：RGB 相机观测加语言指令；具体相机/状态契约本目录文件未记录。
    - 动作空间：每步 36 自由度的双臂灵巧动作向量（按目录记录的树内动作契约）。
    - 是否专用环境：该条目不附带专用仿真环境；上游仿真器、数据集与训练栈被明确排除在 in-tree 运行时之外。
