docs:
  overview: |
    Multi-task DiT Policy is a diffusion-transformer imitation policy tracked from the LeRobot collection: no separate official repository was identified, so the concrete LeRobot `multi_task_dit` policy is the reference source. WorldFoundry routes it through an in-tree action runtime adapter; checkpoint absence is reported by runtime `missing_assets` and is not a catalog blocker.

    Within the WorldFoundry model catalog this entry is tracked as `multi-task-dit` in the `vla_va_wam` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/huggingface/lerobot.
  overview_zh: |
    Multi-task DiT Policy 是从 LeRobot 集合跟踪的扩散 transformer 模仿策略：未识别到独立官方仓库，故以 LeRobot 具体的 `multi_task_dit` 策略为参考源。WorldFoundry 通过树内动作运行时适配器接入；权重缺失由运行时 `missing_assets` 报告，不构成目录阻塞。

    在 WorldFoundry 模型目录中，该条目以 `multi-task-dit` 收录于 `vla_va_wam` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/huggingface/lerobot。
  architecture: |
    A DiT-style diffusion transformer denoises action sequences conditioned on visual observations and task conditioning for multi-task imitation learning. The repository records only the LeRobot reference route; further details are not recorded.
  architecture_zh: |
    DiT 式扩散 transformer 以视觉观测与任务条件为条件，对动作序列去噪，用于多任务模仿学习。仓库仅记录 LeRobot 参考路线；更多细节未记录。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `multi-task-dit` and runtime profile `runtime-profile:multi-task-dit`.
    Catalog integration status: `runtime_ported`.
    Integration notes recorded in the catalog:
    - No separate official repository was identified; use the concrete LeRobot multi_task_dit policy as reference source.
    - WorldFoundry routes Multi-task DiT through an in-tree action runtime adapter against the concrete policy.
    - Checkpoint absence is reported by runtime missing_assets and is not a catalog blocker.

    Embodiment contract:
    - Simulator: none bundled — WorldFoundry integrates this entry as an action-inference runtime that emits action traces; closed-loop simulator rollouts are executed by separate benchmark runners, not by this catalog entry.
    - Sensors: RGB camera observations plus a language instruction; the exact camera/state contract is not recorded in this catalog file.
    - Action space: continuous robot end-effector/joint action chunks; the exact action dimensionality is not recorded in this catalog file.
    - Dedicated environment: no dedicated simulation environment ships with this entry; upstream simulators, datasets, and training stacks are explicitly excluded from the in-tree runtime.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `multi-task-dit`，运行时配置为 `runtime-profile:multi-task-dit`。
    目录集成状态：运行时已移植（runtime_ported）。
    目录中记录的集成备注（保留原文）：
    - No separate official repository was identified; use the concrete LeRobot multi_task_dit policy as reference source.
    - WorldFoundry routes Multi-task DiT through an in-tree action runtime adapter against the concrete policy.
    - Checkpoint absence is reported by runtime missing_assets and is not a catalog blocker.

    具身接口（embodiment contract）：
    - 仿真器：不内置仿真器——WorldFoundry 将该条目集成为动作推理运行时，输出 action trace；闭环仿真 rollout 由独立的 benchmark runner 执行，不属于本目录条目。
    - 传感器：RGB 相机观测加语言指令；具体相机/状态契约本目录文件未记录。
    - 动作空间：连续的机器人末端/关节动作块；具体动作维度本目录文件未记录。
    - 是否专用环境：该条目不附带专用仿真环境；上游仿真器、数据集与训练栈被明确排除在 in-tree 运行时之外。
