docs:
  overview: |
    Gaussian Actor is a reinforcement-learning actor policy tracked from the LeRobot policy collection: no separate official repository was identified, so the concrete LeRobot `gaussian_actor` policy is the reference source. WorldFoundry routes it through an in-tree action runtime adapter; checkpoint absence is reported by runtime `missing_assets` and is not a catalog blocker.

    Within the WorldFoundry model catalog this entry is tracked as `gaussian-actor` in the `vla_va_wam` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/huggingface/lerobot.
  overview_zh: |
    Gaussian Actor 是从 LeRobot 策略集合中跟踪的强化学习 actor 策略：未识别到独立官方仓库，因此以 LeRobot 的具体 `gaussian_actor` 策略为参考源。WorldFoundry 通过树内动作运行时适配器接入；权重缺失由运行时 `missing_assets` 报告，不构成目录阻塞。

    在 WorldFoundry 模型目录中，该条目以 `gaussian-actor` 收录于 `vla_va_wam` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/huggingface/lerobot。
  architecture: |
    A Gaussian actor outputs a parameterized Gaussian distribution over continuous actions (mean and variance heads over encoded observations), the standard actor form in actor-critic RL. The repository records only the LeRobot reference route; further details are not recorded.
  architecture_zh: |
    Gaussian actor 在连续动作上输出参数化高斯分布（对编码观测输出均值与方差头），是 actor-critic 强化学习中的标准 actor 形式。仓库仅记录 LeRobot 参考路线；更多细节未记录。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `gaussian-actor` and runtime profile `runtime-profile:gaussian-actor`.
    Catalog integration status: `runtime_ported`.
    Integration notes recorded in the catalog:
    - No separate official repository was identified; use the concrete LeRobot gaussian_actor policy as reference source.
    - WorldFoundry routes Gaussian Actor through an in-tree action runtime adapter against the concrete policy.
    - Checkpoint absence is reported by runtime missing_assets and is not a catalog blocker.

    Embodiment contract:
    - Simulator: none bundled — WorldFoundry integrates this entry as an action-inference runtime that emits action traces; closed-loop simulator rollouts are executed by separate benchmark runners, not by this catalog entry.
    - Sensors: RGB camera observations plus a language instruction; the exact camera/state contract is not recorded in this catalog file.
    - Action space: continuous robot end-effector/joint action chunks; the exact action dimensionality is not recorded in this catalog file.
    - Dedicated environment: no dedicated simulation environment ships with this entry; upstream simulators, datasets, and training stacks are explicitly excluded from the in-tree runtime.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `gaussian-actor`，运行时配置为 `runtime-profile:gaussian-actor`。
    目录集成状态：运行时已移植（runtime_ported）。
    目录中记录的集成备注（保留原文）：
    - No separate official repository was identified; use the concrete LeRobot gaussian_actor policy as reference source.
    - WorldFoundry routes Gaussian Actor through an in-tree action runtime adapter against the concrete policy.
