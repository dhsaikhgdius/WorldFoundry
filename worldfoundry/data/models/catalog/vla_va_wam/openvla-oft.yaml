docs:
  overview: |
    OpenVLA-OFT (moojink/openvla-oft, MIT) is the Optimized Fine-Tuning recipe for OpenVLA, published as 'Fine-Tuning Vision-Language-Action Models: Optimizing Speed and Success': it replaces autoregressive token decoding with parallel decoding plus action chunking and a continuous action head, yielding large gains in both control frequency and LIBERO success rate. WorldFoundry has a flat, inference-only in-tree runtime for HF/local checkpoints, action heads, proprio/noisy-action projectors, and official LIBERO observation inputs. A100 validation restored 7,541,237,184 parameters and produced finite deterministic 8x7 action chunks with 14.47 GiB peak VRAM; all five declared LIBERO checkpoints completed real inference.

    Within the WorldFoundry model catalog this entry is tracked as `openvla-oft` in the `vla_va_wam` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/moojink/openvla-oft; Hugging Face `moojink/openvla-7b-oft-finetuned-libero-spatial`, `moojink/openvla-7b-oft-finetuned-libero-object`, `moojink/openvla-7b-oft-finetuned-libero-goal`, `moojink/openvla-7b-oft-finetuned-libero-10`, `moojink/openvla-7b-oft-finetuned-libero-spatial-object-goal-10`.
  overview_zh: |
    OpenVLA-OFT（moojink/openvla-oft，MIT）是 OpenVLA 的优化微调（Optimized Fine-Tuning）方案，出自论文《Fine-Tuning Vision-Language-Action Models: Optimizing Speed and Success》：用并行解码加动作块与连续动作头替代自回归 token 解码，在控制频率与 LIBERO 成功率上均大幅提升。WorldFoundry 提供扁平化、仅推理的树内运行时，覆盖 HF/本地权重、动作头、本体/噪声动作投影器与官方 LIBERO 观测输入。A100 验证恢复 7,541,237,184 个参数并产出有限、确定性的 8x7 动作块，峰值显存 14.47 GiB；已声明的五个 LIBERO 权重全部完成真实推理。

    在 WorldFoundry 模型目录中，该条目以 `openvla-oft` 收录于 `vla_va_wam` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/moojink/openvla-oft；Hugging Face `moojink/openvla-7b-oft-finetuned-libero-spatial`、`moojink/openvla-7b-oft-finetuned-libero-object`、`moojink/openvla-7b-oft-finetuned-libero-goal`、`moojink/openvla-7b-oft-finetuned-libero-10`、`moojink/openvla-7b-oft-finetuned-libero-spatial-object-goal-10`。
  architecture: |
    The base model is OpenVLA-7B (Prismatic VLM: Llama-2-7B language backbone with fused SigLIP + DINOv2 visual encoders). The OFT recipe adds bidirectional attention for parallel action decoding, an L1-regression continuous action head that predicts an 8-step chunk of 7-DoF actions, optional FiLM language conditioning, and wrist-camera plus proprioceptive-state inputs. Attention is hardware-resolved in tree: FlashAttention 2 on compatible Ampere/Ada/Hopper installs with portable PyTorch SDPA fallback (including Blackwell).
  architecture_zh: |
    基座为 OpenVLA-7B（Prismatic VLM：Llama-2-7B 语言骨干加 SigLIP 与 DINOv2 融合视觉编码器）。OFT 方案增加了用于并行动作解码的双向注意力、预测 8 步 7 自由度动作块的 L1 回归连续动作头、可选 FiLM 语言调制，以及腕部相机与本体状态输入。注意力在树内按硬件解析：兼容的 Ampere/Ada/Hopper 上用 FlashAttention 2，其他 NVIDIA 架构（含 Blackwell）回退到可移植的 PyTorch SDPA。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `openvla-oft` and runtime profile `runtime-profile:openvla-oft`.
    Catalog integration status: `checkpoint_gpu_validated`.
    Integration notes recorded in the catalog:
    - WorldFoundry has a flat, inference-only in-tree OpenVLA-OFT runtime for HF/local checkpoints, action heads, proprio/noisy-action projectors, and official LIBERO observation inputs.
    - A100-SXM4-80GB validation restored 7,541,237,184 model parameters and produced finite deterministic 8x7 actions for multiple image/state/prompt inputs; peak allocated VRAM was 14.47 GiB.
    - All five declared LIBERO checkpoints completed real Workspace inference and produced finite 8x7 action chunks.
    - {'Attention is hardware-resolved': 'usable FlashAttention 2 is selected on compatible Ampere/Ada/Hopper installs, with portable PyTorch SDPA fallback for other NVIDIA architectures including Blackwell.'}
    - Training, RLDS data processing, TensorFlow data tooling, and LIBERO benchmark loops are intentionally excluded.
    Recorded variant `openvla-oft-libero-spatial`, task `vla.policy_rollout`.
    Recorded variant `openvla-oft-libero-object`, task `vla.policy_rollout`.
    Recorded variant `openvla-oft-libero-goal`, task `vla.policy_rollout`.
    Recorded variant `openvla-oft-libero-10`, task `vla.policy_rollout`.
