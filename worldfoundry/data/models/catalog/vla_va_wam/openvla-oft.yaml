    Embodiment contract:
    - Simulator: none bundled — the five released checkpoints target the LIBERO benchmark suites (spatial/object/goal/10 and a combined checkpoint); the LIBERO benchmark loop itself is intentionally excluded from the minimal runtime profile.
    - Sensors: the official LIBERO observation contract: full_image, wrist_image, proprioceptive state, and task_description (per the recorded demo, loaded from sample_libero_spatial_observation.pkl).
    - Action space: an 8-step chunk of 7-DoF continuous actions (8x7), de-normalized with per-suite unnorm_key such as libero_spatial_no_noops.
    - Dedicated environment: no dedicated simulation environment ships with this entry; upstream simulators, datasets, and training stacks are explicitly excluded from the in-tree runtime.
