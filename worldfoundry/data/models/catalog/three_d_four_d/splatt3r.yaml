docs:
  overview: |
    Splatt3R (btsmart/splatt3r) is a zero-shot Gaussian-splatting reconstruction model: from an uncalibrated stereo image pair, it directly predicts 3D Gaussians — no camera intrinsics, extrinsics, or per-scene optimization required. WorldFoundry vendors the runtime under `worldfoundry/base_models/three_dimensions/general_3d/splatt3r/splatt3r_runtime` with checkpoints as external assets (`brandonsmart/splatt3r_v1.0`), and the catalog records verified checkpoint-backed GPU inference producing a finite 344,064-Gaussian PLY from the bundled official-style views.

    Within the WorldFoundry model catalog this entry is tracked as `splatt3r` in the `three_d_four_d` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/btsmart/splatt3r; Hugging Face `brandonsmart/splatt3r_v1.0`.
  overview_zh: |
    Splatt3R（btsmart/splatt3r）是零样本高斯 splatting 重建模型：从未标定的双视角图像对直接预测 3D 高斯——无需相机内参、外参或逐场景优化。WorldFoundry 将运行时内置于 `worldfoundry/base_models/three_dimensions/general_3d/splatt3r/splatt3r_runtime`，权重为外部资产（`brandonsmart/splatt3r_v1.0`）；目录记录已验证的权重支撑 GPU 推理，从内置官方风格视角产出了包含 344,064 个高斯、数值有限的 PLY。

    在 WorldFoundry 模型目录中，该条目以 `splatt3r` 收录于 `three_d_four_d` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/btsmart/splatt3r；Hugging Face `brandonsmart/splatt3r_v1.0`。
  architecture: |
    The published architecture builds on MASt3R: it keeps the frozen MASt3R geometry backbone (ViT encoder plus twin decoders predicting pointmaps) and adds a Gaussian head that predicts per-pixel covariance, opacity, and spherical-harmonics color, so 3D Gaussians are anchored to MASt3R's predicted 3D points; training only optimizes the new head with a masked rendering loss.
  architecture_zh: |
    公开架构基于 MASt3R：保留冻结的 MASt3R 几何骨干（ViT 编码器加预测 pointmap 的孪生解码器），新增高斯输出头预测逐像素协方差、不透明度与球谐颜色，使 3D 高斯锚定在 MASt3R 预测的 3D 点上；训练仅用带掩码的渲染损失优化新增输出头。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `splatt3r` and runtime profile `runtime-profile:splatt3r`.
    Catalog integration status: `verified`.
    Integration notes recorded in the catalog:
    - Runtime code is vendored in-tree under worldfoundry/base_models/three_dimensions/general_3d/splatt3r/splatt3r_runtime; checkpoints remain external assets.

    Embodiment contract:
    - Simulator: none — this is an offline reconstruction model that consumes recorded images or video; it does not drive or require a simulator.
    - Sensors: monocular or multi-view RGB images/video frames; no additional sensor modalities are recorded in the repository.
    - Action space: not applicable — the model does not consume an action or control stream.
    - Dedicated environment: no dedicated environment; it runs through the shared WorldFoundry pipeline runtime described in the integration notes.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `splatt3r`，运行时配置为 `runtime-profile:splatt3r`。
    目录集成状态：已验证（verified）。
    目录中记录的集成备注（保留原文）：
    - Runtime code is vendored in-tree under worldfoundry/base_models/three_dimensions/general_3d/splatt3r/splatt3r_runtime; checkpoints remain external assets.

    具身接口（embodiment contract）：
    - 仿真器：无——这是一个离线重建模型，输入为已录制的图像或视频，不驱动也不依赖仿真器。
    - 传感器：单目或多视角 RGB 图像/视频帧；仓库未记录其它传感器模态。
    - 动作空间：不适用——该模型不接收动作或控制流输入。
    - 是否专用环境：无专用环境；通过集成备注中描述的 WorldFoundry 共享管线运行时执行。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`verified`.
    Runner parity notes recorded in the catalog:
    - Checkpoint-backed GPU inference produced a finite 344064-Gaussian PLY from the bundled official-style views; see worldfoundry/data/models/validation/inference_evidence.yaml.

    This documentation only restates metadata already recorded in the catalog; it claims no GPU execution evidence beyond the parity fields above.
  limitations_zh: |
    本目录文件记录的一致性字段：runner_parity=已验证（verified）。
    目录中记录的 runner 一致性备注（保留原文）：
