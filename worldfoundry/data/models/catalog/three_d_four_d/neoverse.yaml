docs:
  overview: |
    NeoVerse (IamCreateAI/NeoVerse) is an open-source (Apache-2.0) camera-controlled world-video and reconstruction project. WorldFoundry exposes a native NeoVerse assembly over canonical Wan components plus NeoVerse's model-specific control and reconstruction roles; the recorded runner supports the README-style `tilt_up` video demo with local NeoVerse assets, and the official video-input path uses `static_scene=false`. Real inference remains checkpoint/GPU gated; no metadata-only runner shim is used.

    Within the WorldFoundry model catalog this entry is tracked as `neoverse` in the `three_d_four_d` category.
    Recorded availability: status=open_source, open_source=True, code=public, weights=linked_from_repo, license=Apache-2.0.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/IamCreateAI/NeoVerse.
  overview_zh: |
    NeoVerse（IamCreateAI/NeoVerse）是开源（Apache-2.0）的相机可控世界视频与重建项目。WorldFoundry 暴露基于规范 Wan 组件的原生 NeoVerse 组装，并叠加其模型特有的控制与重建角色；目录记录的 runner 支持使用本地 NeoVerse 资产运行 README 风格的 `tilt_up` 视频演示，官方视频输入路径使用 `static_scene=false`。真实推理仍受权重/GPU 限制；未使用仅元数据的 runner 占位实现。

    在 WorldFoundry 模型目录中，该条目以 `neoverse` 收录于 `three_d_four_d` 分类。
    仓库记录的可用性：状态=open_source，是否开源=True，代码=public，权重=linked_from_repo，许可证=Apache-2.0。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/IamCreateAI/NeoVerse。
  architecture: |
    The catalog records that the in-tree assembly builds on canonical Wan video-diffusion components with NeoVerse-specific camera-control and reconstruction roles layered on top. Beyond this composition and the recorded demo path, the repository does not record architecture details for this entry beyond the metadata quoted above.
  architecture_zh: |
    目录记录 in-tree 组装基于规范 Wan 视频扩散组件，叠加 NeoVerse 特有的相机控制与重建角色。除该组装方式与已记录的演示路径外，除上文引用的元数据外，仓库未记录该条目的架构细节。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `neoverse` and runtime profile `runtime-profile:neoverse`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - WorldFoundry exposes a native NeoVerse assembly over canonical Wan components plus its model-specific control and reconstruction roles.
    - Real inference remains checkpoint/GPU gated; no metadata-only runner shim is used.

    Embodiment contract:
    - Simulator: none — this is a generative video/scene model, not a physics simulator; generation is conditioned on user-provided camera trajectories.
    - Sensors: RGB image or video conditioning inputs; no additional sensor modalities are recorded in the repository.
    - Action space: camera trajectory control (sequences of camera poses) supplied as conditioning; no robot/agent action space is recorded.
    - Dedicated environment: no dedicated environment; it runs through the shared WorldFoundry pipeline runtime described in the integration notes.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `neoverse`，运行时配置为 `runtime-profile:neoverse`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - WorldFoundry exposes a native NeoVerse assembly over canonical Wan components plus its model-specific control and reconstruction roles.
    - Real inference remains checkpoint/GPU gated; no metadata-only runner shim is used.

    具身接口（embodiment contract）：
    - 仿真器：无——这是生成式视频/场景模型而非物理仿真器；生成过程以用户提供的相机轨迹为条件。
    - 传感器：RGB 图像或视频条件输入；仓库未记录其它传感器模态。
    - 动作空间：以相机轨迹（相机位姿序列）作为条件控制；仓库未记录机器人/智能体动作空间。
    - 是否专用环境：无专用环境；通过集成备注中描述的 WorldFoundry 共享管线运行时执行。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`verified`.
    Runner parity notes recorded in the catalog:
    - The in-tree NeoVerse runner supports the README-style tilt_up video demo with local NeoVerse assets.
    - The official video-input path uses static_scene=false.
    - Per-run visual QA and artifact checks are tracked outside the model catalog.

    This documentation only restates metadata already recorded in the catalog; it claims no GPU execution evidence beyond the parity fields above.
  limitations_zh: |
    本目录文件记录的一致性字段：runner_parity=已验证（verified）。
    目录中记录的 runner 一致性备注（保留原文）：
