docs:
  overview: |
    SC-GS (CVMI-Lab/SC-GS, CVPR 2024) — Sparse-Controlled Gaussian Splatting — represents dynamic scenes with dense 3D Gaussians whose motion is driven by a much sparser set of control points, enabling high-quality dynamic novel-view synthesis and interactive motion editing. WorldFoundry tracks upstream source metadata only; no runnable in-tree pipeline is registered yet.

    Within the WorldFoundry model catalog this entry is tracked as `sc-gs` in the `three_d_four_d` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/CVMI-Lab/SC-GS.
  overview_zh: |
    SC-GS（CVMI-Lab/SC-GS，CVPR 2024）——稀疏控制点高斯 Splatting——用稠密 3D 高斯表示动态场景，其运动由数量少得多的控制点驱动，支持高质量动态新视角合成与交互式运动编辑。WorldFoundry 仅跟踪其上游来源元数据；尚未注册可运行的 in-tree 管线。

    在 WorldFoundry 模型目录中，该条目以 `sc-gs` 收录于 `three_d_four_d` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/CVMI-Lab/SC-GS。
  architecture: |
    The published method learns sparse control points paired with time-varying 6-DoF transformations decoded by a deformation MLP; dense Gaussians are deformed via locally-rigid linear blend skinning of neighboring control points, with ARAP-style regularization keeping motion locally rigid. Training is per-scene optimization; no feed-forward checkpoints are recorded.
  architecture_zh: |
    公开方法学习稀疏控制点及由形变 MLP 解码的时变 6 自由度变换；稠密高斯经由邻近控制点的局部刚性线性混合蒙皮（LBS）形变，并用 ARAP 式正则保持局部刚性。训练为逐场景优化；未记录前向推理权重。
  usage_notes: |
