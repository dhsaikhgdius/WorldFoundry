id: lagernvs
name: LagrNVS
aliases:
- lager-nvs
- facebook/lagernvs_general_512
- facebookresearch/lagernvs
tasks:
- novel-view-synthesis
- 3d-scene-rendering
- camera-path-rendering
provider: official_repo
source:
  status: open_source
  official_repo_url: https://github.com/facebookresearch/lagernvs
  license: fair-noncommercial-research-license
  requires_auth: true
  notes:
  - Upstream checkpoints are gated HuggingFace repositories.
checkpoint_refs:
- repo_id: facebook/lagernvs_general_512
  filename: model.pt
  requires_auth: true
  gated: true
integration:
  kind: pipeline_runner
  status: integrated
  notes:
  - WorldFoundry exposes an in-tree adapter that runs the upstream LagrNVS minimal_inference.py command.
  - Missing HF_TOKEN/gated checkpoint access is reported at inference time.
runtime_profile: runtime-profile:lagernvs
runner_target: worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: lagernvs
runner_parity:
  status: pending
  notes:
  - Pipeline target imports and plan-only inference are wired; full artifact parity needs gated checkpoints and CUDA.
catalog_category: three_d_four_d
catalog_scope: 3D Gaussian-splatting catalog entries. Integrated entries expose in-tree WorldFoundry runtimes;
  metadata-only entries retain upstream provenance without runnable backends.
output_artifacts:
- generated_video
docs:
  overview: |
    LagrNVS is catalogued as a novel-view-synthesis / 3D-scene-rendering / camera-path-rendering model. WorldFoundry exposes an in-tree adapter that runs the upstream LagrNVS `minimal_inference.py` command; missing HF_TOKEN or gated-checkpoint access is reported at inference time. The repository does not record an official GitHub or Hugging Face source link for this entry.

    Within the WorldFoundry model catalog this entry is tracked as `lagernvs` in the `three_d_four_d` category.
    The repository does not record an official source link for this entry.
  overview_zh: |
    LagrNVS 在目录中登记为新视角合成 / 3D 场景渲染 / 相机路径渲染模型。WorldFoundry 暴露 in-tree 适配器以运行上游 LagrNVS 的 `minimal_inference.py` 命令；HF_TOKEN 缺失或 gated 权重不可访问会在推理时报告。仓库未记录该条目的官方 GitHub 或 Hugging Face 来源链接。

    在 WorldFoundry 模型目录中，该条目以 `lagernvs` 收录于 `three_d_four_d` 分类。
    仓库未记录该条目的官方来源链接。
  architecture: |
    The repository records only the entry's modalities (novel-view synthesis, 3D scene rendering, camera-path rendering), the upstream `minimal_inference.py` entrypoint, and the gated-checkpoint requirement. The repository does not record architecture details for this entry beyond the metadata quoted above.
  architecture_zh: |
    仓库仅记录该条目的模态（新视角合成、3D 场景渲染、相机路径渲染）、上游 `minimal_inference.py` 入口以及 gated 权重要求。除上文引用的元数据外，仓库未记录该条目的架构细节。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `lagernvs` and runtime profile `runtime-profile:lagernvs`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - WorldFoundry exposes an in-tree adapter that runs the upstream LagrNVS minimal_inference.py command.
    - Missing HF_TOKEN/gated checkpoint access is reported at inference time.

    Embodiment contract:
    - Simulator: none — this is an offline reconstruction model that consumes recorded images or video; it does not drive or require a simulator.
    - Sensors: monocular or multi-view RGB images/video frames; no additional sensor modalities are recorded in the repository.
    - Action space: camera-path rendering control (a caller-specified camera trajectory); no robot/agent action space is recorded.
    - Dedicated environment: no dedicated environment; it runs through the shared WorldFoundry pipeline runtime described in the integration notes.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `lagernvs`，运行时配置为 `runtime-profile:lagernvs`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - WorldFoundry exposes an in-tree adapter that runs the upstream LagrNVS minimal_inference.py command.
    - Missing HF_TOKEN/gated checkpoint access is reported at inference time.

    具身接口（embodiment contract）：
    - 仿真器：无——这是一个离线重建模型，输入为已录制的图像或视频，不驱动也不依赖仿真器。
    - 传感器：单目或多视角 RGB 图像/视频帧；仓库未记录其它传感器模态。
    - 动作空间：相机路径渲染控制（由调用方指定相机轨迹）；仓库未记录机器人/智能体动作空间。
    - 是否专用环境：无专用环境；通过集成备注中描述的 WorldFoundry 共享管线运行时执行。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`pending`.
    Runner parity notes recorded in the catalog:
    - Pipeline target imports and plan-only inference are wired; full artifact parity needs gated checkpoints and CUDA.

    This documentation only restates metadata already recorded in the catalog; it claims no GPU execution evidence beyond the parity fields above.
  limitations_zh: |
    本目录文件记录的一致性字段：runner_parity=待验证（pending）。
    目录中记录的 runner 一致性备注（保留原文）：
