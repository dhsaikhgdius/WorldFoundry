docs:
  overview: |
    D-NeRF (albertpumarola/D-NeRF, CVPR 2021) is one of the earliest dynamic neural radiance field methods: it extends NeRF to monocular videos of non-rigidly deforming scenes by splitting the problem into a canonical static scene and a per-timestep deformation. It remains a common baseline in 4D reconstruction literature. WorldFoundry tracks upstream source metadata only; no runnable in-tree pipeline is registered yet.

    Within the WorldFoundry model catalog this entry is tracked as `d-nerf` in the `three_d_four_d` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/albertpumarola/D-NeRF.
  overview_zh: |
    D-NeRF（albertpumarola/D-NeRF，CVPR 2021）是最早的动态神经辐射场方法之一：它将 NeRF 扩展到非刚性形变场景的单目视频，把问题拆分为规范空间静态场景和逐时间步的形变场。它至今仍是 4D 重建文献中的常用基线。WorldFoundry 目前仅跟踪其上游来源元数据，尚未注册可运行的 in-tree 管线。

    在 WorldFoundry 模型目录中，该条目以 `d-nerf` 收录于 `three_d_four_d` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/albertpumarola/D-NeRF。
  architecture: |
    The published architecture uses two MLPs: a deformation network mapping a 3D point and time (x, t) to a displacement into the canonical frame, and a canonical NeRF network mapping the displaced point and view direction to density and color. Training is per-scene optimization on synthetic monocular sequences with known poses; there is no feed-forward checkpoint, and the catalog records no weight repositories.
  architecture_zh: |
    公开架构使用两个 MLP：形变网络把三维点与时间 (x, t) 映射为指向规范帧的位移；规范 NeRF 网络把位移后的点与视角方向映射为密度与颜色。训练是在已知位姿的合成单目序列上逐场景优化；不存在前向推理 checkpoint，目录中亦未记录权重仓库。
  usage_notes: |
    No runner target is registered for this entry; the catalog tracks upstream provenance metadata without a runnable in-tree pipeline.
