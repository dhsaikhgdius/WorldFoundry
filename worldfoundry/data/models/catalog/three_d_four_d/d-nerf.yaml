  publisher_zh: 加泰罗尼亚理工大学（IRI，CSIC-UPC）
  overview: 'D-NeRF is one of the founding dynamic-NeRF methods (CVPR 2021): it extends neural radiance fields to scenes with moving content by adding time as an input. In this catalog it is upstream metadata only — a historical reference point for the newer dynamic-scene entries, not a runnable route.'
  overview_zh: D-NeRF 是动态 NeRF 的开山方法之一（CVPR 2021）：通过把时间作为额外输入，将神经辐射场扩展到含运动内容的场景。本 catalog 中它只是上游元数据——作为较新动态场景条目的历史参照，并非可运行路径。
  architecture: 'Two MLPs: a deformation network maps a point at time t to a canonical space, and a canonical NeRF renders it. Per-scene training is required. Nothing beyond the recorded tasks is stored in this repository.'
  architecture_zh: 两个 MLP：形变网络把 t 时刻的点映射到规范空间，规范 NeRF 负责渲染。需要逐场景训练。本仓库除已记录任务外未存储更多信息。
  usage_notes: Blocked; use the upstream repo (albertpumarola/D-NeRF) for the training/rendering scripts.
  usage_notes_zh: Blocked；训练/渲染脚本请使用上游仓库（albertpumarola/D-NeRF）。
