docs:
  overview: |
    LingBot-Map (Robbyant/lingbot-map) is a streaming 3D reconstruction model catalogued for 3D reconstruction, streaming reconstruction, camera-pose estimation, and depth estimation. WorldFoundry vendors the runtime source in-tree under `worldfoundry/base_models/three_dimensions/point_clouds/lingbot_map` and exposes streaming and windowed reconstruction through `LingBotMapPipeline`; checkpoints remain external cache assets from `robbyant/lingbot-map`.

    Within the WorldFoundry model catalog this entry is tracked as `lingbot-map` in the `three_d_four_d` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/Robbyant/lingbot-map; Hugging Face `robbyant/lingbot-map`.
  overview_zh: |
    LingBot-Map（Robbyant/lingbot-map）是流式 3D 重建模型，目录登记其能力为 3D 重建、流式重建、相机位姿估计与深度估计。WorldFoundry 将运行时源码内置于 `worldfoundry/base_models/three_dimensions/point_clouds/lingbot_map`，并通过 `LingBotMapPipeline` 暴露流式与窗口式重建；权重保持为来自 `robbyant/lingbot-map` 的外部缓存资产。

    在 WorldFoundry 模型目录中，该条目以 `lingbot-map` 收录于 `three_d_four_d` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/Robbyant/lingbot-map；Hugging Face `robbyant/lingbot-map`。
  architecture: |
    The repository records the vendored runtime path, the streaming/windowed reconstruction modes of `LingBotMapPipeline`, and the official sources. The repository does not record architecture details for this entry beyond the metadata quoted above.
  architecture_zh: |
    仓库记录了内置运行时路径、`LingBotMapPipeline` 的流式/窗口式重建模式以及官方来源。除上文引用的元数据外，仓库未记录该条目的架构细节。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `lingbot-map` and runtime profile `runtime-profile:lingbot-map`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - Runtime source is vendored in-tree under worldfoundry/base_models/three_dimensions/point_clouds/lingbot_map; checkpoints remain external cache assets.
    - WorldFoundry exposes streaming and windowed reconstruction through LingBotMapPipeline.

    Embodiment contract:
    - Simulator: none — this is an offline reconstruction model that consumes recorded images or video; it does not drive or require a simulator.
    - Sensors: monocular or multi-view RGB images/video frames; no additional sensor modalities are recorded in the repository.
    - Action space: not applicable — the model does not consume an action or control stream.
    - Dedicated environment: no dedicated environment; it runs through the shared WorldFoundry pipeline runtime described in the integration notes.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `lingbot-map`，运行时配置为 `runtime-profile:lingbot-map`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - Runtime source is vendored in-tree under worldfoundry/base_models/three_dimensions/point_clouds/lingbot_map; checkpoints remain external cache assets.
    - WorldFoundry exposes streaming and windowed reconstruction through LingBotMapPipeline.

    具身接口（embodiment contract）：
    - 仿真器：无——这是一个离线重建模型，输入为已录制的图像或视频，不驱动也不依赖仿真器。
    - 传感器：单目或多视角 RGB 图像/视频帧；仓库未记录其它传感器模态。
    - 动作空间：不适用——该模型不接收动作或控制流输入。
    - 是否专用环境：无专用环境；通过集成备注中描述的 WorldFoundry 共享管线运行时执行。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`implemented_pending_gpu_parity`.
    Runner parity notes recorded in the catalog:
    - Import and dispatch integration is in-tree; full GPU parity still needs staged robbyant/lingbot-map checkpoints.

    This documentation only restates metadata already recorded in the catalog; it claims no GPU execution evidence beyond the parity fields above.
  limitations_zh: |
    本目录文件记录的一致性字段：runner_parity=已实现、GPU 一致性待验证（implemented_pending_gpu_parity）。
    目录中记录的 runner 一致性备注（保留原文）：
    - Import and dispatch integration is in-tree; full GPU parity still needs staged robbyant/lingbot-map checkpoints.

    本文档仅整理目录内已记录的元数据，不声称任何超出上述 parity 字段之外的 GPU 实测证据。
