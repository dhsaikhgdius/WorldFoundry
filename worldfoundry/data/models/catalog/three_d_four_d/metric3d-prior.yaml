docs:
  overview: |
    Metric3D is a monocular metric-depth (and surface normal) estimation model line that resolves metric ambiguity across cameras with a canonical camera-space transformation, trained on thousands of camera models and millions of images. WorldFoundry integrates it as an independent metric-depth prior at `worldfoundry/base_models/three_dimensions/depth/metric3d`; the VIPE SLAM defaults reference this prior by model name through the shared priors factory.

    Within the WorldFoundry model catalog this entry is tracked as `metric3d-prior` in the `three_d_four_d` category.
    The repository does not record an official source link for this entry.
  overview_zh: |
    Metric3D 是单目公制深度（及表面法线）估计模型系列，通过规范相机空间变换解决跨相机的公制歧义，训练覆盖数千种相机型号与数百万张图像。WorldFoundry 将其作为独立公制深度先验集成于 `worldfoundry/base_models/three_dimensions/depth/metric3d`；VIPE SLAM 默认配置通过共享先验工厂按模型名引用该先验。

    在 WorldFoundry 模型目录中，该条目以 `metric3d-prior` 收录于 `three_d_four_d` 分类。
    仓库未记录该条目的官方来源链接。
  architecture: |
    The published approach (Metric3D / Metric3D v2) maps inputs into a canonical camera space to remove focal-length ambiguity, then regresses metric depth with a ViT (or ConvNeXt) encoder plus dense decoder; v2 adds joint surface-normal estimation with depth-normal consistency. Zero-shot metric transfer across cameras is the model's defining capability.
  architecture_zh: |
    公开方法（Metric3D / Metric3D v2）先把输入映射到规范相机空间以消除焦距歧义，再用 ViT（或 ConvNeXt）编码器加稠密解码器回归公制深度；v2 增加了联合表面法线估计与深度-法线一致性约束。跨相机的零样本公制迁移是该模型的标志性能力。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` and runtime profile `runtime-profile:metric3d-prior`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - Integrated as an independent metric-depth prior at worldfoundry/base_models/three_dimensions/depth/metric3d.
    - The VIPE SLAM defaults reference this prior by model name through the shared priors factory.
    - Exposed through the shared WorldFoundry geometry-prior pipeline/operator contract.

    Embodiment contract:
    - Simulator: none — this entry is an offline geometric prior invoked by other WorldFoundry pipelines, not a simulator-driven model.
    - Sensors: monocular RGB images (or video frames for temporal variants); no additional sensor modalities are recorded in the repository.
    - Action space: not applicable — priors are pure perception modules without an action interface.
    - Dedicated environment: no dedicated environment; it is exposed through the shared WorldFoundry geometry-prior pipeline/operator contract.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，运行时配置为 `runtime-profile:metric3d-prior`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - Integrated as an independent metric-depth prior at worldfoundry/base_models/three_dimensions/depth/metric3d.
    - The VIPE SLAM defaults reference this prior by model name through the shared priors factory.
    - Exposed through the shared WorldFoundry geometry-prior pipeline/operator contract.

    具身接口（embodiment contract）：
    - 仿真器：无——该条目是被其它 WorldFoundry 管线调用的离线几何先验，不涉及仿真器。
    - 传感器：单目 RGB 图像（时序变体为视频帧）；仓库未记录其它传感器模态。
    - 动作空间：不适用——先验模块为纯感知组件，没有动作接口。
    - 是否专用环境：无专用环境；通过 WorldFoundry 共享几何先验 pipeline/operator 契约暴露。
