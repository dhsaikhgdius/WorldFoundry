docs:
  overview: |
    HexPlane (Caoang327/HexPlane, CVPR 2023) is an explicit representation for dynamic 3D scenes: it factorizes the 4D space-time volume into six feature planes, making dynamic radiance-field training and rendering far faster than pure-MLP approaches. WorldFoundry tracks upstream source metadata only; no runnable in-tree pipeline is registered yet.

    Within the WorldFoundry model catalog this entry is tracked as `hexplane` in the `three_d_four_d` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/Caoang327/HexPlane.
  overview_zh: |
    HexPlane（Caoang327/HexPlane，CVPR 2023）是动态 3D 场景的显式表示：把 4D 时空体因式分解为六个特征平面，使动态辐射场的训练与渲染远快于纯 MLP 方法。WorldFoundry 仅跟踪其上游来源元数据；尚未注册可运行的 in-tree 管线。

    在 WorldFoundry 模型目录中，该条目以 `hexplane` 收录于 `three_d_four_d` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/Caoang327/HexPlane。
  architecture: |
    The published representation stores learned features on six planes spanning each pair of the (x, y, z, t) axes; a space-time point's feature is computed by multiplying/aggregating vectors extracted from paired planes and decoding with a tiny MLP into density and view-dependent color. Training is per-scene optimization; the catalog records no feed-forward checkpoints.
  architecture_zh: |
    公开表示在覆盖 (x, y, z, t) 各轴两两组合的六个平面上存储可学习特征；时空点的特征由成对平面提取的向量相乘/聚合得到，再经一个极小的 MLP 解码为密度与视角相关颜色。训练为逐场景优化；目录未记录前向推理权重。
  usage_notes: |
    No runner target is registered for this entry; the catalog tracks upstream provenance metadata without a runnable in-tree pipeline.
