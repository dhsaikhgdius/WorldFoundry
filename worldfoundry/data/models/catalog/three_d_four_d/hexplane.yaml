  overview: HexPlane represents dynamic scenes with six feature planes — an explicit, fast alternative to dynamic NeRFs (CVPR 2023). In this catalog it is upstream metadata only, kept as the reference for the plane-factorized design that 4D-GS and others build on.
  overview_zh: HexPlane 用六个特征平面表示动态场景——动态 NeRF 的显式、高速替代方案（CVPR 2023）。本 catalog 中它仅为上游元数据，作为 4D-GS 等方法所依赖的平面分解设计的参考。
  architecture: Space-time is factorized into six planes (three space, three space-time); features are fused by an MLP to produce density and color. Per-scene optimization is required.
  architecture_zh: 时空被分解为六个平面（三个空间、三个时空）；特征经 MLP 融合得到密度与颜色。需要逐场景优化。
