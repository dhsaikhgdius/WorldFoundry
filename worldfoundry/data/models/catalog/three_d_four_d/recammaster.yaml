docs:
  overview: |
    ReCamMaster (KlingAIResearch/ReCamMaster) is Kling Research's camera-controlled generative video re-rendering model: given a source video and a new camera trajectory, it re-renders the same dynamic scene from the new trajectory. WorldFoundry exposes the in-tree ReCamMaster pipeline, operator, and synthesis runtime under the Kling namespace; the recorded runner supports the official camera-trajectory video-to-video demo with local ReCamMaster/Wan assets. Availability is open-source reference implementation (MIT), with an upload service for the best model version; open weights are recorded as not confirmed.

    Within the WorldFoundry model catalog this entry is tracked as `recammaster` in the `three_d_four_d` category.
    Recorded availability: status=open_source, open_source=True, code=public_reference_implementation, weights=not_confirmed, license=MIT, api=upload_service_for_best_version.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/KlingAIResearch/ReCamMaster.
  overview_zh: |
    ReCamMaster（KlingAIResearch/ReCamMaster）是可灵研究团队的相机可控生成式视频重渲染模型：给定源视频与新相机轨迹，从新轨迹重渲染同一动态场景。WorldFoundry 在 Kling 命名空间下暴露 in-tree 的 ReCamMaster pipeline、operator 与合成运行时；目录记录的 runner 支持使用本地 ReCamMaster/Wan 资产运行官方相机轨迹视频到视频演示。可用性为开源参考实现（MIT），最佳版本通过上传服务提供；公开权重记录为未确认。

    在 WorldFoundry 模型目录中，该条目以 `recammaster` 收录于 `three_d_four_d` 分类。
    仓库记录的可用性：状态=open_source，是否开源=True，代码=public_reference_implementation，权重=not_confirmed，许可证=MIT，API=upload_service_for_best_version。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/KlingAIResearch/ReCamMaster。
  architecture: |
    The published method builds on a pre-trained text-to-video diffusion backbone (the reference implementation targets Wan2.1-T2V) and injects the source video through frame-dimension conditioning: source and target latents are concatenated along the frame axis so the model can copy scene content while following the target camera trajectory embedding. Training used a large Unreal Engine 5 multi-camera synchronized video dataset.
  architecture_zh: |
    公开方法基于预训练文本到视频扩散骨干（参考实现面向 Wan2.1-T2V），通过帧维条件注入源视频：把源与目标潜变量沿帧轴拼接，使模型在跟随目标相机轨迹嵌入的同时复制场景内容。训练使用了大规模 Unreal Engine 5 多相机同步视频数据集。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `recammaster` and runtime profile `runtime-profile:recammaster`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - WorldFoundry exposes the in-tree ReCamMaster pipeline, operator, and synthesis runtime under the Kling namespace.
    - The open-source reference runtime is checkpoint/GPU gated; no empty runner shim is registered.

    Embodiment contract:
    - Simulator: none — this is a generative video/scene model, not a physics simulator; generation is conditioned on user-provided camera trajectories.
    - Sensors: a source RGB video plus a target camera trajectory; no additional sensor modalities are recorded in the repository.
    - Action space: camera trajectory control (sequences of camera poses) supplied as conditioning; no robot/agent action space is recorded.
    - Dedicated environment: no dedicated environment; it runs through the shared WorldFoundry pipeline runtime described in the integration notes.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `recammaster`，运行时配置为 `runtime-profile:recammaster`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - WorldFoundry exposes the in-tree ReCamMaster pipeline, operator, and synthesis runtime under the Kling namespace.
    - The open-source reference runtime is checkpoint/GPU gated; no empty runner shim is registered.

    具身接口（embodiment contract）：
    - 仿真器：无——这是生成式视频/场景模型而非物理仿真器；生成过程以用户提供的相机轨迹为条件。
    - 传感器：源 RGB 视频加目标相机轨迹；仓库未记录其它传感器模态。
    - 动作空间：以相机轨迹（相机位姿序列）作为条件控制；仓库未记录机器人/智能体动作空间。
    - 是否专用环境：无专用环境；通过集成备注中描述的 WorldFoundry 共享管线运行时执行。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`verified`.
    Runner parity notes recorded in the catalog:
    - The in-tree ReCamMaster runner supports the official camera-trajectory video-to-video demo with local ReCamMaster/Wan assets.
    - Per-run visual QA and artifact checks are tracked outside the model catalog.

    This documentation only restates metadata already recorded in the catalog; it claims no GPU execution evidence beyond the parity fields above.
  limitations_zh: |
    本目录文件记录的一致性字段：runner_parity=已验证（verified）。
    目录中记录的 runner 一致性备注（保留原文）：
