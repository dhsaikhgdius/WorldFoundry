    - The in-tree runner supports the official scene-export route and WorldFoundry representation artifacts.
    - Per-run validation evidence is tracked outside the model catalog.

    This documentation only restates metadata already recorded in the catalog; it claims no GPU execution evidence beyond the parity fields above.
