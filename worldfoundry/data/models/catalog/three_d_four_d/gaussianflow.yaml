  overview: 'GaussianFlow is a dynamic-3DGS method for 4D content creation: it connects Gaussian dynamics with optical flow supervision to reconstruct or generate moving scenes. In this catalog it is upstream metadata only, with a note that a related public repository also exists at NJU-3DV/Gaussian-Flow.'
  overview_zh: GaussianFlow 是面向 4D 内容创作的动态 3DGS 方法：将高斯动力学与光流监督相连，用于重建或生成运动场景。本 catalog 中它仅为上游元数据，并注明另有相关公开仓库 NJU-3DV/Gaussian-Flow。
  architecture: Per the upstream description, Gaussian motions are supervised by matching their splatted flow to optical flow (its GaussianFlow concept). No further internals are recorded in this repository.
  architecture_zh: 按上游描述，通过让高斯投影后的运动与光流对齐来监督高斯动力学（即 GaussianFlow 概念）。本仓库未记录更多内部细节。
