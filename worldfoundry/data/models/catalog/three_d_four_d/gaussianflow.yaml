docs:
  overview: |
    GaussianFlow (Zerg-Overmind/GaussianFlow) is a 4D content creation method that connects the dynamics of 3D Gaussians to pixel-space optical flow: by supervising splatted Gaussian motion ('Gaussian flow') with optical flow computed on the input video, it improves motion fidelity in dynamic 3DGS reconstruction and 4D generation. WorldFoundry tracks upstream source metadata only (a related public repository also exists at NJU-3DV/Gaussian-Flow); no runnable in-tree pipeline is registered yet.

    Within the WorldFoundry model catalog this entry is tracked as `gaussianflow` in the `three_d_four_d` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/Zerg-Overmind/GaussianFlow.
  overview_zh: |
    GaussianFlow（Zerg-Overmind/GaussianFlow）是把 3D 高斯动力学与像素空间光流连接起来的 4D 内容创建方法：将 splatting 后的高斯运动（『Gaussian flow』）与输入视频计算的光流对齐监督，从而提升动态 3DGS 重建与 4D 生成中的运动保真度。WorldFoundry 仅跟踪其上游来源元数据（另有相关公开仓库 NJU-3DV/Gaussian-Flow）；尚未注册可运行的 in-tree 管线。

    在 WorldFoundry 模型目录中，该条目以 `gaussianflow` 收录于 `three_d_four_d` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/Zerg-Overmind/GaussianFlow。
  architecture: |
    The published method densely splats the motion of contributing 3D Gaussians into image space to obtain a differentiable Gaussian-flow field, matched against off-the-shelf optical flow of the source video; this flow supervision plugs into existing dynamic 3DGS optimization pipelines. The workflow is per-scene/per-asset optimization, so the catalog records no feed-forward checkpoints.
  architecture_zh: |
    公开方法把参与渲染的 3D 高斯的运动稠密地 splat 到图像空间，得到可微的 Gaussian-flow 场，并与源视频的现成光流进行匹配监督；该流监督可插入现有动态 3DGS 优化管线。其工作流是逐场景/逐资产优化，因此目录未记录前向推理权重。
  usage_notes: |
    No runner target is registered for this entry; the catalog tracks upstream provenance metadata without a runnable in-tree pipeline.
