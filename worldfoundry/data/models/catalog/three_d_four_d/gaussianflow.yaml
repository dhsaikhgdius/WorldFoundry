    - A related public repository also exists at https://github.com/NJU-3DV/Gaussian-Flow.

    Embodiment contract:
    - Simulator: none — the official workflow is per-scene optimization over recorded data, not a simulator rollout.
    - Sensors: calibrated multi-view or monocular RGB video with camera poses prepared by upstream preprocessing; no additional sensors are recorded.
    - Action space: not applicable — the model does not consume an action or control stream.
    - Dedicated environment: no dedicated environment; the entry is metadata-only (or blocked) in WorldFoundry because the official path is training/reconstruction-first.
