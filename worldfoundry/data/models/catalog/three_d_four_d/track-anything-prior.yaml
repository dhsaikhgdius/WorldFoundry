docs:
  overview: |
    Segment and Track Anything (`track-anything-prior`) is an interactive video object segmentation and tracking prior. WorldFoundry integrates it as an independent tracking prior at `worldfoundry/base_models/perception_core/tracking/track_anything`; its SAM, GroundingDINO, and AOT subcomponents reuse canonical WorldFoundry owners where available, and it is exposed through the shared geometry-prior pipeline/operator contract. Real prior inference remains gated by checkpoints/assets.

    Within the WorldFoundry model catalog this entry is tracked as `track-anything-prior` in the `three_d_four_d` category.
    The repository does not record an official source link for this entry.
  overview_zh: |
    Segment and Track Anything（`track-anything-prior`）是交互式视频物体分割与跟踪先验。WorldFoundry 将其作为独立跟踪先验集成于 `worldfoundry/base_models/perception_core/tracking/track_anything`；其 SAM、GroundingDINO 与 AOT 子组件尽可能复用 WorldFoundry 的规范归属实现，并经共享几何先验 pipeline/operator 契约暴露。真实先验推理仍受权重/资产限制。

    在 WorldFoundry 模型目录中，该条目以 `track-anything-prior` 收录于 `three_d_four_d` 分类。
    仓库未记录该条目的官方来源链接。
  architecture: |
    Per the integration notes, the prior composes three published components: SAM (promptable image segmentation) for mask initialization, GroundingDINO for open-vocabulary text-prompted detection, and AOT (Associating Objects with Transformers) for mask propagation across video frames. The composition follows the upstream Segment-and-Track-Anything design; further architecture details are not recorded in the repository.
  architecture_zh: |
    按集成备注，该先验组合三个公开组件：SAM（可提示图像分割）用于掩码初始化，GroundingDINO 用于开放词表文本提示检测，AOT（Associating Objects with Transformers）用于掩码跨帧传播。组合方式遵循上游 Segment-and-Track-Anything 设计；更多架构细节仓库未记录。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` and runtime profile `runtime-profile:track-anything-prior`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - Integrated as an independent tracking prior at worldfoundry/base_models/perception_core/tracking/track_anything.
    - Its SAM, GroundingDINO, and AOT subcomponents reuse canonical WorldFoundry owners where available.
    - Exposed through the shared WorldFoundry geometry-prior pipeline/operator contract.

    Embodiment contract:
    - Simulator: none — this entry is an offline geometric prior invoked by other WorldFoundry pipelines, not a simulator-driven model.
    - Sensors: RGB video frames plus user prompts (points/boxes/text) for target selection; no additional sensors are recorded.
    - Action space: not applicable — priors are pure perception modules without an action interface.
    - Dedicated environment: no dedicated environment; it is exposed through the shared WorldFoundry geometry-prior pipeline/operator contract.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，运行时配置为 `runtime-profile:track-anything-prior`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - Integrated as an independent tracking prior at worldfoundry/base_models/perception_core/tracking/track_anything.
    - Its SAM, GroundingDINO, and AOT subcomponents reuse canonical WorldFoundry owners where available.
    - Exposed through the shared WorldFoundry geometry-prior pipeline/operator contract.

    具身接口（embodiment contract）：
    - 仿真器：无——该条目是被其它 WorldFoundry 管线调用的离线几何先验，不涉及仿真器。
    - 传感器：RGB 视频帧加用户提示（点/框/文本）用于目标选择；仓库未记录其它传感器。
    - 动作空间：不适用——先验模块为纯感知组件，没有动作接口。
    - 是否专用环境：无专用环境；通过 WorldFoundry 共享几何先验 pipeline/operator 契约暴露。
