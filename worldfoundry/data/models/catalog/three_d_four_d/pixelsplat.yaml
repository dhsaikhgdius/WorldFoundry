docs:
  overview: |
    pixelSplat (CVPR 2024) is a feed-forward 3D Gaussian Splatting model: from a pair of posed images it directly predicts a 3D Gaussian primitive cloud, enabling generalizable, real-time-renderable scene reconstruction. In WorldFoundry, `PixelSplatSynthesis` provides an in-tree wrapper around the official test entrypoint; the runtime source is vendored, but inference is blocked until a local Gaussian rasterization extension is provided and the upstream `re10k.ckpt` checkpoint is staged, so the catalog status is `planned`.

    Within the WorldFoundry model catalog this entry is tracked as `pixelsplat` in the `three_d_four_d` category.
    The repository does not record an official source link for this entry.
  overview_zh: |
    pixelSplat（CVPR 2024）是前向 3D Gaussian Splatting 模型：从一对带位姿图像直接预测 3D 高斯基元云，实现可泛化、可实时渲染的场景重建。在 WorldFoundry 中，`PixelSplatSynthesis` 对官方测试入口做了 in-tree 包装；运行时源码已内置，但推理在提供本地高斯光栅化扩展并暂存上游 `re10k.ckpt` 权重之前保持受阻，目录状态为 planned。

    在 WorldFoundry 模型目录中，该条目以 `pixelsplat` 收录于 `three_d_four_d` 分类。
    仓库未记录该条目的官方来源链接。
  architecture: |
    The published architecture uses an epipolar transformer to resolve scale ambiguity between the two views, then predicts per-pixel probabilistic depth distributions from which Gaussian means are sampled (reparameterized to stay differentiable), along with covariances, opacities, and spherical-harmonics colors; rendering uses standard differentiable splatting.
  architecture_zh: |
    公开架构用极线 transformer 消解两视角间的尺度歧义，随后预测逐像素的概率深度分布，从中采样高斯均值（重参数化以保持可微），同时输出协方差、不透明度与球谐颜色；渲染使用标准可微 splatting。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `pixelsplat` and runtime profile `runtime-profile:pixelsplat`.
    Catalog integration status: `planned`.
    Integration notes recorded in the catalog:
    - Runtime source is vendored in-tree; inference is blocked until a local Gaussian rasterization extension is provided and re10k.ckpt is staged.

    Embodiment contract:
    - Simulator: none — this is an offline reconstruction model that consumes recorded images or video; it does not drive or require a simulator.
    - Sensors: monocular or multi-view RGB images/video frames; no additional sensor modalities are recorded in the repository.
    - Action space: not applicable — the model does not consume an action or control stream.
    - Dedicated environment: no dedicated environment; it runs through the shared WorldFoundry pipeline runtime described in the integration notes.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `pixelsplat`，运行时配置为 `runtime-profile:pixelsplat`。
    目录集成状态：计划中（planned）。
    目录中记录的集成备注（保留原文）：
    - Runtime source is vendored in-tree; inference is blocked until a local Gaussian rasterization extension is provided and re10k.ckpt is staged.

    具身接口（embodiment contract）：
    - 仿真器：无——这是一个离线重建模型，输入为已录制的图像或视频，不驱动也不依赖仿真器。
    - 传感器：单目或多视角 RGB 图像/视频帧；仓库未记录其它传感器模态。
    - 动作空间：不适用——该模型不接收动作或控制流输入。
    - 是否专用环境：无专用环境；通过集成备注中描述的 WorldFoundry 共享管线运行时执行。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`implemented_local_extension_pending`.
