docs:
  overview: |
    GeoCalib is a single-image camera calibration model (ECCV 2024) that estimates intrinsics and gravity direction by embedding geometric optimization inside a deep network. WorldFoundry integrates it as an independent camera-calibration prior at `worldfoundry/base_models/three_dimensions/general_3d/geocalib`, exposed through the shared geometry-prior pipeline/operator contract; VIPE imports GeoCalib from this canonical owner instead of owning a private copy.

    Within the WorldFoundry model catalog this entry is tracked as `geocalib-prior` in the `three_d_four_d` category.
    The repository does not record an official source link for this entry.
  overview_zh: |
    GeoCalib 是单图相机标定模型（ECCV 2024），通过把几何优化嵌入深度网络来估计相机内参与重力方向。WorldFoundry 将其作为独立相机标定先验集成于 `worldfoundry/base_models/three_dimensions/general_3d/geocalib`，经共享几何先验 pipeline/operator 契约暴露；VIPE 从该规范归属路径引用 GeoCalib，而非持有私有副本。

    在 WorldFoundry 模型目录中，该条目以 `geocalib-prior` 收录于 `three_d_four_d` 分类。
    仓库未记录该条目的官方来源链接。
  architecture: |
    The published design combines a CNN/transformer feature extractor with a differentiable Levenberg-Marquardt-style optimizer over camera parameters: the network predicts perspective-field/latitude cues and per-pixel confidences, and the embedded optimizer solves for focal length, principal-point-consistent intrinsics, and gravity (roll/pitch) with uncertainty estimates.
  architecture_zh: |
    公开设计将 CNN/transformer 特征提取器与相机参数上的可微 Levenberg-Marquardt 式优化器结合：网络预测透视场/纬度线索与逐像素置信度，内嵌优化器求解焦距、内参及重力方向（roll/pitch），并给出不确定性估计。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` and runtime profile `runtime-profile:geocalib-prior`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - Integrated as an independent camera-calibration prior at worldfoundry/base_models/three_dimensions/general_3d/geocalib.
    - VIPE imports GeoCalib from the canonical three_dimensions.general_3d.geocalib owner instead of owning a private copy.
    - Exposed through the shared WorldFoundry geometry-prior pipeline/operator contract.

    Embodiment contract:
    - Simulator: none — this entry is an offline geometric prior invoked by other WorldFoundry pipelines, not a simulator-driven model.
    - Sensors: monocular RGB images (or video frames for temporal variants); no additional sensor modalities are recorded in the repository.
    - Action space: not applicable — priors are pure perception modules without an action interface.
    - Dedicated environment: no dedicated environment; it is exposed through the shared WorldFoundry geometry-prior pipeline/operator contract.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，运行时配置为 `runtime-profile:geocalib-prior`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - Integrated as an independent camera-calibration prior at worldfoundry/base_models/three_dimensions/general_3d/geocalib.
    - VIPE imports GeoCalib from the canonical three_dimensions.general_3d.geocalib owner instead of owning a private copy.
    - Exposed through the shared WorldFoundry geometry-prior pipeline/operator contract.

    具身接口（embodiment contract）：
    - 仿真器：无——该条目是被其它 WorldFoundry 管线调用的离线几何先验，不涉及仿真器。
    - 传感器：单目 RGB 图像（时序变体为视频帧）；仓库未记录其它传感器模态。
    - 动作空间：不适用——先验模块为纯感知组件，没有动作接口。
    - 是否专用环境：无专用环境；通过 WorldFoundry 共享几何先验 pipeline/operator 契约暴露。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`verified`.
    Runner parity notes recorded in the catalog:
