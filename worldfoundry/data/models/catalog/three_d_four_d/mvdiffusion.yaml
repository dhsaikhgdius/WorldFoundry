docs:
  overview: |
    MVDiffusion (Tangshitao/MVDiffusion, NeurIPS 2023) is a multi-view image generation method that produces consistent panoramas and multi-view texture images by generating all views simultaneously with correspondence-aware attention. WorldFoundry exposes an in-tree runtime subprocess adapter; missing source checkout, checkpoints, or CUDA dependencies are reported at inference time. Upstream weights are recorded as not confirmed and the license as not found.

    Within the WorldFoundry model catalog this entry is tracked as `mvdiffusion` in the `three_d_four_d` category.
    Recorded availability: status=source_available, open_source=False, code=public, weights=not_confirmed, license=not_found.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/Tangshitao/MVDiffusion.
  overview_zh: |
    MVDiffusion（Tangshitao/MVDiffusion，NeurIPS 2023）是多视角图像生成方法：通过对应关系感知注意力同时生成所有视角，产出一致的全景图与多视角纹理图像。WorldFoundry 暴露 in-tree 运行时子进程适配器；源码检出、权重或 CUDA 依赖缺失会在推理时报告。上游权重记录为未确认，许可证记录为未找到。

    在 WorldFoundry 模型目录中，该条目以 `mvdiffusion` 收录于 `three_d_four_d` 分类。
    仓库记录的可用性：状态=source_available，是否开源=False，代码=public，权重=not_confirmed，许可证=not_found。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/Tangshitao/MVDiffusion。
  architecture: |
    The published architecture runs a frozen-backbone Stable Diffusion UNet per view in parallel and inserts correspondence-aware attention blocks that align latent features across views using known pixel correspondences (e.g., panorama homographies or depth-based warps), enabling holistic multi-view denoising rather than autoregressive stitching.
  architecture_zh: |
    公开架构对每个视角并行运行冻结骨干的 Stable Diffusion UNet，并插入对应关系感知注意力模块，利用已知像素对应（如全景单应或基于深度的 warp）在视角间对齐潜特征，实现整体式多视角去噪而非自回归拼接。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `mvdiffusion` and runtime profile `runtime-profile:mvdiffusion`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - WorldFoundry exposes an in-tree runtime subprocess adapter for MVDiffusion.
    - Missing source checkout, checkpoints, or CUDA dependencies are reported at inference time.

    Embodiment contract:
    - Simulator: none — this is an offline 3D scene generation model; it produces renderable scene artifacts rather than running inside a simulator.
    - Sensors: text prompts and/or a single RGB image as conditioning; no additional sensor modalities are recorded in the repository.
    - Action space: not applicable at generation time; navigation of the generated scene is a rendering-side camera path, not a learned action space.
    - Dedicated environment: no dedicated environment; it runs through the shared WorldFoundry pipeline runtime described in the integration notes.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `mvdiffusion`，运行时配置为 `runtime-profile:mvdiffusion`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - WorldFoundry exposes an in-tree runtime subprocess adapter for MVDiffusion.
    - Missing source checkout, checkpoints, or CUDA dependencies are reported at inference time.

    具身接口（embodiment contract）：
    - 仿真器：无——这是离线 3D 场景生成模型，产出可渲染的场景 artifact，而非在仿真器内运行。
    - 传感器：以文本提示和/或单张 RGB 图像为条件；仓库未记录其它传感器模态。
    - 动作空间：生成阶段不适用；对生成场景的浏览属于渲染侧的相机路径，不是学习得到的动作空间。
    - 是否专用环境：无专用环境；通过集成备注中描述的 WorldFoundry 共享管线运行时执行。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`pending`.
    Runner parity notes recorded in the catalog:
    - Pipeline target imports and plan-only inference are wired; full artifact parity needs runtime assets.

    This documentation only restates metadata already recorded in the catalog; it claims no GPU execution evidence beyond the parity fields above.
  limitations_zh: |
    本目录文件记录的一致性字段：runner_parity=待验证（pending）。
    目录中记录的 runner 一致性备注（保留原文）：
