docs:
  overview: |
    Depth Anything V1 (LiheYoung/Depth-Anything, CVPR 2024) is a monocular depth estimation foundation model trained on roughly 1.5M labeled images plus about 62M automatically annotated unlabeled images. It is widely used as a robust relative-depth backbone across the 3D and video-generation ecosystem. WorldFoundry registers an in-tree pipeline (`depth-anything-v1`) for relative depth and geometry artifact export, with integration status `verified`, and the confirmed Hugging Face checkpoints cover the small/base/large ViT variants.

    Within the WorldFoundry model catalog this entry is tracked as `depth-anything-v1` in the `three_d_four_d` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/LiheYoung/Depth-Anything; Hugging Face `LiheYoung/depth-anything-small-hf`, `LiheYoung/depth-anything-base-hf`, `LiheYoung/depth-anything-large-hf`.
  overview_zh: |
    Depth Anything V1（LiheYoung/Depth-Anything，CVPR 2024）是单目深度估计基础模型，训练数据包括约 150 万张标注图像与约 6200 万张自动标注的无标签图像。它是 3D 与视频生成生态中广泛使用的稳健相对深度骨干。WorldFoundry 注册了 in-tree 管线（`depth-anything-v1`）用于相对深度与几何 artifact 导出，集成状态为 verified；已确认的 Hugging Face 权重覆盖 small/base/large 三档 ViT 变体。

    在 WorldFoundry 模型目录中，该条目以 `depth-anything-v1` 收录于 `three_d_four_d` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/LiheYoung/Depth-Anything；Hugging Face `LiheYoung/depth-anything-small-hf`、`LiheYoung/depth-anything-base-hf`、`LiheYoung/depth-anything-large-hf`。
  architecture: |
    The published architecture pairs a DINOv2-pretrained ViT encoder (ViT-S/B/L) with a DPT-style dense prediction decoder that regresses affine-invariant relative depth. Training combines labeled supervision with a large-scale semi-supervised pipeline: a teacher generates pseudo-labels for unlabeled images while strong perturbations and an auxiliary semantic-feature alignment loss make the student robust. Metric fine-tuned heads exist upstream but the catalog records the relative-depth checkpoints (`LiheYoung/depth-anything-{small,base,large}-hf`).
  architecture_zh: |
    公开架构由 DINOv2 预训练的 ViT 编码器（ViT-S/B/L）与 DPT 风格稠密预测解码器组成，回归仿射不变的相对深度。训练把有标签监督与大规模半监督流程结合：教师模型为无标签图像生成伪标签，同时通过强扰动和辅助语义特征对齐损失提升学生模型的稳健性。上游存在公制微调头，但目录记录的是相对深度权重（`LiheYoung/depth-anything-{small,base,large}-hf`）。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `depth-anything-v1`.
    Catalog integration status: `verified`.
    Integration notes recorded in the catalog:
    - In-tree Depth Anything V1 pipeline is registered for relative depth and geometry artifact export.

    Embodiment contract:
    - Simulator: none — this entry is an offline geometric prior invoked by other WorldFoundry pipelines, not a simulator-driven model.
    - Sensors: monocular RGB images (or video frames for temporal variants); no additional sensor modalities are recorded in the repository.
    - Action space: not applicable — priors are pure perception modules without an action interface.
    - Dedicated environment: no dedicated environment; it is exposed through the shared WorldFoundry geometry-prior pipeline/operator contract.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `depth-anything-v1`。
    目录集成状态：已验证（verified）。
    目录中记录的集成备注（保留原文）：
    - In-tree Depth Anything V1 pipeline is registered for relative depth and geometry artifact export.

    具身接口（embodiment contract）：
    - 仿真器：无——该条目是被其它 WorldFoundry 管线调用的离线几何先验，不涉及仿真器。
    - 传感器：单目 RGB 图像（时序变体为视频帧）；仓库未记录其它传感器模态。
    - 动作空间：不适用——先验模块为纯感知组件，没有动作接口。
    - 是否专用环境：无专用环境；通过 WorldFoundry 共享几何先验 pipeline/operator 契约暴露。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`verified`.
