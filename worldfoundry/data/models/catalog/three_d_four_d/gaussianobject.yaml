  overview: GaussianObject reconstructs high-quality object-level 3DGS from as few as four views, using diffusion-based repair to fill unobserved regions. In this catalog it is upstream metadata only — the per-object optimization workflow is not exposed as a runnable route.
  overview_zh: GaussianObject 只需四张视图即可重建高质量的物体级 3DGS，并用扩散修复补全未观测区域。本 catalog 中它仅为上游元数据——逐物体优化的工作流未暴露为可运行路径。
  architecture: Per the publication, visual-hull initialization plus 3DGS optimization, with a diffusion-model repair stage for sparse-view gaps. No further internals are recorded here.
  architecture_zh: 按论文：视觉外壳初始化加 3DGS 优化，并用扩散模型修复稀疏视图缺口。此处未记录更多内部细节。
