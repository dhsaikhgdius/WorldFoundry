  overview: K-Planes factorizes radiance fields in any dimension — 4D dynamic scenes become six feature planes with interpretable space/time separation (CVPR 2023). In this catalog it is upstream metadata only, recorded alongside HexPlane as a foundation of plane-factorized 4D reconstruction.
  overview_zh: K-Planes 在任意维度分解辐射场——4D 动态场景变成六个特征平面，空间/时间分离且可解释（CVPR 2023）。本 catalog 中它仅为上游元数据，与 HexPlane 一同作为平面分解式 4D 重建的基础记录。
  architecture: d-choose-2 planes for a d-dimensional scene, multiplicative feature fusion, with linear decoders or small MLPs. Per-scene optimization is required.
  architecture_zh: d 维场景使用 C(d,2) 个平面，特征乘性融合，配线性解码器或小型 MLP。需要逐场景优化。
