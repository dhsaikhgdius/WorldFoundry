docs:
  overview: |
    K-Planes (sarafridov/K-Planes, CVPR 2023) is a planar-factorization representation for radiance fields in arbitrary dimensions: it represents a d-dimensional scene with d-choose-2 feature planes (six planes for 4D dynamic scenes), providing an interpretable, fast, and memory-efficient alternative to MLP-based dynamic NeRFs. WorldFoundry tracks upstream source metadata only; no runnable in-tree pipeline is registered yet.

    Within the WorldFoundry model catalog this entry is tracked as `k-planes` in the `three_d_four_d` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/sarafridov/K-Planes.
  overview_zh: |
    K-Planes（sarafridov/K-Planes，CVPR 2023）是任意维度辐射场的平面因式分解表示：用 d 取 2 个特征平面表示 d 维场景（4D 动态场景对应六个平面），是 MLP 型动态 NeRF 的可解释、快速且省显存的替代方案。WorldFoundry 仅跟踪其上游来源元数据；尚未注册可运行的 in-tree 管线。

    在 WorldFoundry 模型目录中，该条目以 `k-planes` 收录于 `three_d_four_d` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/sarafridov/K-Planes。
  architecture: |
    The published representation multiplies features bilinearly interpolated from each of the d-choose-2 planes (separating static space-space planes from dynamic space-time planes) and decodes them with either a small MLP or an explicit linear decoder; multiscale planes and simple regularizers (total variation, time smoothness) stabilize optimization. Training is per-scene; no feed-forward checkpoints are recorded.
  architecture_zh: |
    公开表示对 d 取 2 个平面（区分静态空间-空间平面与动态空间-时间平面）双线性插值得到的特征做乘法组合，再用小型 MLP 或显式线性解码器解码；多尺度平面与简单正则项（全变差、时间平滑）稳定优化。训练按场景进行；未记录前向推理权重。
