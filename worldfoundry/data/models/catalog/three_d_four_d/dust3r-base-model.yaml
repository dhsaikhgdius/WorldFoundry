docs:
  overview: |
    DUSt3R Base Model is the runnable base-model profile of the DUSt3R catalog entry: it exposes the vendored in-tree DUSt3R implementation (`worldfoundry.base_models.three_dimensions.general_3d.dust3r`) through the shared geometry-prior pipeline/operator contract. The catalog records a verified runner: the workspace loaded the official DUSt3R base checkpoint and exported a finite 10,000-point reconstruction from two views on 2026-07-11.

    Within the WorldFoundry model catalog this entry is tracked as `dust3r-base-model` in the `three_d_four_d` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/naver/dust3r.
  overview_zh: |
    DUSt3R Base Model 是 DUSt3R 目录条目的可运行基础模型配置：它通过共享几何先验 pipeline/operator 契约暴露 in-tree 内置的 DUSt3R 实现（`worldfoundry.base_models.three_dimensions.general_3d.dust3r`）。目录记录 runner 已验证：工作区于 2026-07-11 加载官方 DUSt3R 基础权重，并从两个视角导出了包含 10,000 个有限值点的重建结果。

    在 WorldFoundry 模型目录中，该条目以 `dust3r-base-model` 收录于 `three_d_four_d` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/naver/dust3r。
  architecture: |
    DUSt3R (naver/dust3r, CVPR 2024) casts stereo reconstruction as pointmap regression: a shared ViT encoder processes two uncalibrated images, twin transformer decoders exchange information via cross-attention, and regression heads output a dense 3D pointmap per view expressed in the first camera's frame plus confidence maps. No intrinsics or poses are needed; camera parameters and multi-view alignment are recovered post-hoc from the pointmaps.
  architecture_zh: |
    DUSt3R（naver/dust3r，CVPR 2024）把双目重建建模为 pointmap 回归：共享 ViT 编码器处理两张未标定图像，两个孪生 transformer 解码器通过交叉注意力交换信息，回归头输出以第一个相机坐标系表达的每视角稠密 3D pointmap 及置信度图。无需内参或位姿；相机参数与多视角对齐可由 pointmap 事后恢复。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `dust3r-base-model` and runtime profile `runtime-profile:dust3r-base-model`.
    Catalog integration status: `verified`.
    Integration notes recorded in the catalog:
    - Base-model profile for the DUSt3R catalog entry; exposed through the shared geometry-prior pipeline/operator contract.
    - Aligns with the dust3r catalog entry, which vendors the same in-tree source under worldfoundry.base_models.three_dimensions.general_3d.dust3r.

    Embodiment contract:
    - Simulator: none — this entry is an offline geometric prior invoked by other WorldFoundry pipelines, not a simulator-driven model.
    - Sensors: monocular RGB images (or video frames for temporal variants); no additional sensor modalities are recorded in the repository.
    - Action space: not applicable — priors are pure perception modules without an action interface.
    - Dedicated environment: no dedicated environment; it is exposed through the shared WorldFoundry geometry-prior pipeline/operator contract.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `dust3r-base-model`，运行时配置为 `runtime-profile:dust3r-base-model`。
    目录集成状态：已验证（verified）。
    目录中记录的集成备注（保留原文）：
    - Base-model profile for the DUSt3R catalog entry; exposed through the shared geometry-prior pipeline/operator contract.
    - Aligns with the dust3r catalog entry, which vendors the same in-tree source under worldfoundry.base_models.three_dimensions.general_3d.dust3r.

    具身接口（embodiment contract）：
    - 仿真器：无——该条目是被其它 WorldFoundry 管线调用的离线几何先验，不涉及仿真器。
    - 传感器：单目 RGB 图像（时序变体为视频帧）；仓库未记录其它传感器模态。
    - 动作空间：不适用——先验模块为纯感知组件，没有动作接口。
    - 是否专用环境：无专用环境；通过 WorldFoundry 共享几何先验 pipeline/operator 契约暴露。
