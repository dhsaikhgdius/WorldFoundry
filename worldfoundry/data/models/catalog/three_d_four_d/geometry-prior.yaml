docs:
  overview: |
    Geometry (`geometry-prior`) is not a single upstream model: it is the shared WorldFoundry geometry-prior pipeline/operator contract surface through which individual priors (DUSt3R, Depth Anything, Metric3D, UniDepth, GeoCalib, and others) are exposed to 3D and world-model runtimes. Each upstream prior registers as a separate catalog entry with its own provenance; this entry records the common contract itself.

    Within the WorldFoundry model catalog this entry is tracked as `geometry-prior` in the `three_d_four_d` category.
    The repository does not record an official source link for this entry.
  overview_zh: |
    Geometry（`geometry-prior`）不是某个单一上游模型：它是 WorldFoundry 共享的几何先验 pipeline/operator 契约面，DUSt3R、Depth Anything、Metric3D、UniDepth、GeoCalib 等各个先验经由它暴露给 3D 与世界模型运行时。各上游先验以独立目录条目登记并携带各自来源信息；本条目记录的是公共契约本身。

    在 WorldFoundry 模型目录中，该条目以 `geometry-prior` 收录于 `three_d_four_d` 分类。
    仓库未记录该条目的官方来源链接。
  architecture: |
    As a contract entry, there is no model architecture: the surface defines how prior pipelines/operators are constructed, resolved through the shared priors factory, and invoked by higher-level runtimes. Per-prior architecture and parity evidence live on the specific prior catalog entries.
  architecture_zh: |
    作为契约条目，本条目没有模型架构：该契约面定义先验 pipeline/operator 的构造方式、经共享先验工厂的解析方式，以及被上层运行时调用的方式。各先验的架构与一致性证据记录在对应的先验目录条目中。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `geometry-prior`.
    Catalog integration status: `runtime_ported`.
    Integration notes recorded in the catalog:
    - Shared WorldFoundry geometry-prior pipeline/operator contract surface.
    - Individual upstream priors (DUSt3R, Depth Anything, Metric3D, etc.) register as separate catalog entries with their own provenance.

    Embodiment contract:
    - Simulator: none — this entry is an offline geometric prior invoked by other WorldFoundry pipelines, not a simulator-driven model.
    - Sensors: monocular RGB images (or video frames for temporal variants); no additional sensor modalities are recorded in the repository.
    - Action space: not applicable — priors are pure perception modules without an action interface.
    - Dedicated environment: no dedicated environment; it is exposed through the shared WorldFoundry geometry-prior pipeline/operator contract.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `geometry-prior`。
    目录集成状态：运行时已移植（runtime_ported）。
    目录中记录的集成备注（保留原文）：
    - Shared WorldFoundry geometry-prior pipeline/operator contract surface.
    - Individual upstream priors (DUSt3R, Depth Anything, Metric3D, etc.) register as separate catalog entries with their own provenance.

    具身接口（embodiment contract）：
    - 仿真器：无——该条目是被其它 WorldFoundry 管线调用的离线几何先验，不涉及仿真器。
    - 传感器：单目 RGB 图像（时序变体为视频帧）；仓库未记录其它传感器模态。
    - 动作空间：不适用——先验模块为纯感知组件，没有动作接口。
    - 是否专用环境：无专用环境；通过 WorldFoundry 共享几何先验 pipeline/operator 契约暴露。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`pending`.
    Runner parity notes recorded in the catalog:
