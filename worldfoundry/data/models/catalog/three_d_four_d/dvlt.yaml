docs:
  overview: |
    Déjà View Looping Transformer (DVLT, nv-tlabs/dvlt) is an NVIDIA research model catalogued for multi-view 3D reconstruction, camera-pose estimation, and depth estimation. In WorldFoundry, `DVLTSynthesis` provides a lazy wrapper that runs the external DVLT GLB export path when CUDA, dependencies, source, inputs, and weights are all available locally; the runtime source is externalized from the public release tree and checkpoints (`nvidia/dvlt`) remain external assets.

    Within the WorldFoundry model catalog this entry is tracked as `dvlt` in the `three_d_four_d` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/nv-tlabs/dvlt; Hugging Face `nvidia/dvlt`.
  overview_zh: |
    Déjà View Looping Transformer（DVLT，nv-tlabs/dvlt）是 NVIDIA 的研究模型，目录登记其能力为多视角 3D 重建、相机位姿估计与深度估计。在 WorldFoundry 中，`DVLTSynthesis` 提供惰性包装器：当 CUDA、依赖、源码、输入与权重在本地全部就绪时，运行外部 DVLT 的 GLB 导出路径；运行时源码不随公开发布树内置，权重（`nvidia/dvlt`）也保持为外部资产。

    在 WorldFoundry 模型目录中，该条目以 `dvlt` 收录于 `three_d_four_d` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/nv-tlabs/dvlt；Hugging Face `nvidia/dvlt`。
  architecture: |
    The repository records the model's modalities (3D reconstruction, multi-view reconstruction, camera-pose estimation, depth estimation), the GLB scene-export integration path, and the official sources. The repository does not record architecture details for this entry beyond the metadata quoted above.
  architecture_zh: |
    仓库记录了该模型的模态（3D 重建、多视角重建、相机位姿估计、深度估计）、GLB 场景导出集成路径与官方来源。除上文引用的元数据外，仓库未记录该条目的架构细节。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `dvlt` and runtime profile `runtime-profile:dvlt`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - Runtime source is externalized from the public release tree; checkpoints remain external assets.
    - DVLTSynthesis provides a lazy WorldFoundry wrapper that runs the external DVLT GLB export path when CUDA, dependencies, source, inputs, and weights are available locally.

    Embodiment contract:
    - Simulator: none — this is an offline reconstruction model that consumes recorded images or video; it does not drive or require a simulator.
    - Sensors: monocular or multi-view RGB images/video frames; no additional sensor modalities are recorded in the repository.
    - Action space: not applicable — the model does not consume an action or control stream.
    - Dedicated environment: no dedicated environment; it runs through the shared WorldFoundry pipeline runtime described in the integration notes.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `dvlt`，运行时配置为 `runtime-profile:dvlt`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - Runtime source is externalized from the public release tree; checkpoints remain external assets.
    - DVLTSynthesis provides a lazy WorldFoundry wrapper that runs the external DVLT GLB export path when CUDA, dependencies, source, inputs, and weights are available locally.

    具身接口（embodiment contract）：
    - 仿真器：无——这是一个离线重建模型，输入为已录制的图像或视频，不驱动也不依赖仿真器。
    - 传感器：单目或多视角 RGB 图像/视频帧；仓库未记录其它传感器模态。
    - 动作空间：不适用——该模型不接收动作或控制流输入。
    - 是否专用环境：无专用环境；通过集成备注中描述的 WorldFoundry 共享管线运行时执行。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`pending`.
    Runner parity notes recorded in the catalog:
    - Runner registration is wired; GPU parity is pending checkpoint and environment validation.

    This documentation only restates metadata already recorded in the catalog; it claims no GPU execution evidence beyond the parity fields above.
