docs:
  overview: |
    WonderWorld (KovenYu/WonderWorld) is an interactive 3D scene generation framework: from a single input image it extrapolates and renders connected 3D scenes fast enough (around 10 seconds per scene on a single GPU in the published setup) for interactive 'world building' where the user steers where to expand next. WorldFoundry runs the in-tree `run.py`/`example_config` flow through the shared 3D/4D subprocess adapter; missing source, inpainting, segmentation, depth/normal, or 3DGS assets are reported at inference time. Code is public; weights and license are recorded as not found.

    Within the WorldFoundry model catalog this entry is tracked as `wonderworld` in the `three_d_four_d` category.
    Recorded availability: status=source_available, open_source=False, code=public, weights=not_found, license=not_found.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/KovenYu/WonderWorld.
  overview_zh: |
    WonderWorld（KovenYu/WonderWorld）是交互式 3D 场景生成框架：从单张输入图像外推并渲染相互连接的 3D 场景，速度足以支撑交互式『世界搭建』（公开配置下单 GPU 约 10 秒生成一个场景），用户可指定下一步扩展方向。WorldFoundry 通过共享 3D/4D 子进程适配器运行 in-tree 的 `run.py`/`example_config` 流程；源码、inpainting、分割、深度/法线或 3DGS 资产缺失会在推理时报告。代码公开；权重与许可证记录为未找到。

    在 WorldFoundry 模型目录中，该条目以 `wonderworld` 收录于 `three_d_four_d` 分类。
    仓库记录的可用性：状态=source_available，是否开源=False，代码=public，权重=not_found，许可证=not_found。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/KovenYu/WonderWorld。
  architecture: |
    The published core is FLAGS — Fast LAyered Gaussian Surfels: each scene is represented as layered Gaussian surfels (sky/background/foreground) that can be initialized from a single view with geometry-guided placement rather than slow multi-view optimization, plus guided depth diffusion for layer depth; new scenes are generated by outpainting from the current viewpoint and instantly fused into the world.
  architecture_zh: |
    公开核心是 FLAGS——快速分层高斯面元（Fast LAyered Gaussian Surfels）：每个场景表示为分层高斯面元（天空/背景/前景），可借助几何引导放置从单视角初始化而非缓慢多视角优化，并用引导深度扩散估计层深度；新场景通过从当前视角外补全生成并即时融合进世界。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `wonderworld` and runtime profile `runtime-profile:wonderworld`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - WorldFoundry runs the in-tree WonderWorld run.py/example_config flow through the shared 3D/4D subprocess adapter.
    - Missing source, inpainting, segmentation, depth/normal, or 3DGS assets are reported at inference time.

    Embodiment contract:
    - Simulator: none — this is an offline 3D scene generation model; it produces renderable scene artifacts rather than running inside a simulator.
    - Sensors: text prompts and/or a single RGB image as conditioning; no additional sensor modalities are recorded in the repository.
    - Action space: not applicable at generation time; navigation of the generated scene is a rendering-side camera path, not a learned action space.
    - Dedicated environment: no dedicated environment; it runs through the shared WorldFoundry pipeline runtime described in the integration notes.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `wonderworld`，运行时配置为 `runtime-profile:wonderworld`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - WorldFoundry runs the in-tree WonderWorld run.py/example_config flow through the shared 3D/4D subprocess adapter.
    - Missing source, inpainting, segmentation, depth/normal, or 3DGS assets are reported at inference time.

    具身接口（embodiment contract）：
    - 仿真器：无——这是离线 3D 场景生成模型，产出可渲染的场景 artifact，而非在仿真器内运行。
    - 传感器：以文本提示和/或单张 RGB 图像为条件；仓库未记录其它传感器模态。
    - 动作空间：生成阶段不适用；对生成场景的浏览属于渲染侧的相机路径，不是学习得到的动作空间。
    - 是否专用环境：无专用环境；通过集成备注中描述的 WorldFoundry 共享管线运行时执行。
