  publisher_zh: 华中科技大学（HUSTVL）
  overview: TiNeuVox accelerates dynamic NeRFs with time-aware neural voxels, cutting per-scene training from days to minutes while keeping radiance-field quality (SIGGRAPH Asia 2022). In this catalog it is upstream metadata only — the per-scene optimization workflow is not exposed as a runnable route.
  overview_zh: TiNeuVox 用时间感知神经体素加速动态 NeRF，把逐场景训练从数天缩短到数分钟，同时保持辐射场质量（SIGGRAPH Asia 2022）。本 catalog 中它仅为上游元数据——逐场景优化工作流未暴露为可运行路径。
  architecture: Per the publication, a coordinate-deformation network is paired with time-aware voxel features and a multi-distance interpolation scheme; a small MLP renders density and color. Per-scene optimization is required.
  architecture_zh: 按论文，坐标形变网络与时间感知体素特征及多距离插值方案配对；小型 MLP 渲染密度与颜色。需要逐场景优化。
  usage_notes: Blocked — consult the upstream repository (hustvl/TiNeuVox).
  usage_notes_zh: Blocked——请查阅上游仓库（hustvl/TiNeuVox）。
