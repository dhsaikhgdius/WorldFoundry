docs:
  overview: |
    4D-GS (4D Gaussian Splatting, hustvl/4DGaussians) is a real-time dynamic-scene rendering method that extends 3D Gaussian Splatting to space-time. Instead of optimizing a separate set of Gaussians per timestep, it keeps one canonical set of 3D Gaussians and learns a deformation field that moves and reshapes them over time, enabling real-time rendering of dynamic scenes at high visual quality. WorldFoundry tracks it as an upstream 4D reconstruction project; release-facing Studio inference is intentionally not exposed because the official workflow is dataset-specific optimization followed by rendering.

    Within the WorldFoundry model catalog this entry is tracked as `4d-gs` in the `three_d_four_d` category.
    Recorded availability: status=open_source, open_source=True, code=public, weights=not_applicable_or_not_confirmed, license=Apache-2.0.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/hustvl/4DGaussians.
  overview_zh: |
    4D-GS（4D Gaussian Splatting，hustvl/4DGaussians）是把 3D Gaussian Splatting 扩展到时空域的实时动态场景渲染方法。它不为每个时间步单独优化一组高斯，而是维护一组规范空间（canonical）3D 高斯，并学习一个形变场随时间移动和改变这些高斯的形态，从而以较高画质实时渲染动态场景。WorldFoundry 将其作为上游 4D 重建项目跟踪；由于官方流程是针对具体数据集先优化再渲染，Studio 侧的发布级推理有意未开放。

    在 WorldFoundry 模型目录中，该条目以 `4d-gs` 收录于 `three_d_four_d` 分类。
    仓库记录的可用性：状态=open_source，是否开源=True，代码=public，权重=not_applicable_or_not_confirmed，许可证=Apache-2.0。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/hustvl/4DGaussians。
  architecture: |
    The published method couples a canonical 3D Gaussian point set with a HexPlane-style decomposed neural voxel encoder and a lightweight MLP deformation decoder: spatial-temporal features are looked up from six factorized planes and decoded into per-Gaussian position, rotation, and scaling offsets at each queried timestamp, after which standard differentiable splatting renders the frame. Training is per-scene optimization over prepared dynamic-scene datasets; there is no feed-forward checkpoint, which is why the catalog records no Hugging Face weights.
  architecture_zh: |
    公开方法将规范空间 3D 高斯点集与 HexPlane 式分解神经体素编码器及轻量 MLP 形变解码器组合：在查询时间戳处，从六个因式分解平面查表得到时空特征，解码为每个高斯的位置、旋转与尺度偏移，再用标准可微 splatting 渲染该帧。训练是在准备好的动态场景数据集上逐场景优化；不存在前向推理型 checkpoint，因此目录中没有记录 Hugging Face 权重。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `4d-gs` and runtime profile `runtime-profile:4d-gs`.
    Catalog integration status: `blocked`.
    Integration notes recorded in the catalog:
    - WorldFoundry records 4D-GS upstream metadata only; release-facing Studio inference is not exposed.
    - The official workflow is training/reconstruction over prepared dynamic-scene datasets, followed by rendering from an optimized model, not a prompt/image infer-only demo.
    - Hidden from Studio job submission until a real in-tree infer-only artifact path exists.

    Embodiment contract:
    - Simulator: none — the official workflow is per-scene optimization over recorded data, not a simulator rollout.
    - Sensors: calibrated multi-view or monocular RGB video with camera poses prepared by upstream preprocessing; no additional sensors are recorded.
    - Action space: not applicable — the model does not consume an action or control stream.
    - Dedicated environment: no dedicated environment; the entry is metadata-only (or blocked) in WorldFoundry because the official path is training/reconstruction-first.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `4d-gs`，运行时配置为 `runtime-profile:4d-gs`。
    目录集成状态：受阻/仅跟踪元数据（blocked）。
    目录中记录的集成备注（保留原文）：
    - WorldFoundry records 4D-GS upstream metadata only; release-facing Studio inference is not exposed.
    - The official workflow is training/reconstruction over prepared dynamic-scene datasets, followed by rendering from an optimized model, not a prompt/image infer-only demo.
