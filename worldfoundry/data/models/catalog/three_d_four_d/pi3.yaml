docs:
  overview: |
    Pi3 (π³, yyfz/Pi3) is a feed-forward visual-geometry transformer with a fully permutation-equivariant design: it removes the fixed reference view of DUSt3R/VGGT-style models, so any input ordering yields the same scene reconstruction. It predicts camera poses, dense pointmaps, and confidence from unordered image collections. WorldFoundry registers the in-tree Pi3 point-cloud navigation pipeline for reconstruction and trajectory rendering; the confirmed Hugging Face repo is `yyfz233/Pi3X`.

    Within the WorldFoundry model catalog this entry is tracked as `pi3` in the `three_d_four_d` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/yyfz/Pi3; Hugging Face `yyfz233/Pi3X`.
  overview_zh: |
    Pi3（π³，yyfz/Pi3）是前向视觉几何 transformer，采用完全置换等变设计：去除了 DUSt3R/VGGT 式模型的固定参考视角，任意输入顺序都得到一致的场景重建。它从无序图像集合预测相机位姿、稠密 pointmap 与置信度。WorldFoundry 注册了 in-tree 的 Pi3 点云导航管线用于重建与轨迹渲染；已确认的 Hugging Face 仓库为 `yyfz233/Pi3X`。

    在 WorldFoundry 模型目录中，该条目以 `pi3` 收录于 `three_d_four_d` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/yyfz/Pi3；Hugging Face `yyfz233/Pi3X`。
  architecture: |
    The published architecture alternates view-wise and global attention over ViT tokens from all input images and regresses affine-invariant camera poses plus scale-invariant local pointmaps per view, without any reference-frame token; permutation equivariance makes the reconstruction robust to input order and improves scalability.
  architecture_zh: |
    公开架构在所有输入图像的 ViT token 上交替执行视角内注意力与全局注意力，逐视角回归仿射不变的相机位姿与尺度不变的局部 pointmap，不使用任何参考帧 token；置换等变性使重建对输入顺序稳健并提升可扩展性。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `pi3`.
    Catalog integration status: `runtime_ported`.
    Integration notes recorded in the catalog:
    - In-tree Pi3 point-cloud navigation pipeline is registered for reconstruction and trajectory rendering.

    Embodiment contract:
    - Simulator: none — this is an offline reconstruction model that consumes recorded images or video; it does not drive or require a simulator.
    - Sensors: monocular or multi-view RGB images/video frames; no additional sensor modalities are recorded in the repository.
    - Action space: not applicable — the model does not consume an action or control stream.
    - Dedicated environment: no dedicated environment; it runs through the shared WorldFoundry pipeline runtime described in the integration notes.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `pi3`。
    目录集成状态：运行时已移植（runtime_ported）。
    目录中记录的集成备注（保留原文）：
    - In-tree Pi3 point-cloud navigation pipeline is registered for reconstruction and trajectory rendering.

    具身接口（embodiment contract）：
    - 仿真器：无——这是一个离线重建模型，输入为已录制的图像或视频，不驱动也不依赖仿真器。
    - 传感器：单目或多视角 RGB 图像/视频帧；仓库未记录其它传感器模态。
    - 动作空间：不适用——该模型不接收动作或控制流输入。
    - 是否专用环境：无专用环境；通过集成备注中描述的 WorldFoundry 共享管线运行时执行。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`pending`.
