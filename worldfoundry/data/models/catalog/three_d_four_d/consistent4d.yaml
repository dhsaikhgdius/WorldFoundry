  overview: Consistent4D generates 360° dynamic objects from a single monocular video — a video-to-4D method that optimizes a dynamic representation per input. In this catalog it is tracked as upstream source metadata only; the per-input optimization workflow does not map onto a runnable infer-only pipeline.
  overview_zh: Consistent4D 从单目视频生成 360° 动态物体——一种针对每个输入做优化的视频转 4D 方法。本 catalog 仅跟踪其上游源码元数据；逐输入优化的工作流无法映射为可运行的仅推理 pipeline。
  architecture: Consistent4D optimizes a cascade dynamic NeRF/3DGS representation supervised by a multi-view diffusion prior, per the upstream publication. Architecture internals beyond the recorded tasks (dynamic-scene-generation, 4d-reconstruction, dynamic-3dgs) are not recorded in this repository.
  architecture_zh: 按上游论文，Consistent4D 在多视角扩散先验监督下优化级联动态 NeRF/3DGS 表示。除已记录任务（动态场景生成、4D 重建、动态 3DGS）外的架构细节仓库未记录。
  usage_notes: Blocked — no runnable in-tree pipeline. Consult the upstream repo (yanqinJiang/Consistent4D) for the official optimization scripts.
  usage_notes_zh: Blocked——无可运行的树内 pipeline。官方优化脚本请查阅上游仓库（yanqinJiang/Consistent4D）。
