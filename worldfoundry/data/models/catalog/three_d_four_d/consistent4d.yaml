docs:
  overview: |
    Consistent4D (yanqinJiang/Consistent4D) targets video-to-4D generation: given a single monocular video of a moving object, it optimizes a consistent 360-degree dynamic 3D representation of that object. The project is best known for demonstrating that a statically trained image diffusion model can supervise dynamic object generation without multi-view data. WorldFoundry tracks upstream source metadata only; no runnable in-tree pipeline is registered yet.

    Within the WorldFoundry model catalog this entry is tracked as `consistent4d` in the `three_d_four_d` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/yanqinJiang/Consistent4D.
  overview_zh: |
    Consistent4D（yanqinJiang/Consistent4D）面向视频到 4D 的生成任务：给定运动物体的单目视频，优化出该物体在 360 度视角下一致的动态 3D 表示。该项目的代表性贡献是证明静态训练的图像扩散模型可以在没有多视角数据的情况下监督动态物体生成。WorldFoundry 目前仅跟踪其上游来源元数据，尚未注册可运行的 in-tree 管线。

    在 WorldFoundry 模型目录中，该条目以 `consistent4d` 收录于 `three_d_four_d` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/yanqinJiang/Consistent4D。
  architecture: |
    The published approach optimizes a cascade dynamic NeRF (a coarse-to-fine dynamic radiance field) from the input monocular video, using score distillation from an off-the-shelf image diffusion model plus an interpolation-driven consistency loss to keep unseen viewpoints and timestamps coherent. The catalog records no checkpoint repositories; the workflow is per-object optimization rather than feed-forward inference.
  architecture_zh: |
    公开方法从输入单目视频优化一个级联动态 NeRF（由粗到细的动态辐射场），利用现成图像扩散模型的分数蒸馏（score distillation）以及插值驱动的一致性损失，保证未观测视角与时间戳的连贯性。目录未记录任何权重仓库；其工作流为逐物体优化而非前向推理。
  usage_notes: |
    No runner target is registered for this entry; the catalog tracks upstream provenance metadata without a runnable in-tree pipeline.
