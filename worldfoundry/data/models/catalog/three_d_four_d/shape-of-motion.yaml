docs:
  overview: |
    Shape of Motion (vye16/shape-of-motion) reconstructs 4D geometry and motion from a single monocular video of a dynamic scene: it produces persistent, globally consistent 3D tracks and renderable dynamic Gaussians. WorldFoundry vendors the source components in-tree, but the official project is reconstruction/training-oriented — data preprocessing and optimization produce a checkpoint that rendering scripts consume — so no release-ready infer-only Studio runtime is exposed and the model is hidden from Studio job submission until a real in-tree artifact path exists. Availability is open source under MIT.

    Within the WorldFoundry model catalog this entry is tracked as `shape-of-motion` in the `three_d_four_d` category.
    Recorded availability: status=open_source, open_source=True, code=public, weights=linked_from_repo, license=MIT.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/vye16/shape-of-motion.
  overview_zh: |
    Shape of Motion（vye16/shape-of-motion）从动态场景的单目视频重建 4D 几何与运动：产出持久、全局一致的 3D 轨迹与可渲染动态高斯。WorldFoundry 已将源码组件内置 in-tree，但官方项目以重建/训练为导向——数据预处理与优化产出供渲染脚本消费的 checkpoint——因此未暴露发布级仅推理 Studio 运行时，在真实的 in-tree artifact 路径出现之前，该模型对 Studio 任务提交隐藏。可用性为 MIT 开源。

    在 WorldFoundry 模型目录中，该条目以 `shape-of-motion` 收录于 `three_d_four_d` 分类。
    仓库记录的可用性：状态=open_source，是否开源=True，代码=public，权重=linked_from_repo，许可证=MIT。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/vye16/shape-of-motion。
  architecture: |
    The published method represents scene motion with a compact set of SE(3) motion bases: each dynamic 3D Gaussian's trajectory is a weighted combination of shared rigid-motion bases, exploiting the low-dimensional structure of real-world motion. Optimization is guided by off-the-shelf priors — monocular depth and long-range 2D tracks — fused into a globally consistent representation. Training is per-video optimization; no feed-forward checkpoints are recorded.
  architecture_zh: |
    公开方法用一组紧凑的 SE(3) 运动基表示场景运动：每个动态 3D 高斯的轨迹是共享刚体运动基的加权组合，利用真实世界运动的低维结构。优化由现成先验引导——单目深度与长程 2D 轨迹——融合为全局一致的表示。训练为逐视频优化；未记录前向推理权重。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `shape-of-motion` and runtime profile `runtime-profile:shape-of-motion`.
    Catalog integration status: `blocked`.
    Integration notes recorded in the catalog:
    - WorldFoundry vendors the Shape of Motion source components in-tree.
    - {'The official project is reconstruction/training-oriented': 'data preprocessing and optimization produce a checkpoint that rendering scripts consume.'}
    - No release-ready infer-only Studio runtime is exposed; this model is hidden from Studio job submission until a real in-tree artifact path exists.

    Embodiment contract:
    - Simulator: none — the official workflow is per-scene optimization over recorded data, not a simulator rollout.
    - Sensors: calibrated multi-view or monocular RGB video with camera poses prepared by upstream preprocessing; no additional sensors are recorded.
    - Action space: not applicable — the model does not consume an action or control stream.
    - Dedicated environment: no dedicated environment; the entry is metadata-only (or blocked) in WorldFoundry because the official path is training/reconstruction-first.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `shape-of-motion`，运行时配置为 `runtime-profile:shape-of-motion`。
    目录集成状态：受阻/仅跟踪元数据（blocked）。
    目录中记录的集成备注（保留原文）：
    - WorldFoundry vendors the Shape of Motion source components in-tree.
    - {'The official project is reconstruction/training-oriented': 'data preprocessing and optimization produce a checkpoint that rendering scripts consume.'}
