runtime_profile: runtime-profile:open-magvit2
runner_target: worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: open-magvit2
runner_parity:
  status: checkpoint_backed_verified
  notes:
  - OpenMAGVIT2Synthesis provides an in-tree class-conditional PNG generation wrapper;
