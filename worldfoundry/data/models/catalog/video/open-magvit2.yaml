- class-conditional-image-generation
- autoregressive-generation
provider: official_repo
source:
  status: open_source
  official_repo_url: https://github.com/TencentARC/Open-MAGVIT2
  license: apache-2.0
checkpoint_refs:
- repo_id: TencentARC/Open-MAGVIT2
  revision: 607230591be9efcb4ec5ec9b6417b9e863f2dd2c
  license: apache-2.0
integration:
  status: integrated
  notes:
  - Runtime source is vendored in-tree and the CUDA generation wrapper is wired.
