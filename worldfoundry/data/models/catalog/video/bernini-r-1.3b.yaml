docs:
  overview: |
    Bernini-R 1.3B is the 1.3-billion-parameter renderer variant of
    ByteDance's open-source Bernini unified visual generation family (the size
    comes from the checkpoint name ByteDance/Bernini-R-1.3B-Diffusers). It is
    cataloged from the official bytedance/Bernini GitHub repository under
    Apache-2.0. The manifest records the same broad task surface as the
    family: text-to-image, image-to-image, text-to-video, video-to-video,
    reference-to-video, and reference-video-to-video, producing generated
    images or videos.
  overview_zh: |
    Bernini-R 1.3B 是字节跳动开源 Bernini 统一视觉生成家族的 13 亿参数
    渲染器变体（规模来自检查点名称 ByteDance/Bernini-R-1.3B-Diffusers）。
    条目来源于官方 bytedance/Bernini GitHub 仓库，许可证为 Apache-2.0。
    manifest 记录与家族一致的宽任务面：文生图、图生图、文生视频、视频生
    视频、参考图生视频、参考视频生视频，输出为生成的图像或视频。
  architecture: |
    Official renderer inference is vendored in-tree at pinned GitHub revision
    82d573e9a553dccb1405dde4cb0f26466f9df6c5; no external Bernini checkout is
    used. Weights load from the self-contained Diffusers-format checkpoint
    ByteDance/Bernini-R-1.3B-Diffusers. Network internals beyond the recorded
    provenance (project page bernini-ai.github.io, paper arXiv 2605.22344) are
    not recorded in this repository.
  architecture_zh: |
    官方渲染器推理源码按固定 GitHub 版本
    82d573e9a553dccb1405dde4cb0f26466f9df6c5 vendored 到树内，不使用外部
    Bernini 检出。权重从自包含 Diffusers 格式检查点
    ByteDance/Bernini-R-1.3B-Diffusers 加载。除已记录的 provenance（项目页
    bernini-ai.github.io、论文 arXiv 2605.22344）外，网络内部细节仓库未
    记录。
  usage_notes: |
    Runs through WorldFoundryPipelineRunner with runtime profile
    bernini-r-1.3b and pipeline binding bernini-r-1.3b. Aliases
    bernini-r-1p3b and bernini-r-1.3b-diffusers resolve here. As the smallest
    listed Bernini renderer it is the natural first target when staging the
    family locally; checkpoints remain external Hugging Face assets.
  usage_notes_zh: |
    通过 WorldFoundryPipelineRunner 运行，运行时 profile 与 pipeline
    binding 均为 bernini-r-1.3b。别名 bernini-r-1p3b、
    bernini-r-1.3b-diffusers 解析到本条目。作为列出的最小 Bernini 渲染器，
    它是本地部署该家族时合适的首个目标；检查点仍为外部 Hugging Face 资产。
  limitations: |
    Runner parity is pending_gpu_validation; no parity artifacts, benchmark
    scores, or GPU/VRAM requirements are recorded in this repository. Quality
    or speed comparisons against the 14B renderer are not documented here.
  limitations_zh: |
    runner parity 为 pending_gpu_validation；仓库未记录 parity 产物、
    benchmark 分数或 GPU/显存需求。与 14B 渲染器的质量或速度对比在此处
    没有文档记录。
  recommended_benchmarks:
    - vbench
    - evalcrafter
