            fps_tolerance: 0.01
            expected_duration_seconds: 5.0625
            duration_tolerance_seconds: 0.05
      notes: Verified with the WorldFoundry vendored Wan2.1 T2V runtime using the same prompt, seed, checkpoint, resolution, frame count, shift, and CFG scale as the official demo command.
    runner_target: worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner
    pipeline_binding: wan2.1-t2v-1.3b
