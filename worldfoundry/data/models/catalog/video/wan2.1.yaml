    - scripts/model_zoo/run_wan21_t2v_1p3b_worldfoundry_runner_demo.py
  expected_artifacts:
    - path: wan21_t2v_1p3b_worldfoundry_seed42_832x480_81f.mp4
      video_probe:
        expected_width: 832
