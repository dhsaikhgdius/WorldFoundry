  checkpoint_repo_id: Wan-AI/Wan2.1-T2V-1.3B
  checkpoint_snapshot: 37ec512624d61f7aa208f7ea8140a131f93afc9a
  notes: Verified for Wan2.1 T2V-1.3B only ; other Wan2.1 T2V-14B and I2V variants remain pending and keep the family-level integration_status planned.
