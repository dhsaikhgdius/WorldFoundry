variants:
  - id: wan2.1-t2v-1.3b
    task: text-to-video
    provider: official_repo
    checkpoint_refs:
      - repo_id: Wan-AI/Wan2.1-T2V-1.3B
        revision: 37ec512624d61f7aa208f7ea8140a131f93afc9a
        license: apache-2.0
        private: false
        gated: false
    runtime_profile: wan2.1-t2v-1.3b-832x480-81f
    integration:
      status: planned
      scope: variant_only
      evidence:
        - tmp/model_zoo/validation/wan2.1/report.json
        - tmp/model_zoo/validation/official_parity/wan2.1/report.json
        - tmp/model_zoo/validation/runner_parity/wan2.1/report.json
    native_diffusion:
      recipe_id: wan2.1-t2v-1.3b
      status: assembly_and_checkpoint_structure_verified
      strategy: standard
      components:
        - conditioner
        - latent_initializer
        - scheduler
        - denoiser
        - decoder
      checkpoint_key_validation:
        dit: 825
        text_encoder: 242
        vae: 194
      artifact_parity: pending
      notes: The native recipe no longer imports DiffSynth, Diffusers, or the legacy image/video packages; public CUDA artifact parity is still required before replacing the existing catalog pipeline binding.
    demo_parity:
      status: verified
      demo_command:
        - bash
        - scripts/model_zoo/run_wan21_t2v_1p3b_official_demo.sh
      expected_artifacts:
        - path: wan21_t2v_1p3b_seed42_832x480_81f.mp4
          video_probe:
            expected_width: 832
            expected_height: 480
            expected_frames: 81
            expected_fps: 16
            fps_tolerance: 0.01
            expected_duration_seconds: 5.0625
            duration_tolerance_seconds: 0.05
      notes: Verified with the official Wan2.1 T2V-1.3B demo command only.
    runner_parity:
      status: verified
      demo_command:
