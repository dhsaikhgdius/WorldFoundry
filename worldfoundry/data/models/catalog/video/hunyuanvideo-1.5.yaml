  huggingface: Record official repo id, revision, access state, license metadata, and task tags.
  parity: A pre-cutover generate.py artifact does not establish NativeDiffusionPipeline parity.
docs:
  overview: |
    HunyuanVideo 1.5 is Tencent's follow-on open-weight video generation
    release, cataloged from the official Tencent-Hunyuan/HunyuanVideo-1.5
    GitHub repository with the tencent/HunyuanVideo-1.5 Hugging Face
    checkpoint serving both text-to-video and image-to-video. The I2V route
    additionally declares black-forest-labs/FLUX.1-Redux-dev as an
    independent gated vision checkpoint for image conditioning. Both tasks
    are exposed as independent WorldFoundry model recipes under one shared
    native diffusion infrastructure.
  overview_zh: |
    HunyuanVideo 1.5 是腾讯后续发布的开源权重视频生成模型，条目来源于官方
    Tencent-Hunyuan/HunyuanVideo-1.5 GitHub 仓库；tencent/HunyuanVideo-1.5
    这一 Hugging Face 检查点同时服务文生视频与图生视频。I2V 路线额外声明
    black-forest-labs/FLUX.1-Redux-dev 作为独立的 gated 视觉检查点用于图像
    条件化。两个任务在共享原生扩散基础设施下作为独立的 WorldFoundry 模型
    recipe 暴露。
  architecture: |
    T2V and I2V are declarative recipes assembled by the shared native
    diffusion runner (generate.py is not retained as a second inference
    architecture); HunyuanVideo 1.5 owns only model-specific network, codec,
    and conditioning behavior. Recipes compose conditioner, latent
    initializer, scheduler, denoiser, latent encoder, and decoder. Checkpoint
    structure validation passed with zero missing/unexpected keys and zero
    shape mismatches (transformer: 1793 keys; VAE: 218 keys; I2V SigLIP
    vision tower: 448 keys) via safetensors header key-and-shape comparison.
  architecture_zh: |
    T2V 与 I2V 是由共享原生扩散 runner 装配的声明式 recipe（generate.py
    未被保留为第二套推理架构）；HunyuanVideo 1.5 仅持有模型特有的网络、
    编解码与条件化行为。recipe 由 conditioner、latent initializer、
    scheduler、denoiser、latent encoder、decoder 构成。检查点结构校验通过
    （transformer 1793 键；VAE 218 键；I2V SigLIP 视觉塔 448 键），无缺失/
    多余键、无形状不匹配，方法为 safetensors 头部键与形状对比。
  usage_notes: |
    Variants hunyuanvideo-1.5-t2v and hunyuanvideo-1.5-i2v run through
    WorldFoundryPipelineRunner with their own runtime profiles and pipeline
    bindings; the family default profile is hunyuanvideo-1.5-t2v. The I2V
    conditioner requires the gated FLUX.1-Redux-dev checkpoint - accept the
    upstream access terms on Hugging Face before downloading. Checkpoints are
    external assets and are not tracked in git.
  usage_notes_zh: |
    变体 hunyuanvideo-1.5-t2v 与 hunyuanvideo-1.5-i2v 通过
    WorldFoundryPipelineRunner 运行，各有运行时 profile 与 pipeline
    binding；家族默认 profile 为 hunyuanvideo-1.5-t2v。I2V conditioner
    依赖 gated 的 FLUX.1-Redux-dev 检查点——下载前需在 Hugging Face 接受
    上游访问条款。检查点为外部资产，不入 git。
  limitations: |
    HF license metadata for tencent/HunyuanVideo-1.5 is 'other'
    (manual_review_required), and FLUX.1-Redux-dev is gated with
    non-commercial license review required - do not redistribute or automate
    downloads before review. Demo parity and runner parity are pending: the
    earlier bounded generate.py artifact predates the unified native runner
    and is historical evidence only; checkpoint-backed CUDA artifact parity
    must be repeated after the cutover. GPU/VRAM requirements are not
    recorded here.
  limitations_zh: |
    tencent/HunyuanVideo-1.5 的 HF 许可证元数据为 'other'（需人工审查）；
    FLUX.1-Redux-dev 为 gated 且需非商用许可证审查——审查前请勿再分发或
    自动化下载。demo parity 与 runner parity 均为 pending：早期有界
    generate.py 产物先于统一原生 runner，仅作历史证据；切换后需重新做有
    检查点支撑的 CUDA 产物一致性验证。GPU/显存需求未记录。
  recommended_benchmarks:
    - vbench
    - evalcrafter
    - t2v-compbench
    - aigcbench
