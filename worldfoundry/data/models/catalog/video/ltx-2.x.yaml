  - id: ltx-2-i2v
    task: image-to-video
    provider: official_repo
    checkpoint_refs:
      - repo_id: Lightricks/LTX-2
        revision: 47da56e2ad66ce4125a9922b4a8826bf407f9d0a
        license: other
        private: false
        gated: false
    runtime_profile: ltx-2-i2v
    demo_parity:
      status: pending
      notes:
        - The native LTX-2 I2V route is wired with the local LTX-2 checkpoint,
          reference image, fps, guidance_scale, resolution, frame count, step
          count, and seed controls.
        - Full official parity remains pending; per-run artifact checks are
          tracked outside the model catalog.
    runner_parity:
