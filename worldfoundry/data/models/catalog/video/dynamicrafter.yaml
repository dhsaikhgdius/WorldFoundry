  github:
    url: https://github.com/Doubiiu/DynamiCrafter
    verified_by: git ls-remote --symref https://github.com/Doubiiu/DynamiCrafter.git HEAD
    default_branch: main
    head_sha: 859021927d8e0f8eb4d91d16f86711b8c25a2023
checkpoint:
  status: confirmed_public_hf_license_pending
  verified_by: GET https://huggingface.co/api/models/<repo_id>
  repos:
  - id: Doubiiu/DynamiCrafter
    sha: 07cf16c248afcc953e8781026fc4b261b0b871c2
    private: false
    gated: false
    tasks:
    - image-to-video
    license_status: pending
  - id: Doubiiu/DynamiCrafter_512
    sha: 9eb874455b7903c0244fe7bf53ca21cb979cd05a
    private: false
    gated: false
    tasks:
    - image-to-video
    license_status: pending
  - id: Doubiiu/DynamiCrafter_1024
    sha: 73398ed78fa307316f355fdbbdc823564057f375
    private: false
    gated: false
    tasks:
    - image-to-video
    license_status: pending
  notes: HF repos are public and non-gated, but cardData did not expose a license.
demo_parity:
  status: pending
  notes: DynamicCrafter 512 and 1024 I2V routes are wired in the unified environment profile. Official long-config parity
    remains pending.
notes: Keep redistribution gated until the upstream license is reviewed manually.
catalog_category: video
catalog_scope: Official GitHub and/or Hugging Face confirmed open-source or open-weight video generation models. Checkpoints
  are not tracked in git; local validation may download selected repos under cache/hfd.
catalog_policy:
  github: Validated with git ls-remote, preferring git ls-remote --symref <repo>.git HEAD for default branch and HEAD SHA.
  huggingface: Validated with the Hugging Face /api/models endpoint. Recorded repo id, sha, private, gated, license, and selected
    task tags only.
  parity: This manifest does not claim WorldFoundry runtime parity unless an explicit parity run and expected artifact are
    recorded.
integration:
  status: integrated
  notes:
  - WorldFoundry wraps the in-tree DynamiCrafter I2V runtimes.
runner_parity:
  status: pending
  notes:
  - DynamicCrafter 512 I2V is wired with the staged checkpoint/runtime environment.
  - DynamicCrafter 1024 I2V is wired with the staged checkpoint/runtime environment.
  - Official long-config parity remains pending for both variants.
variants:
- id: dynamicrafter-512-i2v
  task: image-to-video
  runtime_profile: dynamicrafter-512-i2v
  runner_target: worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner
  pipeline_binding: dynamicrafter-512-i2v
  integration:
    status: integrated
  runner_parity:
    status: pending
- id: dynamicrafter-1024-i2v
  task: image-to-video
  runtime_profile: dynamicrafter-1024-i2v
  runner_target: worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner
  pipeline_binding: dynamicrafter-1024-i2v
  integration:
    status: integrated
  runner_parity:
    status: pending
docs:
  overview: |
    DynamiCrafter is an open-source image-to-video model from the official
    Doubiiu/DynamiCrafter GitHub repository. Given a still image (and the
    controls exposed by the runtime), it produces an animated video of that
    scene. The catalog confirms three public, non-gated Hugging Face
    checkpoint repos - Doubiiu/DynamiCrafter, Doubiiu/DynamiCrafter_512, and
    Doubiiu/DynamiCrafter_1024 - corresponding to different output
    resolutions. WorldFoundry exposes two runnable variants:
    dynamicrafter-512-i2v and dynamicrafter-1024-i2v.
  overview_zh: |
    DynamiCrafter 是官方 Doubiiu/DynamiCrafter GitHub 仓库的开源图生视频
    模型。给定一张静态图像（以及运行时暴露的控制项），它生成该场景的动画
    视频。目录确认了三个公开、非 gated 的 Hugging Face 检查点仓库：
    Doubiiu/DynamiCrafter、Doubiiu/DynamiCrafter_512 与
    Doubiiu/DynamiCrafter_1024，对应不同输出分辨率。WorldFoundry 暴露两个
    可运行变体：dynamicrafter-512-i2v 与 dynamicrafter-1024-i2v。
  architecture: |
    The 512 and 1024 checkpoint names indicate the target resolution tiers
    recorded upstream. Network architecture, conditioning details, and
    parameter counts are not recorded in this repository's manifest; consult
    the upstream README at the pinned HEAD SHA
    (859021927d8e0f8eb4d91d16f86711b8c25a2023) for those specifics.
  architecture_zh: |
    512 与 1024 检查点名称对应上游记录的目标分辨率档位。网络架构、条件
    机制与参数量仓库 manifest 未记录；请参考固定 HEAD SHA
    （859021927d8e0f8eb4d91d16f86711b8c25a2023）的上游 README。
  usage_notes: |
    Both I2V variants run through WorldFoundryPipelineRunner wrapping the
    in-tree DynamiCrafter runtimes, wired in the unified environment profile
    with staged checkpoint/runtime assets. The family default runtime profile
    is dynamicrafter-512-i2v. Checkpoints are not tracked in git; local
    validation may download the listed repos under cache/hfd.
  usage_notes_zh: |
    两个 I2V 变体均通过 WorldFoundryPipelineRunner 运行，封装树内
    DynamiCrafter 运行时，接入统一环境 profile，使用已就位的检查点/运行时
    资产。家族默认运行时 profile 为 dynamicrafter-512-i2v。检查点不入
    git，本地验证可能将列出的仓库下载到 cache/hfd。
  limitations: |
    The HF repos expose no license in cardData (license_status pending), so
    redistribution stays gated until the upstream license is reviewed
    manually. Demo parity and runner parity are pending for both variants;
    official long-config parity has not been demonstrated. GPU/VRAM
    requirements are not recorded in this repository.
  limitations_zh: |
    HF 仓库的 cardData 未暴露许可证（license_status 为 pending），在人工
    审查上游许可证之前再分发保持受限。两个变体的 demo parity 与 runner
    parity 均为 pending，官方长配置一致性尚未验证。GPU/显存需求仓库未
    记录。
  recommended_benchmarks:
    - aigcbench
    - physics-iq
