id: easyanimate
name: EasyAnimate
aliases:
  - easyanimate_i2v
  - easyanimate-i2v
runner_target: worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner
runtime_profile: runtime-profile:easyanimate-i2v
tasks:
  - text-to-video
  - image-to-video
  - video-to-video
source_status:
  status: confirmed_official_github
  github:
    url: https://github.com/aigc-apps/EasyAnimate
    verified_by: git ls-remote --symref https://github.com/aigc-apps/EasyAnimate.git HEAD
    default_branch: main
    head_sha: c2a70d17daa1549a22129d0cd0e02053ecccd75c
checkpoint:
  status: confirmed_public_hf
  verified_by: GET https://huggingface.co/api/models/<repo_id>
  repos:
    - id: alibaba-pai/EasyAnimateV5-12b-zh
      sha: f3d0c964eff71adb0b15947f18ffbf01c19a7b05
      license: other
      private: false
