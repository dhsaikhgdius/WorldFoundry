      tasks:
        - text-to-video
        - image-to-video
    - id: alibaba-pai/EasyAnimateV5.1-12b-zh
      sha: 024eaaeba65e24f4223f60c11558227545f3f9b6
      license: apache-2.0
      private: false
      gated: false
      tasks:
        - text-to-video
        - image-to-video
    - id: alibaba-pai/EasyAnimateV5.1-7b-zh-InP
      sha: a18486a2647f32a8963bee479326947067bab836
      license: apache-2.0
      private: false
      gated: false
      tasks:
        - image-to-video
    - id: alibaba-pai/EasyAnimateV5.1-7b-zh
      sha: 4dd5a1990589332da6294286f32bcc63e143831d
      license: apache-2.0
      private: false
      gated: false
