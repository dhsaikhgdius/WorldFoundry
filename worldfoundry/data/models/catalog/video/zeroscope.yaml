id: zeroscope
name: ZeroScope
aliases:
- zero-scope
- zero_scope
tasks:
- text-to-video
- legacy-unet-diffusion
provider: huggingface
source:
  status: open_source
  license: cc-by-nc-4.0
checkpoint_refs:
- repo_id: cerspense/zeroscope_v2_576w
  license: cc-by-nc-4.0
- repo_id: cerspense/zeroscope_v2_XL
  license: cc-by-nc-4.0
integration:
  status: integrated
runner_target: worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner
runtime_profile: runtime-profile:zeroscope
runner_parity:
  status: verified
  notes:
  - WorldFoundry output matched the official Diffusers route for the selected
    ZeroScope configuration.
  - The Studio/API route uses the unified environment profile; per-run validation
    evidence is tracked outside the model catalog.
notes:
- CC-BY-NC-4.0 requires benchmark policy review before commercial or automated benchmark
  use.
pipeline_binding: zeroscope
catalog_category: video
catalog_scope: Video-generation and video-token catalog entries. Integrated entries
  expose WorldFoundry pipeline targets; metadata-only entries retain upstream provenance
  without runnable WorldFoundry backends.
docs:
  overview: |
    ZeroScope is a community-published open-weight text-to-video model
    distributed through Hugging Face by cerspense, with two checkpoints
    recorded: cerspense/zeroscope_v2_576w and the larger
    cerspense/zeroscope_v2_XL (both CC-BY-NC-4.0). Input is a text prompt;
    output is a generated video. It is tagged text-to-video and
    legacy-unet-diffusion, reflecting the older UNet diffusion lineage.
  overview_zh: |
    ZeroScope 是由 cerspense 通过 Hugging Face 发布的社区开源权重文生
    视频模型，记录两个检查点：cerspense/zeroscope_v2_576w 与更大的
    cerspense/zeroscope_v2_XL（均为 CC-BY-NC-4.0）。输入为文本提示词，
    输出为生成视频。标注为 text-to-video 与 legacy-unet-diffusion，对应
    较早的 UNet 扩散系谱。
  architecture: |
    The 576w checkpoint name records its width tier and XL its larger
    variant. Provider is 'huggingface' - no official GitHub source repo is
    recorded for this entry. Network architecture and parameter counts are
    not recorded in this repository; consult the upstream model cards.
  architecture_zh: |
    检查点名称中 576w 对应其宽度档位，XL 为更大的变体。provider 为
    'huggingface'——本条目未记录官方 GitHub 源码仓库。网络架构与参数量
    仓库未记录，请查阅上游模型卡。
  usage_notes: |
    Runs through WorldFoundryPipelineRunner with runtime profile and pipeline
    binding zeroscope in the unified environment profile. Runner parity is
    verified: WorldFoundry output matched the official Diffusers route for
    the selected ZeroScope configuration. Aliases zero-scope and zero_scope
    resolve here.
  usage_notes_zh: |
    通过 WorldFoundryPipelineRunner 运行，运行时 profile 与 pipeline
    binding 均为 zeroscope，使用统一环境 profile。runner parity 已验证：
    在选定配置下 WorldFoundry 输出与官方 Diffusers 路线一致。别名
    zero-scope、zero_scope 解析到本条目。
  limitations: |
    CC-BY-NC-4.0 is a non-commercial license and requires benchmark policy
    review before commercial or automated benchmark use. Parity evidence
    covers the selected configuration only; per-run validation evidence is
    tracked outside the model catalog. GPU/VRAM requirements are not
    recorded here.
  limitations_zh: |
    CC-BY-NC-4.0 为非商用许可证，在商用或自动化基准使用前需审查基准
    政策。parity 证据仅覆盖选定配置；逐次运行的验证证据在目录之外跟踪。
    GPU/显存需求未记录。
  recommended_benchmarks:
    - vbench
    - evalcrafter
