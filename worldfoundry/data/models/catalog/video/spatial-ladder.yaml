docs:
  overview: |
    SpatialLadder is an open-source spatial reasoning model, cataloged from
    its Hugging Face repository hongxingli/SpatialLadder-3B (the 3B size
    comes from the repo name). In this catalog it is tagged for
    multimodal-reasoning, spatial-reasoning, image-question-answering, and
    video-question-answering - it answers spatial questions about images and
    videos rather than generating video. The entry was originally exposed by
    the WorldFoundry-native-3D integration.
  overview_zh: |
    SpatialLadder 是开源空间推理模型，条目来源于其 Hugging Face 仓库
    hongxingli/SpatialLadder-3B（3B 规模来自仓库名）。本目录中任务标注为
    多模态推理、空间推理、图像问答与视频问答——它回答关于图像与视频的
    空间问题，而非生成视频。该条目最初由 WorldFoundry-native-3D 集成
    暴露。
  architecture: |
    This repository records only provenance (official HF repo, open_source
    status, provider worldfoundry_native) and wiring (runtime profile
    spatial-ladder). Architecture, base-model lineage, and license details
    are not recorded here; consult the upstream model card.
  architecture_zh: |
    本仓库仅记录 provenance（官方 HF 仓库、open_source 状态、provider 为
    worldfoundry_native）与接线（运行时 profile 为 spatial-ladder）。
    架构、基础模型系谱与许可证细节此处未记录，请查阅上游模型卡。
  usage_notes: |
    Runs through WorldFoundryPipelineRunner with pipeline binding
    spatial-ladder. Aliases spatial_ladder and hongxingli/SpatialLadder-3B
    resolve here. The WorldFoundry route is complete; missing
    checkpoint/assets are reported at runtime.
  usage_notes_zh: |
    通过 WorldFoundryPipelineRunner 运行，pipeline binding 为
    spatial-ladder。别名 spatial_ladder、hongxingli/SpatialLadder-3B
    解析到本条目。WorldFoundry 路线已完成；检查点/资产缺失在运行时报告。
  limitations: |
    Runner parity is pending: checkpoint-backed artifact parity has not been
    run in this workspace. No GitHub source repo or license metadata is
    recorded. This is a reasoning/QA model; no video-generation capability is
    claimed, and no matching benchmark from this repository's model
    benchmark catalog is recommended.
  limitations_zh: |
    runner parity 为 pending：本工作区尚未运行有检查点支撑的产物一致性
    验证。未记录 GitHub 源码仓库或许可证元数据。这是推理/问答模型，不
    声称视频生成能力，本仓库基准目录中也没有合适的推荐基准。
  recommended_benchmarks: []
