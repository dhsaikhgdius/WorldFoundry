docs:
  publisher: Shanghai AI Laboratory (Vchitect)
  publisher_kind: lab
  publisher_zh: 上海人工智能实验室（Vchitect 团队）
  overview: 'LongVie is a controllable ultra-long video generation framework from the Vchitect team: it drives a Wan-based diffusion backbone with dense depth and sparse point/track control videos to keep minute-scale videos consistent. This entry is the first-generation adapter; WorldFoundry implements it over the canonical Wan components and shared staged runner, using the control-weight path without the LongVie 2 DiT attention override.'
  overview_zh: LongVie 是 Vchitect 团队的可控超长视频生成框架：用稠密深度与稀疏点/轨迹控制视频来驱动基于 Wan 的扩散基座，使分钟级视频保持一致。本条目是第一代适配器；WorldFoundry 基于规范化 Wan 组件与共享分段 runner 实现，走控制权重路径，不含 LongVie 2 的 DiT 注意力覆盖。
  architecture: LongVie-1 = canonical Wan model + encoders + VAE + VACE/control roles + checkpoint loaders + the shared staged runner. The native runner preserves the official 640x352 segment size and the history/noise continuation state, with optional USP ring/ulysses distributed controls. Its synthesis package is a thin product assembly boundary, not a separate engine.
  architecture_zh: LongVie-1 = 规范化 Wan 模型 + 编码器 + VAE + VACE/控制角色 + checkpoint 加载器 + 共享分段 runner。原生 runner 保留官方 640x352 分段尺寸与历史/噪声续写状态，并支持可选的 USP ring/ulysses 分布式控制。其 synthesis 包只是薄薄的产品装配层，不是独立引擎。
  usage_notes: Default calls fail fast unless execute=True; staged checkpoints are required for the official-equivalent GPU path. Official release-parity evidence is still pending for this generation — if you want the verified route, use longvie-2, which has a recorded checkpoint-backed multi-GPU run.
  usage_notes_zh: 默认调用在未传 execute=True 时快速失败；官方等效 GPU 路径需要预先就位 checkpoint。这一代的官方发布一致性证据仍在等待——想要已验证路径请用 longvie-2，它有记录在案的 checkpoint 加载多卡运行。
  limitations:
  - 'Runner parity is recorded as pending: the WorldFoundry route is wired, but a checkpoint-backed GPU artifact has not been verified in this workspace, so do not treat this page as proof of a validated end-to-end run.'
  - Checkpoints are external assets — missing weights are reported at runtime rather than downloaded automatically.
  - Requires user-provided depth and point/track control videos — it is not a plain I2V model.
  limitations_zh:
  - Runner parity 记录为 pending：WorldFoundry 路径已接好，但本工作区尚未完成 checkpoint 加载的 GPU 产物验证，请勿把本页当作端到端跑通的证明。
  - Checkpoint 属于外部资产——权重缺失时会在运行时报告，而不会自动下载。
  - 需要用户提供深度与点/轨迹控制视频——它不是普通的图生视频模型。
  recommended_benchmarks:
  - id: chronomagic-bench
    reason: Long-horizon suite for minute-scale generation.
    reason_zh: 面向分钟级生成的长时程评测。
