id: wan2.1-vace
name: Wan2.1 VACE
runner_target: worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: wan2.1-vace
tasks:
- video-editing
- video-to-video
- image-to-video
- controlled-video-generation
provider: official_repo
source:
  status: open_source
  official_repo_url: https://github.com/Wan-Video/Wan2.1
  hf_repo_id: Wan-AI/Wan2.1-VACE-14B
official_sources:
  github:
    url: https://github.com/Wan-Video/Wan2.1
  huggingface:
  - repo_id: Wan-AI/Wan2.1-VACE-14B
    status: confirmed
  - repo_id: Wan-AI/Wan2.1-VACE-1.3B-diffusers
    status: confirmed
checkpoints:
- repo_id: Wan-AI/Wan2.1-VACE-14B
- repo_id: Wan-AI/Wan2.1-VACE-1.3B-diffusers
integration:
  status: integrated
  notes:
  - VACE is assembled from the canonical Wan network, UMT5 conditioner, VAE codec, scheduler, initializer, and native runner roles.
  - Loading, placement, offload, sampling, media normalization, and artifact writing are owned by the shared WorldFoundry infra.
  - Image references, source video/mask conditions, and precomputed VACE context tensors are supported without an official-runtime backend.
runner_parity:
  status: integrated
  notes:
  - The native defaults preserve the official VACE-14B 1280x720, 81-frame, 50-step, guidance-scale 5.0 inference shape.
  - Full checkpoint visual parity remains a GPU artifact-validation task rather than a separate backend route.
runtime_profile: runtime-profile:wan2.1-vace
catalog_category: video
catalog_scope: Video-generation and video-token catalog entries. Integrated entries expose WorldFoundry pipeline targets;
  metadata-only entries retain upstream provenance without runnable WorldFoundry backends.
