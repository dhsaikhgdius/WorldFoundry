docs:
  overview: |
    CameraCtrl (hehao13/CameraCtrl, MIT) is the widely used plug-and-play camera-pose control module for video diffusion: it trains a camera encoder over Plücker-embedded pose sequences and injects the features into a frozen text-to-video generator, enabling accurate, generalizable viewpoint control. WorldFoundry provides an in-tree synthesis backend under `worldfoundry/synthesis/visual_generation/cameractrl/cameractrl_runtime` following the official demo trajectory contract; checkpoints remain external assets under the normal hfd/ckpt cache, and the official trajectory text-to-video demo is supported in the unified environment profile.

    Within the WorldFoundry model catalog this entry is tracked as `cameractrl` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/hehao13/CameraCtrl; Hugging Face `hehao13/CameraCtrl`.
  overview_zh: |
    CameraCtrl（hehao13/CameraCtrl，MIT）是广泛使用的即插即用视频扩散相机位姿控制模块：在 Plücker 嵌入的位姿序列上训练相机编码器，并把特征注入冻结的文本到视频生成器，实现精确、可泛化的视角控制。WorldFoundry 在 `worldfoundry/synthesis/visual_generation/cameractrl/cameractrl_runtime` 提供树内合成后端，遵循官方演示轨迹契约；权重保留为常规 hfd/ckpt 缓存下的外部资产，官方轨迹文本到视频演示在统一环境配置中受支持。

    在 WorldFoundry 模型目录中，该条目以 `cameractrl` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/hehao13/CameraCtrl；Hugging Face `hehao13/CameraCtrl`。
  architecture: |
    The published architecture keeps the base video diffusion model (originally AnimateDiff/SVD variants) frozen and adds a camera encoder that turns per-frame Plücker embeddings of camera extrinsics into multi-scale features, injected into the temporal attention layers. Only the camera modules are trained, which is what makes the module plug-and-play across compatible backbones.
  architecture_zh: |
    公开架构冻结基座视频扩散模型（最初为 AnimateDiff/SVD 变体），增加相机编码器：把逐帧相机外参的 Plücker 嵌入转为多尺度特征并注入时间注意力层。仅训练相机模块，因此可在兼容骨干间即插即用。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `cameractrl` and runtime profile `runtime-profile:cameractrl`.
    Catalog integration status: `verified`.
    Integration notes recorded in the catalog:
    - Runtime code is vendored in-tree; checkpoints remain external assets under the normal hfd/ckpt cache.
    - The WorldFoundry runner supports the official trajectory text-to-video demo in the unified environment profile.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: an initial image (and optionally a text prompt) plus a camera trajectory / pose sequence as the control signal.
    - Action space: the action channel is the camera trajectory (extrinsics/pose sequence); the model renders the world consistently along the requested path.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `cameractrl`，运行时配置为 `runtime-profile:cameractrl`。
    目录集成状态：已验证（verified）。
    目录中记录的集成备注（保留原文）：
    - Runtime code is vendored in-tree; checkpoints remain external assets under the normal hfd/ckpt cache.
    - The WorldFoundry runner supports the official trajectory text-to-video demo in the unified environment profile.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：初始图像（可选文本提示）加相机轨迹/位姿序列作为控制信号。
    - 动作空间：动作通道为相机轨迹（外参/位姿序列）；模型沿请求路径一致地渲染世界。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
  limitations: |
