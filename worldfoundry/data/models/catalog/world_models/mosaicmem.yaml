docs:
  overview: |
    MosaicMem (AbdelStark/mosaicmem) is a memory-augmented world-generation route: WorldFoundry registers the source route for memory-plan artifacts, with generator assets runtime-gated. resolve_model_zoo_config and pipeline import are expected to pass; real generation emits a runtime plan until required checkpoints/assets are staged. The catalog scope notes that request-plan entries expose validated planning surfaces without claiming generated artifacts.

    Within the WorldFoundry model catalog this entry is tracked as `mosaicmem` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/AbdelStark/mosaicmem.
  overview_zh: |
    MosaicMem（AbdelStark/mosaicmem）是记忆增强的世界生成路线：WorldFoundry 为记忆计划 artifact 注册源码路线，生成器资产受运行时门控。resolve_model_zoo_config 与管线导入预期通过；在暂存所需权重/资产之前，真实生成输出运行时计划。目录 scope 注明：request-plan 类条目暴露经验证的规划表面，不声称已生成 artifact。

    在 WorldFoundry 模型目录中，该条目以 `mosaicmem` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/AbdelStark/mosaicmem。
  architecture: |
    Recorded modalities are world-model, memory-augmented-generation, and video-generation. Architecture details (memory mechanism, backbone, parameter count) are not recorded in the repository for this entry.
  architecture_zh: |
    记录模态为 world-model、memory-augmented-generation 与 video-generation。该条目的架构细节（记忆机制、骨干、参数量）仓库未记录。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `mosaicmem` and runtime profile `runtime-profile:mosaicmem`.
    Catalog integration status: `runtime_ported`.
    Integration notes recorded in the catalog:
    - MosaicMem source route is registered for memory-plan artifacts; generator assets remain runtime-gated.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: conditioning inputs per the recorded modalities (typically an initial image and/or a text prompt); exact tensor contracts are not recorded in this catalog file.
    - Action space: no explicit action interface is recorded for this entry; controllability is limited to the conditioning inputs.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `mosaicmem`，运行时配置为 `runtime-profile:mosaicmem`。
    目录集成状态：运行时已移植（runtime_ported）。
    目录中记录的集成备注（保留原文）：
    - MosaicMem source route is registered for memory-plan artifacts; generator assets remain runtime-gated.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：按记录的模态提供条件输入（通常为初始图像和/或文本提示）；具体张量契约本目录文件未记录。
    - 动作空间：该条目未记录显式动作接口；可控性仅限于条件输入。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
