docs:
  overview: |
    DreamX-World 5B Cam (AMAP-ML/DreamX-World; Hugging Face `GD-ML/DreamX-World-5B-Cam`, Apache-2.0) is the camera-control variant of AMAP's DreamX-World interactive world model family: image-to-video world generation steered by camera/action control. WorldFoundry provides an in-tree resident camera-control runtime with configurable Ulysses GPU count, and the unified pipeline runs the local 5B Cam and Wan2.2 support checkpoints directly.

    Within the WorldFoundry model catalog this entry is tracked as `dreamx-world-5b-cam` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/AMAP-ML/DreamX-World; Hugging Face `GD-ML/DreamX-World-5B-Cam`.
  overview_zh: |
    DreamX-World 5B Cam（AMAP-ML/DreamX-World；Hugging Face `GD-ML/DreamX-World-5B-Cam`，Apache-2.0）是高德 DreamX-World 交互世界模型家族的相机控制变体：由相机/动作控制引导的图像到视频世界生成。WorldFoundry 提供树内常驻相机控制运行时，Ulysses GPU 数量可配置；统一管线直接运行本地 5B Cam 与 Wan2.2 支撑权重。

    在 WorldFoundry 模型目录中，该条目以 `dreamx-world-5b-cam` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/AMAP-ML/DreamX-World；Hugging Face `GD-ML/DreamX-World-5B-Cam`。
  architecture: |
    The model is a 5B-parameter world generator over the Wan2.2 base stack (the runtime resolves Wan2.2 support checkpoints alongside the 5B Cam weights) with camera-control conditioning. Beyond this composition, the repository does not record architecture details for this entry.
  architecture_zh: |
    该模型是基于 Wan2.2 基座栈的 50 亿参数世界生成器（运行时同时解析 Wan2.2 支撑权重与 5B Cam 权重），带相机控制条件。除该组成外，仓库未记录该条目的架构细节。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `dreamx-world-5b-cam` and runtime profile `runtime-profile:dreamx-world-5b-cam`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - In-tree resident camera-control runtime with configurable Ulysses GPU count.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: an initial image (and optionally a text prompt) plus a camera trajectory / pose sequence as the control signal.
    - Action space: the action channel is the camera trajectory (extrinsics/pose sequence); the model renders the world consistently along the requested path.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `dreamx-world-5b-cam`，运行时配置为 `runtime-profile:dreamx-world-5b-cam`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - In-tree resident camera-control runtime with configurable Ulysses GPU count.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：初始图像（可选文本提示）加相机轨迹/位姿序列作为控制信号。
    - 动作空间：动作通道为相机轨迹（外参/位姿序列）；模型沿请求路径一致地渲染世界。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`integrated`.
    Runner parity notes recorded in the catalog:
    - The unified pipeline runs the local 5B Cam and Wan2.2 support checkpoints directly.

    This documentation only restates metadata already recorded in the catalog; it claims no GPU execution evidence beyond the parity fields above.
  limitations_zh: |
    本目录文件记录的一致性字段：runner_parity=已集成（integrated）。
    目录中记录的 runner 一致性备注（保留原文）：
    - The unified pipeline runs the local 5B Cam and Wan2.2 support checkpoints directly.

    本文档仅整理目录内已记录的元数据，不声称任何超出上述 parity 字段之外的 GPU 实测证据。
  recommended_benchmarks:
  - wrbench
  - camerabench
