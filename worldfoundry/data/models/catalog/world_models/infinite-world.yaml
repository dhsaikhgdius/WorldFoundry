docs:
  overview: |
    Infinite-World (MeiGen-AI/Infinite-World; Hugging Face `MeiGen-AI/Infinite-World`, MIT) is MeiGen's long-horizon interactive image-to-video world model with a memory mechanism for persistent scenes. WorldFoundry's in-tree runtime resolves local or Hugging Face checkpoint layouts without an external repository at inference time; Studio/Pipeline inference is verified with the official image-conditioned long-horizon demo settings, and real GPU inference produced a non-empty long-horizon world video artifact with preview metadata through the Studio workspace job path.

    Within the WorldFoundry model catalog this entry is tracked as `infinite-world` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/MeiGen-AI/Infinite-World; Hugging Face `MeiGen-AI/Infinite-World`.
  overview_zh: |
    Infinite-World（MeiGen-AI/Infinite-World；Hugging Face `MeiGen-AI/Infinite-World`，MIT）是美图 MeiGen 的长时程交互式图像到视频世界模型，带用于场景持久化的记忆机制。WorldFoundry 树内运行时在推理时解析本地或 Hugging Face 权重布局、不依赖外部仓库；Studio/管线推理已按官方图像条件长时程演示设置验证，真实 GPU 推理经 Studio workspace 作业路径产出非空长时程世界视频 artifact 及预览元数据。

    在 WorldFoundry 模型目录中，该条目以 `infinite-world` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/MeiGen-AI/Infinite-World；Hugging Face `MeiGen-AI/Infinite-World`。
  architecture: |
    Recorded modalities are interactive-world-model, long-horizon, image-to-video, and memory: an autoregressive world video generator that retains and reuses generated content to stay consistent over long horizons. Beyond these recorded modalities and the verified demo route, the repository does not record architecture details (backbone, parameter count) for this entry.
  architecture_zh: |
    记录模态为 interactive-world-model、long-horizon、image-to-video 与 memory：自回归世界视频生成器，保留并复用已生成内容以在长时程内保持一致。除记录模态与已验证演示路线外，仓库未记录该条目的架构细节（骨干、参数量等）。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `infinite-world` and runtime profile `runtime-profile:infinite-world`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - In-tree Infinite-World runtime resolves local or Hugging Face checkpoint layouts without relying on an external repository at inference time.
    - Studio/Pipeline inference has been verified with the official image-conditioned long-horizon demo settings.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: an initial image or context frames plus streaming interaction inputs.
    - Action space: keyboard/mouse-style or discrete navigation actions (plus optional camera controls) drive frame-by-frame world evolution.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `infinite-world`，运行时配置为 `runtime-profile:infinite-world`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - In-tree Infinite-World runtime resolves local or Hugging Face checkpoint layouts without relying on an external repository at inference time.
    - Studio/Pipeline inference has been verified with the official image-conditioned long-horizon demo settings.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：初始图像或上下文帧，加流式交互输入。
    - 动作空间：键鼠式或离散导航动作（可选相机控制）驱动逐帧世界演化。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`verified`.
    Runner parity notes recorded in the catalog:
    - Real GPU inference produces a non-empty long-horizon world video artifact with preview metadata through the Studio workspace job path.

    This documentation only restates metadata already recorded in the catalog; it claims no GPU execution evidence beyond the parity fields above.
  limitations_zh: |
    本目录文件记录的一致性字段：runner_parity=已验证（verified）。
    目录中记录的 runner 一致性备注（保留原文）：
