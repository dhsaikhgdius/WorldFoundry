integration:
  status: runtime_ported
  notes:
  - WorldFoundry vendors the official Apache-2.0 causal inference stack under
    synthesis/visual_generation/rcm/rcm_runtime; the adapter owns checkpoint gating, command
    construction, and pipeline/catalog exposure.
  - The upstream `imaginaire` framework package is not vendored. WorldFoundry's own lazy_config,
    easy_io, rank-aware logging, and selective activation checkpointing back the vendored code.
  - BlockPattern/AttnMaskSpec and the block-causal and teacher-forcing mask predicates were lifted into
    worldfoundry/core/attention/block_pattern.py so causal chunk schedules are one shared primitive.
  blocked_reasons:
  - Execution requires the public Causal-rCM DiT checkpoint plus the Wan2.1 VAE and umT5 text encoder to be staged locally.
runner_parity:
  status: implemented_public_checkpoint_not_staged
  notes:
  - The pipeline resolves the vendored causal entrypoint and returns blocked runtime diagnostics until
    the DiT, VAE, and text-encoder checkpoints are staged.
  - Extracted block-mask primitives are verified against the upstream implementation across 702 mask
    configurations and 162 chunk-schedule configurations.
runtime_profile: runtime-profile:causal-rcm
runner_target: worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: causal-rcm
catalog_category: world_models
catalog_scope: World-model catalog entries. Integrated entries expose in-tree WorldFoundry runtimes; blocked
