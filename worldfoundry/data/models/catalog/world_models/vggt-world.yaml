docs:
  overview: |
    VGGT-World (SimonSun0810/VGGT-World) is a world-model route combining video generation with 3D scene understanding: recorded modalities are world-model, 3d-scene-understanding, and video-generation, and the name indicates it builds on the VGGT feed-forward 3D geometry transformer lineage. WorldFoundry registers the official source route; checkpoints and assets are runtime-gated, so real generation emits a runtime plan until required assets are staged.

    Within the WorldFoundry model catalog this entry is tracked as `vggt-world` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/SimonSun0810/VGGT-World.
  overview_zh: |
    VGGT-World（SimonSun0810/VGGT-World）是将视频生成与 3D 场景理解结合的世界模型路线：记录模态为 world-model、3d-scene-understanding 与 video-generation，命名表明它构建于 VGGT 前馈 3D 几何 transformer 谱系。WorldFoundry 注册官方源码路线；权重与资产受运行时门控，在暂存所需资产之前，真实生成输出运行时计划。

    在 WorldFoundry 模型目录中，该条目以 `vggt-world` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/SimonSun0810/VGGT-World。
  architecture: |
    Beyond the modality tags (world model with 3D scene understanding plus video generation) and the registered source route, the repository does not record architecture details (how VGGT geometry features couple to the generator, backbone, parameter count) for this entry.
  architecture_zh: |
    除模态标签（带 3D 场景理解与视频生成的世界模型）与已注册源码路线外，仓库未记录该条目的架构细节（VGGT 几何特征如何与生成器耦合、骨干、参数量）。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `vggt-world` and runtime profile `runtime-profile:vggt-world`.
    Catalog integration status: `runtime_ported`.
    Integration notes recorded in the catalog:
    - VGGT-World official source route is registered; checkpoints/assets are runtime-gated.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: conditioning inputs per the recorded modalities (typically an initial image and/or a text prompt); exact tensor contracts are not recorded in this catalog file.
    - Action space: no explicit action interface is recorded for this entry; controllability is limited to the conditioning inputs.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `vggt-world`，运行时配置为 `runtime-profile:vggt-world`。
    目录集成状态：运行时已移植（runtime_ported）。
    目录中记录的集成备注（保留原文）：
