docs:
  overview: |
    TesserAct (UMass-Embodied-AGI/TesserAct; Hugging Face `anyeZHY/tesseract`) is the UMass Embodied AGI 4D embodied world model: given robot manipulation context and actions it predicts RGB, depth, and normal video jointly, reconstructing a temporally consistent 4D scene rather than RGB alone. WorldFoundry vendors the official WorldArena-listed source in tree under worldfoundry/synthesis/visual_generation/tesseract/tesseract_runtime and registers a runtime manifest pipeline; the inference entrypoint resolves, with checkpoints and embodied task assets runtime-gated.

    Within the WorldFoundry model catalog this entry is tracked as `tesseract` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/UMass-Embodied-AGI/TesserAct; Hugging Face `anyeZHY/tesseract`.
  overview_zh: |
    TesserAct（UMass-Embodied-AGI/TesserAct；Hugging Face `anyeZHY/tesseract`）是马萨诸塞大学 Embodied AGI 组的 4D 具身世界模型：给定机器人操作上下文与动作，联合预测 RGB、深度与法线视频，重建时间一致的 4D 场景而非仅 RGB。WorldFoundry 在 worldfoundry/synthesis/visual_generation/tesseract/tesseract_runtime 内嵌官方 WorldArena 收录源码并注册运行时清单管线；推理入口可解析，权重与具身任务资产受运行时门控。

    在 WorldFoundry 模型目录中，该条目以 `tesseract` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/UMass-Embodied-AGI/TesserAct；Hugging Face `anyeZHY/tesseract`。
  architecture: |
    Per the public project, TesserAct fine-tunes a video diffusion backbone to emit aligned RGB-DN (RGB, depth, normal) streams for robot manipulation scenes, from which 4D geometry can be recovered. Recorded modalities are embodied-world-model, robotics-world-model, and action-conditioned-video; further architecture details are not recorded in the repository.
  architecture_zh: |
    按公开项目，TesserAct 微调视频扩散骨干，为机器人操作场景输出对齐的 RGB-DN（RGB、深度、法线）流，可由此恢复 4D 几何。记录模态为 embodied-world-model、robotics-world-model 与 action-conditioned-video；更多架构细节仓库未记录。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `tesseract` and runtime profile `runtime-profile:tesseract`.
    Catalog integration status: `runtime_ported`.
    Integration notes recorded in the catalog:
    - WorldFoundry registers an in-tree runtime manifest pipeline for the vendored TesserAct source.
    - Official WorldArena-listed source is vendored in-tree under worldfoundry/synthesis/visual_generation/tesseract/tesseract_runtime.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: initial visual context of a robot scene (and optionally text) plus a robot action sequence as conditioning.
    - Action space: robot action trajectories are the conditioning channel: the model predicts the resulting future observations instead of emitting actions itself.
    - Dedicated environment: targets the robot-manipulation domains recorded per checkpoint; no simulator ships with this entry.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `tesseract`，运行时配置为 `runtime-profile:tesseract`。
    目录集成状态：运行时已移植（runtime_ported）。
    目录中记录的集成备注（保留原文）：
    - WorldFoundry registers an in-tree runtime manifest pipeline for the vendored TesserAct source.
    - Official WorldArena-listed source is vendored in-tree under worldfoundry/synthesis/visual_generation/tesseract/tesseract_runtime.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：机器人场景的初始视觉上下文（可选文本），加机器人动作序列作为条件。
    - 动作空间：机器人动作轨迹是条件通道：模型预测动作导致的未来观测，而不是自己输出动作。
    - 是否专用环境：面向各权重记录的机器人操作域；该条目不附带仿真器。
  limitations: |
