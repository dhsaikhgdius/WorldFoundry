  notes:
  - This is an independent WorldFoundry model identity pinned to context_k1/epoch-0.safetensors; users do not select a memory method at runtime.
  - The independent recipe is assembled by NativeDiffusionPipeline from shared Wan components and the framework-owned frozen-context strategy; it does not use an external backend.
  - Checkpoint headers are inspected before construction and full DiT tensors are loaded with exact key and shape coverage.
