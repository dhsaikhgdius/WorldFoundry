docs:
  overview: |
    Echo-Memory Context K=1 is one of the Echo-Memory independent inference models (Echo-Team-Joy-Future-Academy-JD/Echo-Memory, CC-BY-4.0): the Echo-Memory project studies long-video world models with explicit memory, and WorldFoundry catalogs each released memory method as its own model identity instead of a runtime switch. This identity is permanently pinned to `context_k1/epoch-0.safetensors`. The recipe is assembled by NativeDiffusionPipeline from shared Wan components and the framework-owned frozen-context strategy, with no external backend. This is the family's released-weights identity: a 2026-07-20 A100 artifact exists but predates the NativeDiffusionPipeline cutover and is retained only as historical evidence; a fresh two-chunk CUDA artifact, official sample parity, and benchmark scoring remain pending.

    Within the WorldFoundry model catalog this entry is tracked as `echo-memory-context-k1` in the `world_models` category.
    Recorded availability: status=open_source, open_source=True, code=native_worldfoundry, weights=public_huggingface_current_main, license=cc-by-4.0.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/Echo-Team-Joy-Future-Academy-JD/Echo-Memory.
  overview_zh: |
    Echo-Memory 上下文 K=1是 Echo-Memory 独立推理模型之一（Echo-Team-Joy-Future-Academy-JD/Echo-Memory，CC-BY-4.0）：Echo-Memory 项目研究带显式记忆的长视频世界模型，WorldFoundry 将每个已发布的记忆方法登记为独立模型身份，而非运行时开关。该身份永久锁定到 `context_k1/epoch-0.safetensors`。recipe 由 NativeDiffusionPipeline 从共享 Wan 组件与框架自有的冻结上下文（frozen-context）策略组装，无外部后端。这是该家族已发布权重的身份：存在 2026-07-20 的 A100 artifact，但早于 NativeDiffusionPipeline 切换，仅保留为历史证据；全新两块 CUDA artifact、官方样例一致性与基准评分仍待完成。

    在 WorldFoundry 模型目录中，该条目以 `echo-memory-context-k1` 收录于 `world_models` 分类。
    仓库记录的可用性：状态=open_source，是否开源=True，代码=native_worldfoundry，权重=public_huggingface_current_main，许可证=cc-by-4.0。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/Echo-Team-Joy-Future-Academy-JD/Echo-Memory。
  architecture: |
    The base is a Wan-family video diffusion transformer driven by image/text/camera-trajectory conditioning; this identity's memory mechanism is: a frozen-context window of K=1 retrieved context chunk (the minimal-context baseline of the family). The released 1185-tensor K=1 DiT is covered by native structural loading, and its weights are public on the current Hub main. Checkpoint headers are inspected before construction and full DiT tensors are loaded with exact key and shape coverage. Beyond the memory-method configuration, the repository does not record further architecture details (parameter count, training data) for this entry.
  architecture_zh: |
    基座为由图像/文本/相机轨迹条件驱动的 Wan 系视频扩散 transformer；该身份的记忆机制为：冻结上下文窗口 K=1（家族的最小上下文基线）。已发布的 1185 张量 K=1 DiT 由原生结构加载覆盖，其权重在当前 Hub main 公开。构建前检查权重头，DiT 全量张量按精确键与形状覆盖加载。除记忆方法配置外，仓库未记录该条目更多架构细节（参数量、训练数据等）。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `echo-memory-context-k1` and runtime profile `runtime-profile:echo-memory-context-k1`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - This is an independent WorldFoundry model identity pinned to context_k1/epoch-0.safetensors; users do not select a memory method at runtime.
    - The independent recipe is assembled by NativeDiffusionPipeline from shared Wan components and the framework-owned frozen-context strategy; it does not use an external backend.
    - Checkpoint headers are inspected before construction and full DiT tensors are loaded with exact key and shape coverage.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: an initial image, a text prompt, and a camera trajectory; long-horizon generation additionally consumes retrieved memory frames per the frozen-context strategy.
    - Action space: the camera trajectory is the control channel; the memory mechanism itself is fixed per model identity and is not a runtime option.
    - Dedicated environment: not tied to an external environment; each identity is permanently pinned to one released memory-method checkpoint.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `echo-memory-context-k1`，运行时配置为 `runtime-profile:echo-memory-context-k1`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - This is an independent WorldFoundry model identity pinned to context_k1/epoch-0.safetensors; users do not select a memory method at runtime.
    - The independent recipe is assembled by NativeDiffusionPipeline from shared Wan components and the framework-owned frozen-context strategy; it does not use an external backend.
    - Checkpoint headers are inspected before construction and full DiT tensors are loaded with exact key and shape coverage.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：初始图像、文本提示与相机轨迹；长时程生成还按冻结上下文策略消费检索到的记忆帧。
    - 动作空间：相机轨迹是控制通道；记忆机制本身按模型身份固定，不是运行时选项。
    - 是否专用环境：不绑定外部环境；每个身份永久锁定到一个已发布的记忆方法权重。
