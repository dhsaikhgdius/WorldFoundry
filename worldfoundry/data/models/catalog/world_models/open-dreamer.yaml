docs:
  overview: |
    Open Dreamer (next-state/open-dreamer) is an open reimplementation of the Dreamer 4 world-model rollout for Minecraft: WorldFoundry registers a source-bound runtime manifest that drives the official rollout entrypoint (reactor-team/open-dreamer inference.py) as a subprocess. The adapter under synthesis/visual_generation/world_model/open_dreamer is WorldFoundry-authored glue only — it resolves the staged checkout, gates on staging requirements, and builds the official command — while WorldFoundry interaction tokens are rendered into Minecraft/VPT action JSONL so the shared world-model call surface drives the Dreamer 4 action space.

    Within the WorldFoundry model catalog this entry is tracked as `open-dreamer` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/next-state/open-dreamer.
  overview_zh: |
    Open Dreamer（next-state/open-dreamer）是 Dreamer 4 世界模型 rollout 在 Minecraft 上的开源复现：WorldFoundry 注册源码绑定的运行时清单，以子进程方式驱动官方 rollout 入口（reactor-team/open-dreamer inference.py）。synthesis/visual_generation/world_model/open_dreamer 下的适配器仅为 WorldFoundry 编写的胶水代码——解析暂存 checkout、按暂存要求门控、构建官方命令——同时 WorldFoundry 交互 token 被渲染为 Minecraft/VPT 动作 JSONL，使共享世界模型调用面驱动 Dreamer 4 动作空间。

    在 WorldFoundry 模型目录中，该条目以 `open-dreamer` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/next-state/open-dreamer。
  architecture: |
    Per the Dreamer 4 lineage, the model is a diffusion-based interactive world model trained on Minecraft gameplay that predicts future frames conditioned on VPT-style keyboard/mouse actions; the open reimplementation runs on JAX. Beyond the rollout contract (368x640 Minecraft/VPT context clip, action JSONL), the repository does not record further architecture details for this entry.
  architecture_zh: |
    按 Dreamer 4 谱系，该模型是基于扩散的交互式世界模型，在 Minecraft 游戏数据上训练，以 VPT 式键鼠动作为条件预测未来帧；开源复现运行在 JAX 上。除 rollout 契约（368x640 Minecraft/VPT 上下文片段、动作 JSONL）外，仓库未记录该条目更多架构细节。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `open-dreamer` and runtime profile `runtime-profile:open-dreamer`.
    Catalog integration status: `runtime_ported`.
    Integration notes recorded in the catalog:
    - WorldFoundry registers a source-bound runtime manifest that drives the official rollout entrypoint (reactor-team/open-dreamer inference.py) as a subprocess.
    - The adapter under synthesis/visual_generation/world_model/open_dreamer is WorldFoundry-authored glue only; it resolves the staged checkout, gates on staging requirements, and builds the official command.
    - WorldFoundry interaction tokens are rendered into Minecraft/VPT action JSONL so the shared world-model call surface (interactions=[...]) drives the Dreamer 4 action space.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: an initial image or context frames plus streaming interaction inputs.
    - Action space: Minecraft/VPT keyboard-mouse actions supplied as JSONL; WorldFoundry interaction tokens are translated into this format automatically.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `open-dreamer`，运行时配置为 `runtime-profile:open-dreamer`。
    目录集成状态：运行时已移植（runtime_ported）。
    目录中记录的集成备注（保留原文）：
    - WorldFoundry registers a source-bound runtime manifest that drives the official rollout entrypoint (reactor-team/open-dreamer inference.py) as a subprocess.
    - The adapter under synthesis/visual_generation/world_model/open_dreamer is WorldFoundry-authored glue only; it resolves the staged checkout, gates on staging requirements, and builds the official command.
    - WorldFoundry interaction tokens are rendered into Minecraft/VPT action JSONL so the shared world-model call surface (interactions=[...]) drives the Dreamer 4 action space.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：初始图像或上下文帧，加流式交互输入。
    - 动作空间：以 JSONL 提供的 Minecraft/VPT 键鼠动作；WorldFoundry 交互 token 会自动翻译为该格式。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
