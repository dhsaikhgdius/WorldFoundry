  overview: 'HyDRA is a camera-controlled video-to-video world model: it re-renders an input video along new camera behavior described by a camera JSON. In this catalog the official source is vendored at a pinned revision and the in-tree runtime plus WRBench camera JSON route are wired; GPU artifact validation waits on checkpoints.'
  overview_zh: HyDRA 是相机可控的视频到视频世界模型：按 camera JSON 描述的新相机行为重新渲染输入视频。本 catalog 中官方源码以固定 revision 内置，树内运行时与 WRBench camera JSON 路径已接通；GPU 产物验证待 checkpoint 就位。
  architecture: Architecture internals are not recorded in this repository. The pinned public revision has no LICENSE file, so license review remains required before downstream use.
  architecture_zh: 架构内部细节仓库未记录。固定的公开 revision 无 LICENSE 文件，下游使用前必须先做许可审查。
  usage_notes: Bundled source is mandatory — external source checkouts are rejected. Inputs are prompt, video, and camera_json; stage checkpoints before expecting artifacts.
  usage_notes_zh: 必须使用内置源码——外部源码检出会被拒绝。输入为提示词、视频与 camera_json；期望得到产物前请先就位 checkpoint。
