docs:
  overview: |
    HyDRA is a camera-controlled video-to-video world model whose official source is vendored in tree at revision 48652becf0030edbaabde4d04f33bb33ad380410. The public repository has no LICENSE file at the pinned revision, so license review remains required. The in-tree runtime and the WRBench camera-JSON route are wired; GPU artifact validation requires checkpoints.

    Within the WorldFoundry model catalog this entry is tracked as `hydra` in the `world_models` category.
    The repository does not record an official source link for this entry.
  overview_zh: |
    HyDRA 是相机控制的视频到视频世界模型，官方源码以 revision 48652becf0030edbaabde4d04f33bb33ad380410 内嵌在树内。公开仓库在锁定 revision 下没有 LICENSE 文件，许可证审查仍属必需。树内运行时与 WRBench 相机 JSON 路线已接通；GPU artifact 验证需要权重。

    在 WorldFoundry 模型目录中，该条目以 `hydra` 收录于 `world_models` 分类。
    仓库未记录该条目的官方来源链接。
  architecture: |
    Recorded modalities are camera-controlled-video, video-to-video, and world-model; the runtime consumes WRBench-style camera JSON trajectories. No official GitHub/Hugging Face source links, parameter counts, or backbone details are recorded in the repository for this entry.
  architecture_zh: |
    记录模态为 camera-controlled-video、video-to-video 与 world-model；运行时消费 WRBench 式相机 JSON 轨迹。仓库未记录该条目的官方 GitHub/Hugging Face 来源链接、参数量或骨干细节。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `hydra` and runtime profile `runtime-profile:hydra`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - Official source is vendored at revision 48652becf0030edbaabde4d04f33bb33ad380410.
    - The public repository has no LICENSE file in the pinned revision; license review remains required.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: an input video plus a camera trajectory (WRBench camera JSON) as the control signal.
    - Action space: the action channel is the camera trajectory (extrinsics/pose sequence); the model renders the world consistently along the requested path.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `hydra`，运行时配置为 `runtime-profile:hydra`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - Official source is vendored at revision 48652becf0030edbaabde4d04f33bb33ad380410.
    - The public repository has no LICENSE file in the pinned revision; license review remains required.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：输入视频加相机轨迹（WRBench 相机 JSON）作为控制信号。
    - 动作空间：动作通道为相机轨迹（外参/位姿序列）；模型沿请求路径一致地渲染世界。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`pending`.
    Runner parity notes recorded in the catalog:
