docs:
  overview: |
    ATI-Wan2.1-14B (bytedance/ATI, Apache-2.0) is ByteDance's 'Any Trajectory Instruction' controllable video generation: user-drawn trajectories (camera paths or object motion) condition a Wan2.1-14B image-to-video backbone. WorldFoundry vendors only ATI's official inference delta and reuses the unchanged Wan2.1 implementation from `worldfoundry/base_models`; runtime checkpoint loading builds a read-only union of ATI weights and locally staged Wan2.1 I2V base components. In-tree import and camera-track compilation are verified, while full GPU artifact parity requires staged weights.

    Within the WorldFoundry model catalog this entry is tracked as `ati-wan21-14b` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/bytedance/ATI; Hugging Face `bytedance-research/ATI`.
  overview_zh: |
    ATI-Wan2.1-14B（bytedance/ATI，Apache-2.0）是字节跳动的『Any Trajectory Instruction』可控视频生成：用户绘制的轨迹（相机路径或物体运动）作为 Wan2.1-14B 图像到视频骨干的条件。WorldFoundry 仅内嵌 ATI 官方推理增量，未改动的 Wan2.1 实现复用自 `worldfoundry/base_models`；运行时权重加载构建 ATI 权重与本地暂存 Wan2.1 I2V 基座组件的只读并集。树内导入与相机轨迹编译已验证，完整 GPU artifact 一致性需暂存权重。

    在 WorldFoundry 模型目录中，该条目以 `ati-wan21-14b` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/bytedance/ATI；Hugging Face `bytedance-research/ATI`。
  architecture: |
    The published method injects trajectory instructions as a unified motion-control signal into the Wan2.1-14B I2V diffusion transformer through a lightweight conditioning pathway, so camera movement and object motion are controlled by the same trajectory interface. The repository records only the inference-delta integration; further architecture details are not recorded.
  architecture_zh: |
    公开方法通过轻量条件通路把轨迹指令作为统一运动控制信号注入 Wan2.1-14B I2V 扩散 transformer，使相机运动与物体运动共用同一轨迹接口控制。仓库仅记录推理增量集成；更多架构细节未记录。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `ati-wan21-14b` and runtime profile `runtime-profile:ati-wan21-14b`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - Only ATI's official inference delta is vendored; the unchanged Wan2.1 implementation is reused from worldfoundry/base_models.
    - Runtime checkpoint loading builds a read-only union of ATI weights and locally staged Wan2.1 I2V base components.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: an initial image (and optionally a text prompt) plus a camera trajectory / pose sequence as the control signal.
    - Action space: user-specified trajectory instructions (camera paths and/or object-motion tracks) form the control channel.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `ati-wan21-14b`，运行时配置为 `runtime-profile:ati-wan21-14b`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - Only ATI's official inference delta is vendored; the unchanged Wan2.1 implementation is reused from worldfoundry/base_models.
    - Runtime checkpoint loading builds a read-only union of ATI weights and locally staged Wan2.1 I2V base components.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：初始图像（可选文本提示）加相机轨迹/位姿序列作为控制信号。
    - 动作空间：用户指定的轨迹指令（相机路径与/或物体运动轨迹）构成控制通道。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`pending`.
    Runner parity notes recorded in the catalog:
    - In-tree import and camera-track compilation are verified; full GPU artifact parity requires staged weights.

    This documentation only restates metadata already recorded in the catalog; it claims no GPU execution evidence beyond the parity fields above.
  limitations_zh: |
    本目录文件记录的一致性字段：runner_parity=待验证（pending）。
