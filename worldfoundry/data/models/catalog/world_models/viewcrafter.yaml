docs:
  overview: |
    ViewCrafter (Drexubery/ViewCrafter, Apache-2.0) is the widely used novel-view-synthesis world route: it combines DUSt3R-based point-cloud reconstruction from one or few input images with a video diffusion prior, rendering the point cloud along a requested camera trajectory and letting the diffusion model inpaint and polish the result into high-fidelity novel views. Tracked checkpoints include `Drexubery/ViewCrafter_25`, `ViewCrafter_25_sparse`, `ViewCrafter_16`, `ViewCrafter_25_512`, and `Doubiiu/ViewCrafter`. WorldFoundry registers the official source route; checkpoints and DUSt3R/view assets are runtime-gated.

    Within the WorldFoundry model catalog this entry is tracked as `viewcrafter` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/Drexubery/ViewCrafter; Hugging Face `Drexubery/ViewCrafter_25`, `Drexubery/ViewCrafter_25_sparse`, `Drexubery/ViewCrafter_16`, `Drexubery/ViewCrafter_25_512`, `Doubiiu/ViewCrafter`.
  overview_zh: |
    ViewCrafter（Drexubery/ViewCrafter，Apache-2.0）是广泛使用的新视角合成世界路线：将基于 DUSt3R 的单图/少图点云重建与视频扩散先验结合，沿请求相机轨迹渲染点云，再由扩散模型补全并打磨成高保真新视角。跟踪权重包括 `Drexubery/ViewCrafter_25`、`ViewCrafter_25_sparse`、`ViewCrafter_16`、`ViewCrafter_25_512` 与 `Doubiiu/ViewCrafter`。WorldFoundry 注册官方源码路线；权重与 DUSt3R/视角资产受运行时门控。

    在 WorldFoundry 模型目录中，该条目以 `viewcrafter` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/Drexubery/ViewCrafter；Hugging Face `Drexubery/ViewCrafter_25`、`Drexubery/ViewCrafter_25_sparse`、`Drexubery/ViewCrafter_16`、`Drexubery/ViewCrafter_25_512`、`Doubiiu/ViewCrafter`。
  architecture: |
    The published architecture conditions a VideoCrafter-family video diffusion model on coarse point-cloud renders produced by DUSt3R geometry, so exact camera pose control comes from geometry while photorealism comes from the learned prior; iterative view extension grows the reconstructed scene. Variant checkpoints differ in frame count (16/25) and resolution (512). Recorded modalities are novel-view-synthesis, camera-control, sparse-view, and 3d-reconstruction.
  architecture_zh: |
    公开架构以 DUSt3R 几何产出的粗点云渲染为条件驱动 VideoCrafter 系视频扩散模型：精确相机位姿控制来自几何，照片级真实感来自学习先验；迭代视角扩展可逐步扩大重建场景。变体权重按帧数（16/25）与分辨率（512）区分。记录模态为 novel-view-synthesis、camera-control、sparse-view 与 3d-reconstruction。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `viewcrafter` and runtime profile `runtime-profile:viewcrafter`.
    Catalog integration status: `runtime_ported`.
    Integration notes recorded in the catalog:
    - ViewCrafter official source route is registered; checkpoints and DUSt3R/view assets are runtime-gated.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: one or a few input images plus a requested camera trajectory; DUSt3R point-cloud reconstruction is part of the pipeline inputs.
    - Action space: the action channel is the camera trajectory (extrinsics/pose sequence); the model renders the world consistently along the requested path.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `viewcrafter`，运行时配置为 `runtime-profile:viewcrafter`。
    目录集成状态：运行时已移植（runtime_ported）。
    目录中记录的集成备注（保留原文）：
    - ViewCrafter official source route is registered; checkpoints and DUSt3R/view assets are runtime-gated.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：单张或少量输入图像加请求相机轨迹；DUSt3R 点云重建是管线输入的一部分。
    - 动作空间：动作通道为相机轨迹（外参/位姿序列）；模型沿请求路径一致地渲染世界。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
  limitations: |
