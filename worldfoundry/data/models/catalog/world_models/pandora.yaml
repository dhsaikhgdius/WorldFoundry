docs:
  overview: |
    Pandora is a diffusion world model tracked for general world generation via text-to-video: recorded modalities are diffusion-world-model, world-generation, and text-to-video. WorldFoundry vendors the runtime source in-tree and exposes a PandoraSynthesis runtime-plan wrapper; full generation remains blocked because the official weights are hidden, so real runs require caller-provided official-compatible checkpoints. No official GitHub repository or Hugging Face checkpoint is recorded in this catalog file.

    Within the WorldFoundry model catalog this entry is tracked as `pandora` in the `world_models` category.
    The repository does not record an official source link for this entry.
  overview_zh: |
    Pandora 是本目录跟踪的扩散世界模型，面向通过文本到视频实现的通用世界生成：记录模态为 diffusion-world-model、world-generation 与 text-to-video。WorldFoundry 在树内内嵌运行时源码并暴露 PandoraSynthesis 运行时计划包装器；由于官方权重未公开，完整生成保持受阻，真实运行需要调用方提供与官方兼容的权重。本目录文件未记录官方 GitHub 仓库或 Hugging Face 权重。

    在 WorldFoundry 模型目录中，该条目以 `pandora` 收录于 `world_models` 分类。
    仓库未记录该条目的官方来源链接。
  architecture: |
    The recorded modality set describes a diffusion-based world generator driven by text prompts. Beyond the vendored runtime source and the hidden-weights gating, the repository does not record architecture details (backbone, parameter count, action interface) for this entry.
  architecture_zh: |
    记录的模态组合描述了由文本提示驱动的扩散式世界生成器。除内嵌运行时源码与隐藏权重门控外，仓库未记录该条目的架构细节（骨干、参数量、动作接口）。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `pandora` and runtime profile `runtime-profile:pandora`.
    Catalog integration status: `planned`.
    Integration notes recorded in the catalog:
    - Runtime source is vendored in-tree; full generation remains blocked by hidden official weights.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: conditioning inputs per the recorded modalities (typically an initial image and/or a text prompt); exact tensor contracts are not recorded in this catalog file.
    - Action space: no explicit action interface is recorded for this entry; controllability is limited to the conditioning inputs.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `pandora`，运行时配置为 `runtime-profile:pandora`。
    目录集成状态：计划中（planned）。
    目录中记录的集成备注（保留原文）：
    - Runtime source is vendored in-tree; full generation remains blocked by hidden official weights.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：按记录的模态提供条件输入（通常为初始图像和/或文本提示）；具体张量契约本目录文件未记录。
    - 动作空间：该条目未记录显式动作接口；可控性仅限于条件输入。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`implemented_hidden_weights_pending`.
    Runner parity notes recorded in the catalog:
    - PandoraSynthesis provides an in-tree runtime plan wrapper; real generation requires caller-provided official-compatible checkpoints.

    This documentation only restates metadata already recorded in the catalog; it claims no GPU execution evidence beyond the parity fields above.
  limitations_zh: |
    本目录文件记录的一致性字段：runner_parity=`implemented_hidden_weights_pending`。
    目录中记录的 runner 一致性备注（保留原文）：
