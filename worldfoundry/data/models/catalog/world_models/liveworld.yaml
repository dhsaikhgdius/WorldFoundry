docs:
  overview: |
    LiveWorld is a camera-controlled video-to-video world model whose official source is vendored in tree at revision a31145ffffb61be92f93c1e0d2ac5d826f29a256; a dedicated geometry-NPZ and monitor-centric inference route is wired, with runner validation pending. No official GitHub or Hugging Face source links are recorded on this entry.

    Within the WorldFoundry model catalog this entry is tracked as `liveworld` in the `world_models` category.
    The repository does not record an official source link for this entry.
  overview_zh: |
    LiveWorld 是相机控制的视频到视频世界模型，官方源码以 revision a31145ffffb61be92f93c1e0d2ac5d826f29a256 内嵌在树内；专用几何 NPZ 与 monitor 中心推理路线已接通，runner 验证待完成。该条目未记录官方 GitHub 或 Hugging Face 来源链接。

    在 WorldFoundry 模型目录中，该条目以 `liveworld` 收录于 `world_models` 分类。
    仓库未记录该条目的官方来源链接。
  architecture: |
    Recorded modalities are camera-controlled-video, video-to-video, and world-model, with a geometry-NPZ input contract. Architecture details (backbone, parameter count, training data) are not recorded in the repository.
  architecture_zh: |
    记录模态为 camera-controlled-video、video-to-video 与 world-model，输入契约为几何 NPZ。架构细节（骨干、参数量、训练数据）仓库未记录。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `liveworld` and runtime profile `runtime-profile:liveworld`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - Official source is vendored at revision a31145ffffb61be92f93c1e0d2ac5d826f29a256.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: an input video plus geometry NPZ bundles and a camera trajectory, per the wired inference route.
    - Action space: the action channel is the camera trajectory (extrinsics/pose sequence); the model renders the world consistently along the requested path.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `liveworld`，运行时配置为 `runtime-profile:liveworld`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - Official source is vendored at revision a31145ffffb61be92f93c1e0d2ac5d826f29a256.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：输入视频加几何 NPZ 包与相机轨迹（按已接通的推理路线）。
    - 动作空间：动作通道为相机轨迹（外参/位姿序列）；模型沿请求路径一致地渲染世界。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
  limitations: |
