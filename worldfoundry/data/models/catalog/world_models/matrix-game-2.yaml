catalog_policy:
  checkpoint_rule: Only list checkpoints that were confirmed on official Hugging Face
    model pages. Do not download weights.
  integration_rule: Closed, API-only, or unknown releases stay blocked or planned
    until an official integration surface is available.
  open_source_rule: Only mark open_source when an official GitHub repository or official
    Hugging Face model page was confirmed. Do not infer checkpoint availability from
    papers, demos, or third-party mirrors.
docs:
  publisher: Skywork AI (Kunlun Tech)
  publisher_kind: company
  publisher_zh: 昆仑万维（Skywork AI）
  overview: 'Matrix-Game 2.0 is Skywork''s real-time-oriented interactive world model generation: an auto-regressive diffusion design that follows keyboard/mouse actions across game scenes. In this catalog the runner is verified with the official inference_universal defaults — 150 frames at 12 fps, 352x640, official bench actions — through the in-tree runtime.'
  overview_zh: Matrix-Game 2.0 是昆仑万维面向实时的交互式世界模型：自回归扩散设计，在游戏场景中跟随键鼠动作。本 catalog 中 runner 已按官方 inference_universal 默认值验证——150 帧、12 fps、352x640、官方 bench 动作——经树内运行时运行。
  architecture: The in-tree runtime has no external repo_root dependency, and the WorldFoundry runner uses the official defaults plus the in-tree Bench_actions_* condition generator. A universal-action-validation variant is recorded for benchmarking action fidelity.
  architecture_zh: 树内运行时无外部 repo_root 依赖，WorldFoundry runner 使用官方默认值与树内 Bench_actions_* 条件生成器。另记录一个 universal-action-validation variant 用于动作保真度基准测试。
  usage_notes: Start from the verified official defaults (num_frames=150, fps=12, seed=42, size 352x640, official_bench_actions=true) before customizing. Per-run artifact checks are tracked outside the catalog.
  usage_notes_zh: 自定义前请从已验证的官方默认值出发（num_frames=150、fps=12、seed=42、352x640、 official_bench_actions=true）。每次运行的产物检查在 catalog 外跟踪。
  limitations:
  - 352x640 default resolution targets real-time interaction, not cinematic quality.
  limitations_zh:
  - 默认 352x640 分辨率面向实时交互，而非影视级画质。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Action-conditioned game-world rollout quality.
    reason_zh: 动作条件游戏世界滚动生成质量。
