    Demo parity notes recorded in the catalog:
    - The official universal-mode command is wired through the formal model-zoo helper. The Studio/API route uses the full official default, num_output_frames=150, seed=42, and official Bench_actions_* trajectories.

    This documentation only restates metadata already recorded in the catalog; it claims no GPU execution evidence beyond the parity fields above.
