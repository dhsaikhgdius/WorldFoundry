docs:
  overview: |
    WildWorld (ShandaAI/WildWorld) is tracked in the world_models catalog as a benchmark/dataset entry rather than a generative model: recorded modalities are world-model-benchmark, dataset, and evaluation. WorldFoundry registers the official source route with benchmark/dataset assets runtime-gated; the entry preserves upstream provenance so the evaluation-side tooling can resolve it, while real execution emits a runtime plan until assets are staged.

    Within the WorldFoundry model catalog this entry is tracked as `wildworld` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/ShandaAI/WildWorld.
