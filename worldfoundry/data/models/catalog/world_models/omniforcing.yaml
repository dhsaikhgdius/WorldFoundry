docs:
  overview: |
    OmniForcing (OmniForcing/OmniForcing) is an audio-visual world model in the Forcing lineage: recorded modalities are audio-visual-world-model, real-time-generation, and distillation, i.e. a distilled generator that produces synchronized audio and video at interactive rates. WorldFoundry registers the official source route; checkpoints and runtime assets are runtime-gated, so real generation emits a runtime plan until required assets are staged.

    Within the WorldFoundry model catalog this entry is tracked as `omniforcing` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/OmniForcing/OmniForcing.
  overview_zh: |
    OmniForcing（OmniForcing/OmniForcing）是 Forcing 谱系的视听世界模型：记录模态为 audio-visual-world-model、real-time-generation 与 distillation，即经蒸馏、能以交互速率同步生成音频与视频的生成器。WorldFoundry 注册官方源码路线；权重与运行时资产受运行时门控，在暂存所需资产之前，真实生成输出运行时计划。

    在 WorldFoundry 模型目录中，该条目以 `omniforcing` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/OmniForcing/OmniForcing。
  architecture: |
    The recorded modality set indicates a distillation-accelerated causal generator covering both audio and visual streams for real-time world generation. Beyond these modality tags and the registered source route, the repository does not record architecture details (backbone, parameter count, audio codec) for this entry.
  architecture_zh: |
    记录的模态组合表明这是经蒸馏加速、同时覆盖音频与视觉流的因果生成器，面向实时世界生成。除这些模态标签与已注册的源码路线外，仓库未记录该条目的架构细节（骨干、参数量、音频编解码器）。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `omniforcing` and runtime profile `runtime-profile:omniforcing`.
    Catalog integration status: `runtime_ported`.
    Integration notes recorded in the catalog:
    - OmniForcing official source route is registered; checkpoints/runtime assets are runtime-gated.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: conditioning inputs are not recorded in this catalog file beyond the audio-visual modality tags.
    - Action space: no explicit action interface is recorded for this entry; controllability is limited to the conditioning inputs.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `omniforcing`，运行时配置为 `runtime-profile:omniforcing`。
    目录集成状态：运行时已移植（runtime_ported）。
    目录中记录的集成备注（保留原文）：
    - OmniForcing official source route is registered; checkpoints/runtime assets are runtime-gated.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：除视听模态标签外，本目录文件未记录条件输入的具体契约。
    - 动作空间：该条目未记录显式动作接口；可控性仅限于条件输入。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`implemented_checkpoint_pending`.
