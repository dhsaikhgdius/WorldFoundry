docs:
  publisher: Etched / Decart
  publisher_kind: company
  publisher_zh: Etched / Decart
  overview: 'Oasis 500M (open-oasis) is the open release of the famous playable-Minecraft world model: an action-conditioned diffusion transformer that renders the next game frame from context frames and keyboard/mouse actions. In this catalog the source is vendored in-tree; execution waits on the Etched/oasis-500m checkpoint plus prompt image/video and action tensors.'
  overview_zh: Oasis 500M（open-oasis）是著名「可游玩 Minecraft」世界模型的开源版本：动作条件扩散 Transformer，从上下文帧与键鼠动作渲染下一游戏帧。本 catalog 中源码已内置树内；执行待 Etched/oasis-500m checkpoint 及提示图像/视频与动作张量就位。
  architecture: Per the upstream release, a ViT VAE compresses frames and a 500M diffusion transformer generates the next frame conditioned on past frames and actions (MIT license). Internals beyond this are not recorded here.
  architecture_zh: 按上游发布，ViT VAE 压缩帧，500M 扩散 Transformer 以历史帧与动作为条件生成下一帧（MIT 许可）。除此之外的内部细节此处未记录。
  usage_notes: The pipeline resolves the official generate entrypoint and returns blocked diagnostics until checkpoints and action assets are staged. Supply action tensors in the official format.
  usage_notes_zh: pipeline 解析官方 generate 入口，在 checkpoint 与动作资产就位前返回 blocked 诊断。请按官方格式提供动作张量。
  limitations:
  - Execution is checkpoint/environment/action-asset gated.
  - '500M research model: short-horizon drift and low resolution versus commercial demos.'
  limitations_zh:
  - 执行受 checkpoint/环境/动作资产限制。
  - 500M 研究模型：相较商业 demo 存在短时漂移与低分辨率。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Action-conditioned game-world rollout quality.
    reason_zh: 动作条件游戏世界滚动生成质量。
