docs:
  overview: |
    Oasis 500M (etched-ai/open-oasis; Hugging Face `Etched/oasis-500m`) is the open-sourced 500M-parameter snapshot of Oasis, the Decart/Etched interactive Minecraft world model: it generates playable Minecraft-style video frame by frame from keyboard/mouse actions, with no game engine behind it. WorldFoundry vendors the Open-Oasis source as an independent in-tree package and registers a model-specific pipeline; the official generate entrypoint resolves, and real inference remains gated until the checkpoint and action assets are staged.

    Within the WorldFoundry model catalog this entry is tracked as `oasis-500m` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/etched-ai/open-oasis; Hugging Face `Etched/oasis-500m`.
  overview_zh: |
    Oasis 500M（etched-ai/open-oasis；Hugging Face `Etched/oasis-500m`）是 Decart/Etched 交互式 Minecraft 世界模型 Oasis 的开源 5 亿参数快照：从键鼠动作逐帧生成可游玩的 Minecraft 风格视频，背后没有游戏引擎。WorldFoundry 将 Open-Oasis 源码内嵌为独立树内包并注册专属管线；官方 generate 入口可解析，真实推理在暂存权重与动作资产之前保持门控。

    在 WorldFoundry 模型目录中，该条目以 `oasis-500m` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/etched-ai/open-oasis；Hugging Face `Etched/oasis-500m`。
  architecture: |
    Per the public release, Open-Oasis pairs a ViT-based VAE with a ~500M-parameter diffusion transformer trained with Diffusion Forcing-style noise schedules for autoregressive frame generation conditioned on Minecraft keyboard/mouse actions. The in-tree route tracks the official generate script contract; further architecture details are not recorded in the repository.
  architecture_zh: |
    按公开发布，Open-Oasis 由基于 ViT 的 VAE 与约 5 亿参数的扩散 transformer 组成，采用 Diffusion Forcing 式噪声调度训练，以 Minecraft 键鼠动作为条件自回归生成帧。树内路线跟踪官方 generate 脚本契约；更多架构细节仓库未记录。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `oasis-500m` and runtime profile `runtime-profile:oasis-500m`.
    Catalog integration status: `runtime_ported`.
    Integration notes recorded in the catalog:
    - WorldFoundry registers an in-tree runtime manifest pipeline for the vendored Open-Oasis source.
    - A model-specific WorldFoundry pipeline is registered against the independent in-tree Open-Oasis source package; real upstream inference remains checkpoint/environment gated.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: an initial image or context frames plus streaming interaction inputs.
    - Action space: Minecraft-style keyboard/mouse actions drive frame-by-frame world evolution.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `oasis-500m`，运行时配置为 `runtime-profile:oasis-500m`。
    目录集成状态：运行时已移植（runtime_ported）。
    目录中记录的集成备注（保留原文）：
    - WorldFoundry registers an in-tree runtime manifest pipeline for the vendored Open-Oasis source.
    - A model-specific WorldFoundry pipeline is registered against the independent in-tree Open-Oasis source package; real upstream inference remains checkpoint/environment gated.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：初始图像或上下文帧，加流式交互输入。
    - 动作空间：Minecraft 式键鼠动作驱动逐帧世界演化。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
  limitations: |
