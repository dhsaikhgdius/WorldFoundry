docs:
  overview: |
    WorldCam (cvlab-kaist/WorldCam, code-only release) is the KAIST / Adobe Research / MAUM AI interactive world model with camera-pose control for long-horizon game video. WorldCam runtime code is in-tree and the wrapper supports load_model=False planning without external checkout dependency; the WorldFoundry runner supports the official-style conditioning-video demo in the unified environment profile with local WorldCam/Wan assets, and both integration and runner status are verified.

    Within the WorldFoundry model catalog this entry is tracked as `worldcam` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/cvlab-kaist/WorldCam.
  overview_zh: |
    WorldCam（cvlab-kaist/WorldCam，仅发布代码）是 KAIST / Adobe Research / MAUM AI 联合的交互式世界模型，面向长时程游戏视频的相机位姿控制。WorldCam 运行时代码已在树内，包装器支持 load_model=False 规划、无需外部 checkout 依赖；WorldFoundry runner 在统一环境配置中以本地 WorldCam/Wan 资产支持官方风格的条件视频演示，集成与 runner 状态均为已验证。

    在 WorldFoundry 模型目录中，该条目以 `worldcam` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/cvlab-kaist/WorldCam。
  architecture: |
    The recorded stack pairs WorldCam runtime code with local Wan-family assets, and the recorded demo contract is conditioning-video based: a context video plus camera-pose control drives long-horizon interactive generation. Recorded modalities are interactive-world-model, camera-pose-control, game-video, and long-horizon; further architecture details (parameter count, training data) are not recorded in the repository.
  architecture_zh: |
    记录的栈由 WorldCam 运行时代码与本地 Wan 系资产组成，记录的演示契约基于条件视频：上下文视频加相机位姿控制驱动长时程交互生成。记录模态为 interactive-world-model、camera-pose-control、game-video 与 long-horizon；更多架构细节（参数量、训练数据）仓库未记录。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `worldcam` and runtime profile `runtime-profile:worldcam`.
    Catalog integration status: `verified`.
    Integration notes recorded in the catalog:
    - WorldCam runtime code is in-tree and the wrapper now supports load_model=False planning without external checkout dependency.
    - The WorldFoundry runner supports the official-style conditioning-video demo in the unified environment profile.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: a conditioning video (context clip) plus a camera-pose control sequence.
    - Action space: the action channel is the camera trajectory (extrinsics/pose sequence); the model renders the world consistently along the requested path.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `worldcam`，运行时配置为 `runtime-profile:worldcam`。
    目录集成状态：已验证（verified）。
    目录中记录的集成备注（保留原文）：
    - WorldCam runtime code is in-tree and the wrapper now supports load_model=False planning without external checkout dependency.
    - The WorldFoundry runner supports the official-style conditioning-video demo in the unified environment profile.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：条件视频（上下文片段）加相机位姿控制序列。
    - 动作空间：动作通道为相机轨迹（外参/位姿序列）；模型沿请求路径一致地渲染世界。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`verified`.
    Runner parity notes recorded in the catalog:
    - The in-tree WorldCam runner supports the official-style conditioning-video path and local WorldCam/Wan assets.
    - Per-run artifact checks are tracked outside the model catalog.

    This documentation only restates metadata already recorded in the catalog; it claims no GPU execution evidence beyond the parity fields above.
  limitations_zh: |
    本目录文件记录的一致性字段：runner_parity=已验证（verified）。
