docs:
  overview: |
    DualCamCtrl (EnVision-Research/DualCamCtrl; Hugging Face `FayeHongfeiZhang/DualCamCtrl`) is a camera-controlled image-to-video diffusion model that additionally conditions on depth, following an RGB/depth/camera demo contract. WorldFoundry integrates the runtime in tree with default HF/local cache checkpoint loading; the official seaside demo is recorded as demo-verified through the Workspace job route (61 frames at 320x480, 50 steps, cfg 5.0, tiled, with control latents returned).

    Within the WorldFoundry model catalog this entry is tracked as `dualcamctrl` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/EnVision-Research/DualCamCtrl; Hugging Face `FayeHongfeiZhang/DualCamCtrl`.
  overview_zh: |
    DualCamCtrl（EnVision-Research/DualCamCtrl；Hugging Face `FayeHongfeiZhang/DualCamCtrl`）是相机控制的图像到视频扩散模型，额外以深度为条件，遵循 RGB/深度/相机演示契约。WorldFoundry 在树内集成运行时，权重采用默认 HF/本地缓存加载；官方 seaside 演示记录为经 Workspace 作业路径的演示验证（61 帧 320x480、50 步、cfg 5.0、tiled、返回控制隐变量）。

    在 WorldFoundry 模型目录中，该条目以 `dualcamctrl` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/EnVision-Research/DualCamCtrl；Hugging Face `FayeHongfeiZhang/DualCamCtrl`。
  architecture: |
    Per the recorded contract, the model is a dual-branch controllable video diffusion: an RGB generation stream plus a geometry (depth) control stream jointly conditioned on camera poses, in the modern camera-control video-diffusion lineage. Upstream license is recorded as unknown; further architecture details are not recorded in the repository.
  architecture_zh: |
    按记录契约，该模型是双分支可控视频扩散：RGB 生成流与几何（深度）控制流共同以相机位姿为条件，属于现代相机控制视频扩散谱系。上游许可证记录为 unknown；更多架构细节仓库未记录。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `dualcamctrl` and runtime profile `runtime-profile:dualcamctrl`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - Runtime code is integrated in-tree; checkpoints use the default Hugging Face/local cache loading path.
    - The WorldFoundry runner follows the official RGB/depth/camera demo contract.
    Recorded official demo command: `python -m worldfoundry.studio.workspace_job infer --model-id dualcamctrl --call-json {"demo_name":"seaside","num_frames":61,"height":320,"width":480,"num_inference_steps":50,"fps":10,"seed":42,"cfg_scale":5.0,"original_height":360,"original_width":640,"tiled":true,"return_control_latents":true}`.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: an initial RGB image, a depth control sequence, and a camera trajectory, per the official seaside demo contract.
    - Action space: the action channel is the camera trajectory (extrinsics/pose sequence); the model renders the world consistently along the requested path.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `dualcamctrl`，运行时配置为 `runtime-profile:dualcamctrl`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - Runtime code is integrated in-tree; checkpoints use the default Hugging Face/local cache loading path.
    - The WorldFoundry runner follows the official RGB/depth/camera demo contract.
    目录记录的官方演示命令：`python -m worldfoundry.studio.workspace_job infer --model-id dualcamctrl --call-json {"demo_name":"seaside","num_frames":61,"height":320,"width":480,"num_inference_steps":50,"fps":10,"seed":42,"cfg_scale":5.0,"original_height":360,"original_width":640,"tiled":true,"return_control_latents":true}`。

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：初始 RGB 图像、深度控制序列与相机轨迹（按官方 seaside 演示契约）。
    - 动作空间：动作通道为相机轨迹（外参/位姿序列）；模型沿请求路径一致地渲染世界。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
