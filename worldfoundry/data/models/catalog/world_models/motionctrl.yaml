docs:
  overview: |
    MotionCtrl (TencentARC/MotionCtrl, Apache-2.0; Hugging Face `TencentARC/MotionCtrl` and `TencentARC/MotionCtrl_SVD`, SIGGRAPH 2024) is the unified, flexible motion controller for video generation that controls camera motion and object motion independently: a camera motion control module conditions on pose sequences while an object motion control module conditions on point trajectories. WorldFoundry provides an in-tree synthesis backend under `worldfoundry/synthesis/visual_generation/motionctrl/motionctrl_runtime`; the camera-motion demo is verified through the Workspace infer path with the staged checkpoint and in-tree camera-pose fixture, with default camera/object motion fixture parameters represented in the runtime profile.

    Within the WorldFoundry model catalog this entry is tracked as `motionctrl` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/TencentARC/MotionCtrl; Hugging Face `TencentARC/MotionCtrl`, `TencentARC/MotionCtrl_SVD`.
  overview_zh: |
    MotionCtrl（TencentARC/MotionCtrl，Apache-2.0；Hugging Face `TencentARC/MotionCtrl` 与 `TencentARC/MotionCtrl_SVD`，SIGGRAPH 2024）是统一、灵活的视频生成运动控制器，独立控制相机运动与物体运动：相机运动控制模块以位姿序列为条件，物体运动控制模块以点轨迹为条件。WorldFoundry 在 `worldfoundry/synthesis/visual_generation/motionctrl/motionctrl_runtime` 提供树内合成后端；相机运动演示已通过 Workspace 推理路径以暂存权重与树内相机位姿 fixture 验证，默认相机/物体运动 fixture 参数记录在运行时配置中。

    在 WorldFoundry 模型目录中，该条目以 `motionctrl` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/TencentARC/MotionCtrl；Hugging Face `TencentARC/MotionCtrl`、`TencentARC/MotionCtrl_SVD`。
  architecture: |
    The published architecture appends two adaptors to a base video diffusion model (VideoCrafter/LVDM for T2V, SVD for I2V): the camera module injects RT-matrix pose sequences into temporal attention, and the object module injects point trajectories into convolutional layers; both are trained separately with the base frozen, allowing independent or joint control.
  architecture_zh: |
    公开架构在基座视频扩散模型（T2V 用 VideoCrafter/LVDM，I2V 用 SVD）上追加两个适配器：相机模块把 RT 矩阵位姿序列注入时间注意力，物体模块把点轨迹注入卷积层；两者在基座冻结下分别训练，可独立或联合控制。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `motionctrl` and runtime profile `runtime-profile:motionctrl`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - Runtime code is vendored in-tree; checkpoints remain external assets under the normal hfd/ckpt cache.
    - The WorldFoundry runner supports the in-tree MotionCtrl runtime in the unified environment profile.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: an initial image (and optionally a text prompt) plus a camera trajectory / pose sequence as the control signal.
    - Action space: camera pose sequences (RT matrices) and/or object point trajectories act as independent control channels.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `motionctrl`，运行时配置为 `runtime-profile:motionctrl`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - Runtime code is vendored in-tree; checkpoints remain external assets under the normal hfd/ckpt cache.
    - The WorldFoundry runner supports the in-tree MotionCtrl runtime in the unified environment profile.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：初始图像（可选文本提示）加相机轨迹/位姿序列作为控制信号。
    - 动作空间：相机位姿序列（RT 矩阵）与/或物体点轨迹作为独立控制通道。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`verified`.
    Runner parity notes recorded in the catalog:
