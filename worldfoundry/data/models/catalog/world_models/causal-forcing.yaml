docs:
  overview: |
    Causal-Forcing (thu-ml/Causal-Forcing; Hugging Face `zhuhz22/Causal-Forcing`) is THU-ML's autoregressive video diffusion work in the Forcing lineage: it distills a bidirectional Wan teacher into a causal student so text/image-to-video generation can run in real time with chunk-wise (or frame-wise) causal decoding. WorldFoundry vendors the official infer-only runtime under `worldfoundry/synthesis/visual_generation/forcing/causal_forcing_runtime`, owning prompt/i2v data materialization, Wan weight symlinks, command construction, and output loading; the chunk-wise checkpoint is staged locally, with config/checkpoint overrides for frame-wise or Causal-Forcing++ variants.

    Within the WorldFoundry model catalog this entry is tracked as `causal-forcing` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/thu-ml/Causal-Forcing; Hugging Face `zhuhz22/Causal-Forcing`.
  overview_zh: |
    Causal-Forcing（thu-ml/Causal-Forcing；Hugging Face `zhuhz22/Causal-Forcing`）是清华 THU-ML 在 Forcing 谱系的自回归视频扩散工作：把双向 Wan 教师蒸馏为因果学生，使文本/图像到视频生成能以块级（或帧级）因果解码实时运行。WorldFoundry 在 `worldfoundry/synthesis/visual_generation/forcing/causal_forcing_runtime` 内嵌官方仅推理运行时，负责 prompt/i2v 数据物化、Wan 权重软链、命令构建与输出加载；本地已暂存块级权重，帧级或 Causal-Forcing++ 变体可通过 config_path/checkpoint_path 覆盖。

    在 WorldFoundry 模型目录中，该条目以 `causal-forcing` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/thu-ml/Causal-Forcing；Hugging Face `zhuhz22/Causal-Forcing`。
  architecture: |
    The approach converts a bidirectional Wan video diffusion transformer into a causal, few-step autoregressive generator via distillation ('forcing'), maintaining a KV cache over previously generated chunks so new chunks extend the video without re-denoising history. The vendored path executes the official inference.py; full parity requires local Wan2.1 weights plus the selected Causal-Forcing checkpoint/config pair.
  architecture_zh: |
    该方法通过蒸馏（forcing）把双向 Wan 视频扩散 transformer 转为因果、少步数的自回归生成器，对已生成块维护 KV 缓存，使新块在不重新去噪历史的情况下延展视频。内嵌路径执行官方 inference.py；完整一致性需本地 Wan2.1 权重与所选 Causal-Forcing 权重/配置对。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `causal-forcing` and runtime profile `runtime-profile:causal-forcing`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - WorldFoundry vendors the official infer-only Causal-Forcing runtime under worldfoundry/synthesis/visual_generation/forcing/causal_forcing_runtime; the runner owns prompt/i2v data materialization, Wan weight symlinks, command construction, output loading, and pipeline/catalog exposure in-tree.
    - The local workspace currently has the chunk-wise checkpoint staged under ${WORLDFOUNDRY_CKPT_DIR}/Causal-Forcing. Override config_path/checkpoint_path for frame-wise or Causal-Forcing++ variants.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: conditioning inputs per the recorded modalities (typically an initial image and/or a text prompt); exact tensor contracts are not recorded in this catalog file.
    - Action space: no explicit action interface is recorded for this entry; controllability is limited to the conditioning inputs.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `causal-forcing`，运行时配置为 `runtime-profile:causal-forcing`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - WorldFoundry vendors the official infer-only Causal-Forcing runtime under worldfoundry/synthesis/visual_generation/forcing/causal_forcing_runtime; the runner owns prompt/i2v data materialization, Wan weight symlinks, command construction, output loading, and pipeline/catalog exposure in-tree.
    - The local workspace currently has the chunk-wise checkpoint staged under ${WORLDFOUNDRY_CKPT_DIR}/Causal-Forcing. Override config_path/checkpoint_path for frame-wise or Causal-Forcing++ variants.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：按记录的模态提供条件输入（通常为初始图像和/或文本提示）；具体张量契约本目录文件未记录。
    - 动作空间：该条目未记录显式动作接口；可控性仅限于条件输入。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
