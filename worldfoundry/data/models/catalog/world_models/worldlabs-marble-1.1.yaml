docs:
  overview: |
    World Labs Marble 1.1 is the hosted 3D world generation service from World Labs (the spatial-intelligence company founded by Fei-Fei Li), exposed in WorldFoundry through the existing in-tree WorldLabs API pipeline with the marble-1.1 model id: recorded modalities are world-generation, 3d-world-generation, and api-world-model. The entry is an API surface — no weights or source are recorded — and integration status is planned with runner parity pending.

    Within the WorldFoundry model catalog this entry is tracked as `worldlabs-marble-1.1` in the `world_models` category.
    The repository does not record an official source link for this entry.
