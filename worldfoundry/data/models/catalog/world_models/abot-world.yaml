docs:
  overview: |
    ABot-World-0-5B-LF (amap-cvlab/ABot-World) is AMAP CV Lab's interactive world video model: an image-to-world-video generator whose future frames are conditioned on interaction, released with public code and the `acvlab/ABot-World-0-5B-LF` checkpoint. WorldFoundry integrates only causal inference and resident interactive rollout, reusing the in-tree Wan attention, T5 encoder, Wan2.2 VAE, scheduler, media I/O, and FP8 support. Real A100 inference produced a fully decodable 1280x704 nine-frame H.264 artifact.

    Within the WorldFoundry model catalog this entry is tracked as `abot-world-0-5b-lf` in the `world_models` category.
    Recorded availability: status=source_and_weights_available, code=public, weights=public_huggingface.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/amap-cvlab/ABot-World; Hugging Face `acvlab/ABot-World-0-5B-LF`.
  overview_zh: |
    ABot-World-0-5B-LF（amap-cvlab/ABot-World）是高德 CV Lab 的交互式世界视频模型：图像到世界视频生成器，未来帧以交互为条件，公开代码并发布 `acvlab/ABot-World-0-5B-LF` 权重。WorldFoundry 仅集成因果推理与常驻交互 rollout，复用树内 Wan 注意力、T5 编码器、Wan2.2 VAE、调度器、媒体 I/O 与 FP8 支持。真实 A100 推理产出可完整解码的 1280x704 九帧 H.264 artifact。

    在 WorldFoundry 模型目录中，该条目以 `abot-world-0-5b-lf` 收录于 `world_models` 分类。
    仓库记录的可用性：状态=source_and_weights_available，代码=public，权重=public_huggingface。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/amap-cvlab/ABot-World；Hugging Face `acvlab/ABot-World-0-5B-LF`。
  architecture: |
    Per the integration notes, the model is a causal (autoregressive) world video generator in the Wan lineage, built from Wan attention blocks, a T5 text encoder, and the Wan2.2 VAE, sized at about 0.5B parameters per its name. Training, Gradio, benchmark, Helios, and experimental quantizer sources are excluded from the in-tree runtime; further architecture details are not recorded in the repository.
  architecture_zh: |
    按集成备注，该模型是 Wan 谱系的因果（自回归）世界视频生成器，由 Wan 注意力块、T5 文本编码器与 Wan2.2 VAE 组成，按命名约为 5 亿参数。训练、Gradio、benchmark、Helios 与实验性量化器源码被排除在树内运行时之外；更多架构细节仓库未记录。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `abot-world-0-5b-lf` and runtime profile `runtime-profile:abot-world-0-5b-lf`.
    Catalog integration status: `checkpoint_gpu_validated`.
    Integration notes recorded in the catalog:
    - Only causal inference and resident interactive rollout are integrated.
    - Wan attention, T5, Wan2.2 VAE, scheduler, media I/O and FP8 support are reused in-tree.
    - Training, Gradio, benchmark, Helios and experimental quantizer sources are excluded.
    - Real A100 Workspace inference produced a fully decodable 1280x704 nine-frame H.264 artifact.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: an initial image or context frames plus streaming interaction inputs.
    - Action space: keyboard/mouse-style or discrete navigation actions (plus optional camera controls) drive frame-by-frame world evolution.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `abot-world-0-5b-lf`，运行时配置为 `runtime-profile:abot-world-0-5b-lf`。
    目录集成状态：`checkpoint_gpu_validated`。
    目录中记录的集成备注（保留原文）：
    - Only causal inference and resident interactive rollout are integrated.
    - Wan attention, T5, Wan2.2 VAE, scheduler, media I/O and FP8 support are reused in-tree.
    - Training, Gradio, benchmark, Helios and experimental quantizer sources are excluded.
    - Real A100 Workspace inference produced a fully decodable 1280x704 nine-frame H.264 artifact.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：初始图像或上下文帧，加流式交互输入。
    - 动作空间：键鼠式或离散导航动作（可选相机控制）驱动逐帧世界演化。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
