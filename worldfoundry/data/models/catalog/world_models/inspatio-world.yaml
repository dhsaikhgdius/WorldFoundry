docs:
  overview: |
    InSpatio-World (inspatio/inspatio-world; Hugging Face `inspatio/world`) is InSpatio's video-conditioned world generation model: given input video and a target trajectory it synthesizes trajectory-conditioned video / novel views of the scene. The in-tree pipeline is integration-verified: it generated and visually validated a 297-frame video through Workspace on 2026-07-10.

    Within the WorldFoundry model catalog this entry is tracked as `inspatio-world` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/inspatio/inspatio-world; Hugging Face `inspatio/world`.
  overview_zh: |
    InSpatio-World（inspatio/inspatio-world；Hugging Face `inspatio/world`）是 InSpatio 的视频条件世界生成模型：给定输入视频与目标轨迹，合成轨迹条件视频/场景新视角。树内管线已验证集成：2026-07-10 通过 Workspace 生成并视觉验证了 297 帧视频。

    在 WorldFoundry 模型目录中，该条目以 `inspatio-world` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/inspatio/inspatio-world；Hugging Face `inspatio/world`。
  architecture: |
    Recorded modalities are video-conditioned-world-generation, trajectory-conditioned-video, and novel-view-synthesis. Beyond these modalities and the verified 297-frame Workspace run, the repository does not record architecture details (backbone, parameter count, training data) for this entry.
  architecture_zh: |
    记录模态为 video-conditioned-world-generation、trajectory-conditioned-video 与 novel-view-synthesis。除这些模态与已验证的 297 帧 Workspace 运行外，仓库未记录该条目的架构细节（骨干、参数量、训练数据等）。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `inspatio-world` and runtime profile `runtime-profile:inspatio-world`.
    Catalog integration status: `verified`.
    Integration notes recorded in the catalog:
    - The in-tree InSpatio-World pipeline generated and visually validated a 297-frame video through Workspace on 2026-07-10.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: an input video of a scene plus a target camera/motion trajectory.
    - Action space: the action channel is the camera trajectory (extrinsics/pose sequence); the model renders the world consistently along the requested path.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `inspatio-world`，运行时配置为 `runtime-profile:inspatio-world`。
    目录集成状态：已验证（verified）。
    目录中记录的集成备注（保留原文）：
    - The in-tree InSpatio-World pipeline generated and visually validated a 297-frame video through Workspace on 2026-07-10.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：场景输入视频加目标相机/运动轨迹。
    - 动作空间：动作通道为相机轨迹（外参/位姿序列）；模型沿请求路径一致地渲染世界。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`verified`.

    This documentation only restates metadata already recorded in the catalog; it claims no GPU execution evidence beyond the parity fields above.
  limitations_zh: |
    本目录文件记录的一致性字段：runner_parity=已验证（verified）。

