docs:
  publisher: Snap Inc. (Snap Research)
  publisher_kind: company
  publisher_zh: Snap 公司（Snap Research）
  overview: 'AC3D analyzes and improves camera control in video diffusion: it is a ControlNet-style plugin that gives CogVideoX precise 3D camera control. In this catalog the runner is verified — the RealEstate10K camera-control demo runs through the Workspace infer path with local CogVideoX-2B and AC3D ControlNet weights, preserving the official inference/cli_demo_camera.py generation path.'
  overview_zh: AC3D 分析并改进视频扩散中的相机控制：它是 ControlNet 风格的插件，为 CogVideoX 提供精确的 3D 相机控制。本 catalog 中 runner 已验证——RealEstate10K 相机控制 demo 通过 Workspace 推理路径运行，使用本地 CogVideoX-2B 与 AC3D ControlNet 权重，并保留官方 inference/cli_demo_camera.py 生成路径。
  architecture: Per the paper (arXiv 2411.18673), AC3D locates camera-motion information in low-frequency early-timestep components and conditions only a subset of layers, improving control precision and visual quality. Both 2B and 5B ControlNet checkpoints are recorded; the adapter preserves official 2B ControlNet shape settings.
  architecture_zh: 按论文（arXiv 2411.18673），AC3D 发现相机运动信息集中在低频、早期时间步分量，因此仅对部分层做条件注入，同时提升控制精度与画质。catalog 记录 2B 与 5B 两个 ControlNet checkpoint；适配器保留官方 2B ControlNet 形状设置。
  usage_notes: AC3D stays in its dedicated environment because the official torch 2.4/CUDA 12.4 stack is not ABI-compatible with the unified environment. Inputs accept either a RealEstate10K-style root or a direct source video plus 19-column camera pose rows.
  usage_notes_zh: AC3D 保留在专属环境中，因为官方 torch 2.4/CUDA 12.4 栈与统一环境的 ABI 不兼容。输入接受 RealEstate10K 风格的数据根目录，或「源视频 + 19 列相机位姿行」的直接输入。
  limitations:
  - Dedicated environment required (torch 2.4/CUDA 12.4); not part of the unified profile.
  - Camera-pose input follows the RealEstate10K 19-column convention — other formats need conversion.
  limitations_zh:
  - 需要专属环境（torch 2.4/CUDA 12.4），不在统一环境档案内。
  - 相机位姿输入遵循 RealEstate10K 的 19 列约定——其它格式需先转换。
  recommended_benchmarks:
  - id: camerabench
    reason: Directly measures camera-control precision in generated video.
    reason_zh: 直接衡量生成视频中的相机控制精度。
