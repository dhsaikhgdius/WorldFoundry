docs:
  overview: |
    WildDet3D (allenai/WildDet3D; Hugging Face `allenai/WildDet3D`) is an Allen Institute for AI 3D detection model tracked in the world_models catalog for world understanding: recorded modalities are 3d-detection, wild-3d-perception, and world-understanding, i.e. it is a perception model that infers 3D structure from in-the-wild imagery rather than a generative world model. WorldFoundry registers the official inference route; detector assets are runtime-gated, so real inference emits a runtime plan until they are staged.

    Within the WorldFoundry model catalog this entry is tracked as `wilddet3d` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/allenai/WildDet3D; Hugging Face `allenai/WildDet3D`.
  overview_zh: |
    WildDet3D（allenai/WildDet3D；Hugging Face `allenai/WildDet3D`）是 Allen AI 的 3D 检测模型，因面向世界理解而收录于 world_models 目录：记录模态为 3d-detection、wild-3d-perception 与 world-understanding，即它是从真实场景图像推断 3D 结构的感知模型，而非生成式世界模型。WorldFoundry 注册官方推理路线；检测器资产受运行时门控，在暂存之前真实推理输出运行时计划。

    在 WorldFoundry 模型目录中，该条目以 `wilddet3d` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/allenai/WildDet3D；Hugging Face `allenai/WildDet3D`。
  architecture: |
    Beyond the modality tags (open-world 3D detection from in-the-wild images) and the registered inference route, the repository does not record architecture details (backbone, detection head design, training data) for this entry.
  architecture_zh: |
    除模态标签（面向真实场景图像的开放世界 3D 检测）与已注册推理路线外，仓库未记录该条目的架构细节（骨干、检测头设计、训练数据）。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `wilddet3d` and runtime profile `runtime-profile:wilddet3d`.
    Catalog integration status: `runtime_ported`.
    Integration notes recorded in the catalog:
    - WildDet3D official inference route is registered; detector assets are runtime-gated.

    Embodiment contract:
    - Simulator: not a simulator or generator: this entry is a 3D perception model whose outputs are 3D detections, not generated world states.
    - Sensors: RGB images of in-the-wild scenes; the exact input contract is not recorded in this catalog file.
    - Action space: no action interface; the model performs perception, not control or rollout.
    - Dedicated environment: no dedicated environment; inference runs on user-provided imagery once detector assets are staged.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `wilddet3d`，运行时配置为 `runtime-profile:wilddet3d`。
    目录集成状态：运行时已移植（runtime_ported）。
    目录中记录的集成备注（保留原文）：
    - WildDet3D official inference route is registered; detector assets are runtime-gated.

    具身接口（embodiment contract）：
    - 仿真器：不是模拟器或生成器：该条目是 3D 感知模型，输出为 3D 检测结果而非生成的世界状态。
    - 传感器：真实场景的 RGB 图像；具体输入契约本目录文件未记录。
    - 动作空间：无动作接口；模型做感知，不做控制或 rollout。
    - 是否专用环境：无专用环境；检测器资产暂存后即可对用户提供的图像做推理。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`implemented_checkpoint_pending`.
    Runner parity notes recorded in the catalog:
