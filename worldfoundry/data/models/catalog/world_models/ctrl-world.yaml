docs:
  publisher: Tsinghua University / Stanford University
  publisher_kind: university
  publisher_zh: 清华大学 / 斯坦福大学
  overview: 'Ctrl-World is a controllable generative world model for robot manipulation: conditioned on robot actions, it predicts future observation video so policies can be evaluated or improved inside the model. In this catalog the official WorldArena-listed source is vendored in-tree; execution waits on the Ctrl-World, Stable Video Diffusion, and CLIP checkpoints plus task assets.'
  overview_zh: Ctrl-World 是面向机器人操作的可控生成式世界模型：以机器人动作为条件预测未来观测视频，使策略可以在模型内被评估或改进。本 catalog 中其官方（WorldArena 收录的）源码已内置树内；执行待 Ctrl-World、Stable Video Diffusion 与 CLIP checkpoint 及任务资产就位。
  architecture: 'The recorded checkpoints tell the design: a Stable Video Diffusion image-to-video backbone (stabilityai/stable-video-diffusion-img2vid) with CLIP conditioning (openai/clip-vit-base-patch32) and Ctrl-World''s own action-conditioning weights (yjguo/Ctrl-World). Internals beyond this are not recorded in this repository.'
  architecture_zh: 记录的 checkpoint 揭示其设计：Stable Video Diffusion 图生视频基座（stabilityai/stable-video-diffusion-img2vid）、CLIP 条件（openai/clip-vit-base-patch32），加上 Ctrl-World 自有的动作条件权重（yjguo/Ctrl-World）。除此之外的内部细节仓库未记录。
  usage_notes: The pipeline resolves the vendored rollout entrypoint and returns blocked runtime diagnostics until checkpoints and task assets are staged. Stage all three recorded checkpoint sets before submitting jobs.
  usage_notes_zh: pipeline 解析内置的滚动生成入口，在 checkpoint 与任务资产就位前返回 blocked 运行时诊断。提交任务前请就位全部三套记录的 checkpoint。
  limitations:
  - Execution is checkpoint and task-asset gated.
  - 'SVD-era backbone: visual fidelity trails newer DiT-based world models.'
  limitations_zh:
  - 执行受 checkpoint 与任务资产限制。
  - SVD 时代基座：视觉保真度弱于较新的 DiT 世界模型。
  recommended_benchmarks:
  - id: worldarena
    reason: The entry is listed on WorldArena for robot world-model evaluation.
    reason_zh: 该条目已收录于 WorldArena 的机器人世界模型评测。
