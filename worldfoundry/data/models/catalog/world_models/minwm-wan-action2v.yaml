docs:
  overview: |
    minWM Wan Action2V is the Wan2.1-backbone sibling of the minWM Action2V route, vendored in tree at the same revision df522a26cd4409d3e3e8f269cc98eac069b5df47: an action-to-video interactive world model with a DMD-distilled entrypoint and a native action-token route. The dedicated Wan2.1 Action2V DMD entrypoint is wired; runner validation is pending. No official GitHub or Hugging Face source links are recorded on this entry.

    Within the WorldFoundry model catalog this entry is tracked as `minwm-wan-action2v` in the `world_models` category.
    The repository does not record an official source link for this entry.
  overview_zh: |
    minWM Wan Action2V 是 minWM Action2V 路线的 Wan2.1 骨干姊妹版，以相同 revision df522a26cd4409d3e3e8f269cc98eac069b5df47 内嵌：动作到视频交互世界模型，带 DMD 蒸馏入口与原生动作 token 路线。专用 Wan2.1 Action2V DMD 入口已接通；runner 验证待完成。该条目未记录官方 GitHub 或 Hugging Face 来源链接。

    在 WorldFoundry 模型目录中，该条目以 `minwm-wan-action2v` 收录于 `world_models` 分类。
    仓库未记录该条目的官方来源链接。
  architecture: |
    Recorded modalities are interactive-world-model, action-conditioned-video, and camera-controlled-video over a Wan2.1 diffusion backbone with DMD few-step distillation and native action tokens. Further architecture details are not recorded in the repository.
  architecture_zh: |
    记录模态为 interactive-world-model、action-conditioned-video 与 camera-controlled-video，基于 Wan2.1 扩散骨干，采用 DMD 少步蒸馏与原生动作 token。更多架构细节仓库未记录。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `minwm-wan-action2v` and runtime profile `runtime-profile:minwm-wan-action2v`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - Official source is vendored at revision df522a26cd4409d3e3e8f269cc98eac069b5df47.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: an initial image or context frames plus streaming interaction inputs.
    - Action space: keyboard/mouse-style or discrete navigation actions (plus optional camera controls) drive frame-by-frame world evolution.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `minwm-wan-action2v`，运行时配置为 `runtime-profile:minwm-wan-action2v`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - Official source is vendored at revision df522a26cd4409d3e3e8f269cc98eac069b5df47.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：初始图像或上下文帧，加流式交互输入。
    - 动作空间：键鼠式或离散导航动作（可选相机控制）驱动逐帧世界演化。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
