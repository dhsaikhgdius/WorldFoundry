docs:
  overview: |
    DROID-W (MoyangLi00/DROID-W) is a robot world model route oriented around the DROID manipulation platform: its recorded modalities are robot-world-model, droid-evaluation, and video-generation. WorldFoundry registers the official source route with checkpoints/data runtime-gated; resolve_model_zoo_config and pipeline import are expected to pass, and real generation emits a runtime plan until required checkpoints and assets are staged.

    Within the WorldFoundry model catalog this entry is tracked as `droid-w` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/MoyangLi00/DROID-W.
  overview_zh: |
    DROID-W（MoyangLi00/DROID-W）是围绕 DROID 操作平台的机器人世界模型路线：记录模态为 robot-world-model、droid-evaluation 与 video-generation。WorldFoundry 注册官方源码路线，权重/数据受运行时门控；resolve_model_zoo_config 与管线导入预期通过，在暂存所需权重与资产之前，真实生成输出运行时计划。

    在 WorldFoundry 模型目录中，该条目以 `droid-w` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/MoyangLi00/DROID-W。
  architecture: |
    Beyond the recorded DROID-oriented world-model/evaluation route, the repository does not record architecture details (backbone, parameter count, training data) for this entry.
  architecture_zh: |
    除记录的面向 DROID 的世界模型/评测路线外，仓库未记录该条目的架构细节（骨干、参数量、训练数据等）。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `droid-w` and runtime profile `runtime-profile:droid-w`.
    Catalog integration status: `runtime_ported`.
    Integration notes recorded in the catalog:
    - DROID-W official source route is registered; checkpoints/data are runtime-gated.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: initial visual context of a robot scene (and optionally text) plus a robot action sequence as conditioning.
    - Action space: robot action trajectories are the conditioning channel: the model predicts the resulting future observations instead of emitting actions itself.
    - Dedicated environment: targets the robot-manipulation domains recorded per checkpoint; no simulator ships with this entry.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `droid-w`，运行时配置为 `runtime-profile:droid-w`。
    目录集成状态：运行时已移植（runtime_ported）。
    目录中记录的集成备注（保留原文）：
    - DROID-W official source route is registered; checkpoints/data are runtime-gated.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：机器人场景的初始视觉上下文（可选文本），加机器人动作序列作为条件。
    - 动作空间：机器人动作轨迹是条件通道：模型预测动作导致的未来观测，而不是自己输出动作。
    - 是否专用环境：面向各权重记录的机器人操作域；该条目不附带仿真器。
