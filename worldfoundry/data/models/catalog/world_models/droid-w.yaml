  overview_zh: DROID-W 是围绕 DROID 机器人操作数据生态的机器人世界模型：为 DROID 风格任务生成机器人视角视频用于评估。本 catalog 中官方源码路径已注册、源码固定在记录的 commit；checkpoint 与数据保持运行时限制。
  architecture: 'Architecture internals are not recorded in this repository (upstream: MoyangLi00/DROID-W, apache-2.0). The official source is bound from ${WORLDFOUNDRY_MODEL_SOURCE_DIR}/DROID-W at commit c3414af6.'
