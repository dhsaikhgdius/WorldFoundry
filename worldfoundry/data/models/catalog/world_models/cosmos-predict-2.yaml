integration:
  status: integrated
  notes:
  - Predict2 2B and 14B use the framework-owned denoiser, T5 conditioner, latent
    initializer, Rectified Flow AB2 scheduler, Wan codec, loader, and standard runner.
  - The Predict2 and Predict2.5 recipes share one checkpoint-shaped transformer
    implementation; only version-specific architecture and sampling values live in recipes.
  - No NVIDIA runtime package, Diffusers pipeline, or model-specific backend is invoked.
