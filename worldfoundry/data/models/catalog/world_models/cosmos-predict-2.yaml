docs:
  overview: |
    Cosmos Predict 2 (nvidia-cosmos/cosmos-predict2, NVIDIA Open Model License) is the second-generation NVIDIA Cosmos world foundation model, released as 2B and 14B Video2World checkpoints for image/video-to-world generation targeting Physical AI. WorldFoundry runs it through framework-owned components: denoiser, T5 conditioner, latent initializer, Rectified Flow AB2 scheduler, Wan codec, loader, and the standard runner; the Predict2 and Predict2.5 recipes share one checkpoint-shaped transformer implementation, with only version-specific architecture and sampling values living in recipes. No NVIDIA runtime package or Diffusers pipeline is invoked.

    Within the WorldFoundry model catalog this entry is tracked as `cosmos-predict-2` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/nvidia-cosmos/cosmos-predict2; Hugging Face `nvidia/Cosmos-Predict2-2B-Video2World`, `nvidia/Cosmos-Predict2-14B-Video2World`.
  overview_zh: |
    Cosmos Predict 2（nvidia-cosmos/cosmos-predict2，NVIDIA 开放模型许可）是第二代 NVIDIA Cosmos 世界基础模型，发布 2B 与 14B Video2World 权重，面向 Physical AI 的图像/视频到世界生成。WorldFoundry 通过框架自有组件运行：去噪器、T5 条件器、隐变量初始化器、Rectified Flow AB2 调度器、Wan 编解码器、加载器与标准 runner；Predict2 与 Predict2.5 的 recipe 共享同一按权重形状实现的 transformer，版本差异仅存在于 recipe 的架构与采样值。不调用 NVIDIA 运行时包或 Diffusers 管线。

    在 WorldFoundry 模型目录中，该条目以 `cosmos-predict-2` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/nvidia-cosmos/cosmos-predict2；Hugging Face `nvidia/Cosmos-Predict2-2B-Video2World`、`nvidia/Cosmos-Predict2-14B-Video2World`。
  architecture: |
    The published architecture is a rectified-flow video diffusion transformer with T5 text conditioning and the Wan VAE codec, trained for video-to-world prediction (conditioning on an image or short clip to roll out future world video). Registry, component contracts, architecture construction, conditioning masks, and AB2 scheduler numerics are validated locally; gated checkpoint access and GPU parity are separate.
  architecture_zh: |
    公开架构为 rectified-flow 视频扩散 transformer，T5 文本条件与 Wan VAE 编解码器，为视频到世界预测训练（以图像或短片段为条件滚动生成未来世界视频）。注册表、组件契约、架构构建、条件掩码与 AB2 调度器数值已在本地验证；受限权重访问与 GPU 一致性为独立事项。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `cosmos-predict-2` and runtime profile `runtime-profile:cosmos-predict2-2b-video2world`.
    Catalog integration status: `integrated`.
    Integration notes recorded in the catalog:
    - Predict2 2B and 14B use the framework-owned denoiser, T5 conditioner, latent initializer, Rectified Flow AB2 scheduler, Wan codec, loader, and standard runner.
    - The Predict2 and Predict2.5 recipes share one checkpoint-shaped transformer implementation; only version-specific architecture and sampling values live in recipes.
    - No NVIDIA runtime package, Diffusers pipeline, or model-specific backend is invoked.
    Recorded variant `cosmos-predict2-2b-video2world`, task `image/video-to-world`, runner parity `pending`, demo parity `not_recorded`.
    Recorded variant `cosmos-predict2-14b-video2world`, task `image/video-to-world`, runner parity `pending`, demo parity `not_recorded`.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: conditioning inputs per the recorded modalities (typically an initial image and/or a text prompt); exact tensor contracts are not recorded in this catalog file.
    - Action space: no explicit action interface is recorded for this entry; controllability is limited to the conditioning inputs.
    - Dedicated environment: not tied to a dedicated external environment; outputs are generated video artifacts consumed by downstream evaluation.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `cosmos-predict-2`，运行时配置为 `runtime-profile:cosmos-predict2-2b-video2world`。
    目录集成状态：已集成（integrated）。
    目录中记录的集成备注（保留原文）：
    - Predict2 2B and 14B use the framework-owned denoiser, T5 conditioner, latent initializer, Rectified Flow AB2 scheduler, Wan codec, loader, and standard runner.
    - The Predict2 and Predict2.5 recipes share one checkpoint-shaped transformer implementation; only version-specific architecture and sampling values live in recipes.
    - No NVIDIA runtime package, Diffusers pipeline, or model-specific backend is invoked.
    目录记录：变体 `cosmos-predict2-2b-video2world`，任务 `image/video-to-world`，runner 一致性 待验证（pending），演示一致性 `not_recorded`。
    目录记录：变体 `cosmos-predict2-14b-video2world`，任务 `image/video-to-world`，runner 一致性 待验证（pending），演示一致性 `not_recorded`。

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：按记录的模态提供条件输入（通常为初始图像和/或文本提示）；具体张量契约本目录文件未记录。
    - 动作空间：该条目未记录显式动作接口；可控性仅限于条件输入。
    - 是否专用环境：不绑定专用外部环境；输出为供下游评测使用的生成视频 artifact。
  limitations: |
