variants:
- availability: open_source
  checkpoint: robbyant/lingbot-world-base-cam
  name: LingBot-World-Base (Cam)
  runner_parity:
    status: verified
    notes:
    - The base-cam checkpoint is wired through the in-tree LingBot-World runner.
    - A 2026-07-28 checkpoint-backed full run completed with 161 frames and 70
      denoising steps; all frames decoded at 832x464 and 16 FPS with valid motion.
    - A four-A100 Workspace run also completed the same full setting with
      adaptive T5-FSDP, replicated/offloaded DiTs, and Ulysses size 4.
- availability: open_source
  checkpoint: robbyant/lingbot-world-base-act-preview
  name: LingBot-World-Base (Act)
  pipeline_binding: lingbot-world-act
  runtime_profile: runtime-profile:lingbot-world-act
  runner_parity:
    status: pending
    notes:
    - The public Base-Act preview checkpoint is independently routed through the in-tree action-conditioned runtime.
    - Full GPU artifact parity requires locally staged weights.
- availability: unknown
  name: LingBot-World-Fast
  reason: No official public checkpoint was confirmed in this audit.
runner_parity:
  notes:
  - LingBotPipeline is registered against the in-tree LingBot world runtime.
  - The base-cam checkpoint is wired through the Studio/API route and dedicated conda environment profile.
  - Base-Act is independently cataloged against the public preview checkpoint; only the Fast checkpoint remains unavailable.
  - Base-cam full-quality artifact validation completed on 2026-07-28 using the
    official 161-frame, 70-step camera-control demo settings.
  - The shared timestep embedding preserves floating precision for integer
    scheduler timesteps, preventing distributed sequence-parallel output corruption.
  status: verified
catalog_category: world_models
catalog_scope: world-model/interactive starred models
catalog_policy:
  checkpoint_rule: Only list checkpoints that were confirmed on official Hugging Face model pages. Do not download weights.
  integration_rule: Closed, API-only, or unknown releases stay blocked or planned until an official integration surface is
    available.
  open_source_rule: Only mark open_source when an official GitHub repository or official Hugging Face model page was confirmed.
    Do not infer checkpoint availability from papers, demos, or third-party mirrors.
docs:
  publisher: Robbyant (Ant Group)
  publisher_kind: company
  publisher_zh: 蚂蚁灵波科技（Robbyant，蚂蚁集团）
  overview: 'LingBot-World is Robbyant''s camera-controlled world video model. In this catalog it is fully verified: the base-cam checkpoint completed full-quality artifact validation on 2026-07-28 using the official 161-frame, 70-step camera-control demo — including a four-A100 compact topology that adapted FSDP/Ulysses settings and produced a coherent artifact.'
  overview_zh: LingBot-World 是蚂蚁灵波的相机可控世界视频模型。本 catalog 中它已完整验证：base-cam checkpoint 于 2026-07-28 按官方 161 帧、70 步相机控制 demo 完成全质量产物验证——包括一个四张 A100 的紧凑拓扑，自适应调整 FSDP/Ulysses 设置并产出连贯产物。
  architecture: The official base-cam recipe uses eight GPUs with DiT/T5 FSDP plus Ulysses sequence parallelism; Workspace also supports a four-GPU compact topology (both 4 and 8 divide the model's 40 attention heads). A shared timestep embedding preserves floating precision for integer scheduler timesteps, preventing distributed sequence-parallel output corruption.
  architecture_zh: 官方 base-cam 配方使用八卡，DiT/T5 FSDP 加 Ulysses 序列并行；Workspace 亦支持四卡紧凑拓扑（4 与 8 都能整除模型的 40 个注意力头）。共享的时间步嵌入为整数调度时间步保留浮点精度，避免分布式序列并行的输出损坏。
  usage_notes: The wrapper resolves only local HFD or explicit checkpoint directories — no runtime downloads. Base-cam runs in the dedicated lingbot-world conda environment profile; Base-Act is separately cataloged, and only the Fast checkpoint remains unavailable.
  usage_notes_zh: 封装仅解析本地 HFD 或显式 checkpoint 目录——无运行时下载。base-cam 在专属 lingbot-world conda 环境档案中运行；Base-Act 单独记录，目前仅 Fast checkpoint 不可得。
  limitations:
  - Dedicated conda environment for base-cam inference.
  - Practical inference needs 4-8 A100-class GPUs.
  limitations_zh:
  - base-cam 推理需要专属 conda 环境。
  - 实际推理需要 4-8 张 A100 级 GPU。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera-control adherence of world rollouts.
    reason_zh: 世界滚动生成的相机控制贴合度。
  - id: worldmodelbench
    reason: General world-rollout quality.
    reason_zh: 世界滚动生成的总体质量。
