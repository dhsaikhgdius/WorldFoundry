docs:
  overview: |
    StarWM (yxzzhang/StarWM; Hugging Face `yxzhang2024/StarWM`) is a StarCraft world model: recorded modalities are multi-agent-world-model, starcraft-world-model, and action-conditioned-video. WorldFoundry exposes the official offline inference client in-tree under synthesis/visual_generation/world_model/starwm/offline_infer; jobs use StarWM's OpenAI-compatible endpoint parameters plus the official prompt fixture format, and the route builds the official run_inference_client.py command with input_file/mode/served_model_id validation before execution.

    Within the WorldFoundry model catalog this entry is tracked as `starwm` in the `world_models` category.
    Official sources recorded in this catalog file: official GitHub repository https://github.com/yxzzhang/StarWM; Hugging Face `yxzhang2024/StarWM`.
  overview_zh: |
    StarWM（yxzzhang/StarWM；Hugging Face `yxzhang2024/StarWM`）是星际争霸世界模型：记录模态为 multi-agent-world-model、starcraft-world-model 与 action-conditioned-video。WorldFoundry 在 synthesis/visual_generation/world_model/starwm/offline_infer 树内暴露官方离线推理客户端；作业使用 StarWM 的 OpenAI 兼容端点参数与官方 prompt fixture 格式，路线在执行前构建官方 run_inference_client.py 命令并校验 input_file、mode 与 served_model_id/api_model_id。

    在 WorldFoundry 模型目录中，该条目以 `starwm` 收录于 `world_models` 分类。
    本目录文件记录的官方来源：官方 GitHub 仓库 https://github.com/yxzzhang/StarWM；Hugging Face `yxzhang2024/StarWM`。
  architecture: |
    The recorded serving contract is an OpenAI-compatible endpoint driven by prompt fixtures, i.e. the model is served rather than loaded in-process; generation is action-conditioned video in the StarCraft multi-agent domain. Beyond the serving contract and modality tags, the repository does not record architecture details (backbone, parameter count, action encoding) for this entry.
  architecture_zh: |
    记录的服务契约是由 prompt fixture 驱动的 OpenAI 兼容端点，即模型以服务形式提供而非进程内加载；生成为星际争霸多智能体域的动作条件视频。除服务契约与模态标签外，仓库未记录该条目的架构细节（骨干、参数量、动作编码）。
  usage_notes: |
    WorldFoundry wires this model through the runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` with pipeline binding `starwm` and runtime profile `runtime-profile:starwm`.
    Catalog integration status: `runtime_ported`.
    Integration notes recorded in the catalog:
    - WorldFoundry exposes the official offline inference client in-tree under synthesis/visual_generation/world_model/starwm/offline_infer.
    - Jobs use StarWM's OpenAI-compatible endpoint parameters plus the official prompt fixture format.

    Embodiment contract:
    - Simulator: the model itself is the learned world simulator: it generates future world states as video, so no external physics or game engine is required at inference time.
    - Sensors: an initial image or context frames plus streaming interaction inputs.
    - Action space: StarCraft-domain action conditioning delivered through the official prompt fixture format; the exact action encoding is not recorded in this catalog file.
    - Dedicated environment: requires a running OpenAI-compatible StarWM endpoint at generation time; no local weights are loaded by the in-tree client.
  usage_notes_zh: |
    WorldFoundry 通过 runner target `worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner` 接入该模型，pipeline 绑定为 `starwm`，运行时配置为 `runtime-profile:starwm`。
    目录集成状态：运行时已移植（runtime_ported）。
    目录中记录的集成备注（保留原文）：
    - WorldFoundry exposes the official offline inference client in-tree under synthesis/visual_generation/world_model/starwm/offline_infer.
    - Jobs use StarWM's OpenAI-compatible endpoint parameters plus the official prompt fixture format.

    具身接口（embodiment contract）：
    - 仿真器：模型本身就是学习得到的世界模拟器：以视频形式生成未来世界状态，推理时不需要外部物理引擎或游戏引擎。
    - 传感器：初始图像或上下文帧，加流式交互输入。
    - 动作空间：通过官方 prompt fixture 格式提供的星际争霸域动作条件；具体动作编码本目录文件未记录。
    - 是否专用环境：生成时需要已运行的 OpenAI 兼容 StarWM 端点；树内客户端不加载本地权重。
  limitations: |
    Parity fields recorded in this catalog file: runner_parity=`pending`.
    Runner parity notes recorded in the catalog:
    - The route builds the official run_inference_client.py command and validates input_file, mode, and served_model_id/api_model_id before execution.
    - Actual generation still requires a running OpenAI-compatible StarWM endpoint; per-run validation evidence is tracked outside the model catalog.

    This documentation only restates metadata already recorded in the catalog; it claims no GPU execution evidence beyond the parity fields above.
