name: Release

# WF-04 scaffold: tag → build → twine → GitHub Release.
# PyPI Trusted Publishing (OIDC) is intentionally deferred.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and twine-check only (skip gh release create)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2" "twine>=5"
          mkdir -p dist
          python -m build --sdist --wheel -o dist

      - name: Twine check + size ceiling
        run: |
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          limit = 200 * 1024 * 1024
          paths = sorted(Path("dist").glob("*"))
          assert paths, "no dist artifacts"
          for path in paths:
              size = path.stat().st_size
              print(f"{path.name}: {size / (1024 * 1024):.1f} MiB")
              if size > limit:
                  raise SystemExit(f"{path} exceeds {limit} byte ceiling")
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/* \
            --title "$tag" \
            --generate-notes \
            --verify-tag
