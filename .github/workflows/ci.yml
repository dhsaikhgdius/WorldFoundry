name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/fumadocs/package-lock.json

      - name: Build docs
        run: bash scripts/docs/build.sh --skip-bootstrap

      - name: Install quality gate dependencies
        run: |
          python -m pip install --upgrade pip
          # packaging is required by runtime-registry-check → worldfoundry.runtime.conda
          python -m pip install PyYAML packaging "ruff==0.12.7" pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit safe gates (WF-05 subset)
        # Full `pre-commit run --all-files` still fails on trailing-whitespace/EOF across
        # vendored + catalog assets, and ruff-format has tree-wide drift. Enforce
        # merge-conflict + symlink hooks; skip lint (covered by `make lint`) and formatters.
        env:
          SKIP: worldfoundry-lightweight-lint,ruff-format,ruff-import-sort,trailing-whitespace,end-of-file-fixer
        run: python -m pre_commit run --all-files

      - name: Run lightweight quality gates
        run: make lint

      - name: Compile package and scripts
        run: make compile-eval

      - name: Run CLI check
        run: make cli-check

      - name: Run documented CLI checks
        run: make docs-check

  eval-core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU torch and package test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -e ".[test]"

      - name: Eval-core hard gate (stable cuda-tier subset)
        # test_cli_ux.py still carries catalog contract drift on main; keep it out of
        # the hard gate until those assertions are repaired in a content PR.
        run: >
          PYTHONPATH=. python -m pytest
          test/eval_core/test_cuda_tiers.py
          -q -p no:cacheprovider
          -m "not gpu and not network"

      - name: Eval-core full suite (allow failure until contract backlog clears)
        continue-on-error: true
        run: make test-eval-core PYTEST_ARGS='-m "not gpu and not network"'

  training-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU torch and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -e ".[test]"

      - name: Run training unit tests
        continue-on-error: true
        run: make test-training PYTEST_ARGS='-m "not gpu and not network"'
