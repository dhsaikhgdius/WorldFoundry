name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/fumadocs/package-lock.json

      - name: Build docs
        run: bash scripts/docs/build.sh

      - name: Install quality gate dependencies
        run: |
          python -m pip install --upgrade pip
          # packaging is required by runtime-registry-check → worldfoundry.runtime.conda
          python -m pip install PyYAML packaging "ruff==0.12.7"

      - name: Run lightweight quality gates
        run: make lint

      - name: Unified lock drift dry-run (I-05)
        run: |
          # uv pin matches docker/Dockerfile ARG UV_VERSION (D-05). Placeholder
          # locks skip fast; once a real lock body lands this recompiles the
          # cu128 lock and fails on drift.
          python -m pip install "uv==0.12.6"
          bash scripts/setup/compile_unified_lock.sh cu128 --check

      - name: Compile package and scripts
        run: make compile-eval

      - name: Run CLI check
        run: make cli-check

      - name: Run documented CLI checks
        run: make docs-check

  eval-core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU torch and package test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -e ".[test]"

      - name: Eval-core hard gate (stable cuda-tier contracts)
        # test_cli_ux.py still carries catalog contract drift on main; keep it out of
        # the hard gate until those assertions are repaired in a content PR.
        # TODO(D-01): add test/eval_core/test_embodied_image_refs.py and
        # tests/embodied/test_resolve_official_image_digests.py back to this
        # gate once the D-01 image-digest stack lands on main (those files only
        # exist on the infra tip stack today).
        run: >
          PYTHONPATH=. python -m pytest
          test/eval_core/test_cuda_tiers.py
          -q -p no:cacheprovider
          -m "not gpu and not network"

      - name: Eval-core full suite (allow failure until contract backlog clears)
        continue-on-error: true
        # --cov-report= suppresses the terminal table but still writes .coverage
        # for the job-summary step below (plan C-06; codecov deferred).
        run: >
          make test-eval-core PYTEST_ARGS='-m "not gpu and not network"
          --cov=worldfoundry/evaluation --cov-report='

      - name: Write evaluation coverage to job summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            {
              echo "### eval-core coverage: worldfoundry/evaluation"
              echo ""
              echo "Total line coverage: $(python -m coverage report --format=total)%"
              echo ""
              echo "<details><summary>Per-file report (covered/empty files skipped)</summary>"
              echo ""
              python -m coverage report --format=markdown --skip-covered --skip-empty
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY" || echo "coverage report failed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No .coverage data produced by the eval-core suite." >> "$GITHUB_STEP_SUMMARY"
          fi

  training-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU torch and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -e ".[test]"

      - name: Run training unit tests
        continue-on-error: true
        run: make test-training PYTEST_ARGS='-m "not gpu and not network"'
