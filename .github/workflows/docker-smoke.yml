# Docker smoke gate (plan D-08): when docker/** changes, lint the Dockerfile
# with hadolint and prove the base image still builds for linux/amd64.
# Never pushes an image. Runs only on docker-related paths, so the heavy
# CUDA base pull does not tax unrelated PRs.
name: docker-smoke

on:
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/docker-smoke.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/docker-smoke.yml"
  workflow_dispatch:

concurrency:
  group: docker-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Lint docker/Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: docker/Dockerfile
          # DL3006: FROM ${CUDA_IMAGE} resolves through an ARG whose default
          #         is fully tagged (nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04).
          # DL3008: apt version pins are impractical against the rolling
          #         Ubuntu package archive inside the CUDA base image.
          ignore: DL3006,DL3008

  build-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Free runner disk space for the CUDA devel base image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      # Mirrors docker/build_with_docker.sh (same context, Dockerfile, and
      # build arg) without the host-network flags, which need a buildx
      # entitlement that hosted runners do not grant.
      - name: Build linux/amd64 base image (no push)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "CUDA_IMAGE=nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04" \
            -f docker/Dockerfile \
            .
