[pytest]
# Repository-level pytest configuration (TC-06).
#
# The repository contains two supported test trees plus vendored thirdparty
# code with its own test suites:
#   - test/eval_core : evaluation-framework release-gate tests (pure CPU).
#   - test/ (top)    : mixed; real pytest tests are collected, while the
#                      manual demo scripts are excluded via
#                      test/conftest.py `collect_ignore`.
#   - tests/         : source-mirroring tests (core/, evaluation/, training/,
#                      studio/, ...). Optional-dependency modules are guarded
#                      with pytest.importorskip.
# `testpaths` keeps a bare `pytest` invocation inside those trees so that
# thirdparty/ and test_stream/ (module-level inference demo scripts) are
# never collected.
testpaths =
    test
    tests

norecursedirs = thirdparty test_stream .* build dist node_modules __pycache__

# Fail fast on marker typos; all custom markers must be registered here.
# Per-test wall clock (pytest-timeout) and slowest-test reporting keep hung
# or unexpectedly slow eval_core cases visible (TE-01). Parallelism is opt-in
# via ``-n auto`` from Makefile/CI so shared-tmp demos stay single-process by
# default locally.
addopts = --strict-markers --durations=25
timeout = 120
timeout_method = thread

markers =
    gpu: requires a CUDA-capable GPU at runtime
    unit: fast, isolated unit test
    slow: long-running test; excluded from quick local loops
    network: requires outbound network access
    fast_eval_core: auto-applied to tests under test/eval_core (see test/eval_core/conftest.py)
    serial: must not run under pytest-xdist workers (shared tmp / global cwd)
