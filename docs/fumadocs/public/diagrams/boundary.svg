<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="914" height="412" viewBox="0 0 914 412" role="img" aria-label="Model execution and benchmark evaluation separated by the artifact boundary">
  <rect x="0" y="0" width="914" height="412" style="fill:var(--c-bg)"/><rect x="20" y="20" width="372" height="372" rx="12" ry="12" style="fill:none;stroke:var(--c-line);stroke-width:1"/><rect x="522" y="20" width="372" height="372" rx="12" ry="12" style="fill:none;stroke:var(--c-line);stroke-width:1"/><foreignObject x="20" y="20" width="372" height="44"><div class="bcol-head">Model execution</div></foreignObject><foreignObject x="522" y="20" width="372" height="44"><div class="bcol-head">Benchmark / reporting</div></foreignObject><rect x="392" y="20" width="130" height="372" rx="12" ry="12" style="fill:var(--c-band);stroke:var(--c-line);stroke-width:1;stroke-dasharray:4 3"/><foreignObject x="392" y="30" width="130" height="44"><div class="band-label">Artifact boundary</div></foreignObject><rect x="36" y="76.0" width="340" height="54" rx="8" ry="8" style="fill:var(--c-card);stroke:var(--c-line);stroke-width:1"/><foreignObject x="36" y="76.0" width="340" height="54"><div class="node"><div class="head"><span class="role">Input</span><span class="idx"></span></div><div class="title">GenerationRequest</div><p class="detail">sample id, media, text/action, params</p></div></foreignObject><line x1="206.0" y1="130.0" x2="206.0" y2="139.0" style="stroke:var(--c-accent);stroke-width:1.5"/><polygon points="201.0,139.0 211.0,139.0 206.0,144.0" style="fill:var(--c-accent)"/><rect x="36" y="144.0" width="340" height="54" rx="8" ry="8" style="fill:var(--c-card);stroke:var(--c-line);stroke-width:1"/><foreignObject x="36" y="144.0" width="340" height="54"><div class="node"><div class="head"><span class="role">Runtime</span><span class="idx"></span></div><div class="title">Pipeline + Operator</div><p class="detail">checkpoint load + native call</p></div></foreignObject><line x1="206.0" y1="198.0" x2="206.0" y2="207.0" style="stroke:var(--c-accent);stroke-width:1.5"/><polygon points="201.0,207.0 211.0,207.0 206.0,212.0" style="fill:var(--c-accent)"/><rect x="36" y="212.0" width="340" height="54" rx="8" ry="8" style="fill:var(--c-card);stroke:var(--c-line);stroke-width:1"/><foreignObject x="36" y="212.0" width="340" height="54"><div class="node"><div class="head"><span class="role">Inference</span><span class="idx"></span></div><div class="title">Native inference</div><p class="detail">local runtime or hosted API</p></div></foreignObject><line x1="206.0" y1="266.0" x2="206.0" y2="275.0" style="stroke:var(--c-accent);stroke-width:1.5"/><polygon points="201.0,275.0 211.0,275.0 206.0,280.0" style="fill:var(--c-accent)"/><rect x="36" y="280.0" width="340" height="54" rx="8" ry="8" style="fill:var(--c-card);stroke:var(--c-line);stroke-width:1"/><foreignObject x="36" y="280.0" width="340" height="54"><div class="node"><div class="head"><span class="role">Artifact</span><span class="idx"></span></div><div class="title">GenerationResult</div><p class="detail">status, timing, outputs, metadata</p></div></foreignObject><rect x="538" y="110.0" width="340" height="54" rx="8" ry="8" style="fill:var(--c-card);stroke:var(--c-line);stroke-width:1"/><foreignObject x="538" y="110.0" width="340" height="54"><div class="node"><div class="head"><span class="role">Evaluation</span><span class="idx"></span></div><div class="title">Metrics / benchmark runner</div><p class="detail">reads artifacts, not checkpoints</p></div></foreignObject><line x1="708.0" y1="164.0" x2="708.0" y2="173.0" style="stroke:var(--c-accent);stroke-width:1.5"/><polygon points="703.0,173.0 713.0,173.0 708.0,178.0" style="fill:var(--c-accent)"/><rect x="538" y="178.0" width="340" height="54" rx="8" ry="8" style="fill:var(--c-card);stroke:var(--c-line);stroke-width:1"/><foreignObject x="538" y="178.0" width="340" height="54"><div class="node"><div class="head"><span class="role">Metrics</span><span class="idx"></span></div><div class="title">per_sample + summary</div><p class="detail">per-sample rows + aggregates</p></div></foreignObject><line x1="708.0" y1="232.0" x2="708.0" y2="241.0" style="stroke:var(--c-accent);stroke-width:1.5"/><polygon points="703.0,241.0 713.0,241.0 708.0,246.0" style="fill:var(--c-accent)"/><rect x="538" y="246.0" width="340" height="54" rx="8" ry="8" style="fill:var(--c-card);stroke:var(--c-line);stroke-width:1"/><foreignObject x="538" y="246.0" width="340" height="54"><div class="node"><div class="head"><span class="role">Report</span><span class="idx"></span></div><div class="title">scorecard.json + report.md</div><p class="detail">coverage, blockers, eligibility</p></div></foreignObject><foreignObject x="392" y="175.0" width="130" height="22"><div class="cross-main">GenerationResult</div></foreignObject><line x1="392" y1="205.0" x2="513" y2="205.0" style="stroke:var(--c-accent);stroke-width:2.5"/><polygon points="513,199.0 513,211.0 522,205.0" style="fill:var(--c-accent)"/><foreignObject x="392" y="211.0" width="130" height="20"><div class="cross-sub">artifacts.jsonl</div></foreignObject><foreignObject x="20" y="352" width="372" height="40"><div class="bcol-cap">model side never imports a benchmark evaluator</div></foreignObject><foreignObject x="522" y="352" width="372" height="40"><div class="bcol-cap">benchmark side never loads a model checkpoint</div></foreignObject>
  <style>
    :root {
      --c-bg: #f7f5ef; --c-card: #ffffff; --c-ink: #111111;
      --c-muted: #65645f; --c-line: #d8d4c9; --c-accent: #9a8568;
      --c-band: #efe9df;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-bg: #141311; --c-card: #22201c; --c-ink: #f3efe6;
        --c-muted: #b3ada3; --c-line: #3a3733; --c-accent: #c4ad92;
        --c-band: #2a2722;
      }
    }
    .node { box-sizing: border-box; width: 100%; height: 100%; padding: 7px 10px; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; gap: 2px; }
    .head { display: flex; align-items: center; gap: 6px; min-height: 14px; }
    .role { font-size: 9px; line-height: 1; color: var(--c-muted); border: 1px solid var(--c-line); border-radius: 3px; padding: 1px 4px; white-space: nowrap; }
    .title { font-size: 12px; font-weight: 650; color: var(--c-ink); line-height: 1.2; }
    .detail { margin: 1px 0 0; font-size: 10px; line-height: 1.4; color: var(--c-muted); }
    .bcol-head { box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; padding: 0 16px; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.02em; color: var(--c-ink); }
    .bcol-cap { box-sizing: border-box; width: 100%; height: 100%; padding: 4px 16px; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; line-height: 1.4; color: var(--c-muted); font-style: italic; }
    .band-label { box-sizing: border-box; width: 100%; text-align: center; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; line-height: 1.25; font-weight: 700; letter-spacing: 0.04em; color: var(--c-muted); text-transform: uppercase; }
    .cross-main { box-sizing: border-box; width: 100%; text-align: center; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; line-height: 1.2; font-weight: 700; color: var(--c-accent); }
    .cross-sub { box-sizing: border-box; width: 100%; text-align: center; font-family: ui-mono, ui-sans-serif, system-ui, sans-serif; font-size: 9px; line-height: 1.2; color: var(--c-muted); }
  </style>
</svg>
