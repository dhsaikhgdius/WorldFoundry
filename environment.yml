name: worldfoundry
channels:
  - conda-forge
  # cuda-nvcc is installed from here by scripts/setup/conda_install.sh.
  - nvidia
  # Keep Anaconda `defaults` out even when a user .condarc adds it (ToS).
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - setuptools
  - wheel
  - packaging
  - git
  - git-lfs
  - ffmpeg
  - libexpat
  - cmake
  - ninja
  # Native ViPE/DROID kernels require Eigen headers at build time.
  - eigen=3.4
  - pkg-config
  - libgl
  - libglib
