schema: worldfoundry-post-training
execution_owner: worldfoundry-native
run:
  id: qwen3-4b-token-ppo
  output_dir: runs/qwen3-4b-token-ppo
model:
  recipe: qwen3-4b-base
  checkpoint: Qwen/Qwen3-4B-Base
  options:
    attention_implementation: sdpa
    enable_thinking: true
    max_new_tokens: 8192
tuning:
  mode: full
data:
  manifest: data/post_training/qwen3-ppo-prompts.jsonl
  split: train
  shuffle: true
  shuffle_seed: 42
  tail_policy: pad
  options:
    batch_size: 4
algorithm:
  type: token-ppo
  reward_weights:
    correctness: 1.0
  update_epochs: 1
  update_partitions: 4
  clip_range: 0.2
  clip_schedule: constant
  value_clip_range: 0.2
  vf_coef: 0.5
  gamma: 1.0
  gae_lambda: 0.95
  reduction: seq-mean-token-mean
  horizon: 8192
  sampling_temperature: 1.0
  replay_microbatch_size: 1
optimizer:
  type: adamw
  learning_rate: 0.000001
  weight_decay: 0.01
  max_grad_norm: 1.0
runtime:
  param_dtype: bfloat16
  reduce_dtype: float32
  activation_checkpoint: full
  compile: false
distributed:
  backend: single
checkpoint:
  save_every_steps: 4
  async: false
export:
  format: safetensors
