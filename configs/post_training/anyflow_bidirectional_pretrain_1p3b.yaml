schema: worldfoundry-post-training
execution_owner: worldfoundry-native
run:
  id: anyflow-bidirectional-pretrain-1p3b
  output_dir: runs/anyflow-bidirectional-pretrain-1p3b
model:
  recipe: wan2.1-t2v-1.3b
  checkpoint: default
tuning:
  mode: full
data:
  manifest: data/post_training/anyflow-81f-latents.jsonl
  cache: cache/post_training/anyflow-81f-latents
  split: train
  shuffle: true
  shuffle_seed: 0
  tail_policy: drop
  max_latent_tokens_per_microbatch: 262080
  options:
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    snapshot_every_n_steps: 1
algorithm:
  type: anyflow-bidirectional-pretrain
  flow_map:
    num_train_timesteps: 1000
    timestep_shift: 5.0
    central_difference_epsilon: 5.0
    diffusion_ratio: 0.5
    consistency_ratio: 0.25
    fused_guidance_scale: 3.0
  image_conditioning_probability: 0.0
  conditioning_dropout_probability: 0.1
  lr_scheduler: constant-with-warmup
  lr_warmup_steps: 1000
  ema_decay: 0.999
  ema_warmup_steps: 1000
optimizer:
  type: adamw
  learning_rate: 0.00005
  weight_decay: 0.0
  betas: [0.9, 0.95]
  epsilon: 0.00000001
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
runtime:
  param_dtype: bfloat16
  reduce_dtype: float32
  activation_checkpoint: full
  compile: false
distributed:
  backend: single
  dp_replicate: 1
  dp_shard: auto
  cp: 1
  tp: 1
checkpoint:
  save_every_steps: 50
  async: false
  export_every_steps: 2000
export:
  format: safetensors
