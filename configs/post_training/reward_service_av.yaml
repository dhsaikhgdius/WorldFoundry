server:
  # Loopback by default. A non-loopback host (e.g. 0.0.0.0) additionally
  # requires WF_REWARD_SERVICE_TOKEN; trainers send Authorization: Bearer.
  host: 127.0.0.1
  port: 8080
  fail_fast: true

scorers:
  videopickscore:
    batch_size: 8
    device: cuda
    processor_id: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
    model_id: yuvalkirstain/PickScore_v1
  clap:
    batch_size: 8
    device: cuda
    model_id: laion/larger_clap_general
