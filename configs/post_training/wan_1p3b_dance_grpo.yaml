schema: worldfoundry-post-training
execution_owner: worldfoundry-native
run:
  id: wan-1p3b-dance-grpo
  output_dir: runs/wan-1p3b-dance-grpo
model:
  recipe: wan2.1-t2v-1.3b
  checkpoint: default
tuning:
  mode: lora
  preset: wan-attention
  rank: 64
  alpha: 128
data:
  manifest: data/post_training/wan-rl-prompts.jsonl
  cache: cache/post_training/wan-rl-conditioning
  split: train
  shuffle: true
  shuffle_seed: 42
  tail_policy: pad
  options:
    prompt_batch_size: 1
    generation:
      height: 256
      width: 416
      num_frames: 17
algorithm:
  type: dance-grpo
  num_train_timesteps: 1000
  sigmas: [1.0, 0.8, 0.6, 0.4, 0.2, 0.0]
  sde_step_indices: [0, 1, 2, 3, 4]
  transition_strategy: constant-diffusion
  init_same_noise: true
  eta: 0.3
  update_timestep_fraction: 0.6
  clip_range: 0.0001
  updates_per_trajectory: 3
  group_size: 12
  old_log_prob_source: rollout
  advantage_epsilon: 0.00000001
  advantage_normalization: group-sample-std
  advantage_clip_max: 5.0
  reward_weights:
    video_quality: 1.0
    motion_quality: 1.0
    text_alignment: 1.0
  reward_model:
    type: videoalign
optimizer:
  type: adamw
  learning_rate: 0.0003
  max_grad_norm: 1.0
runtime:
  param_dtype: bfloat16
  reduce_dtype: float32
  activation_checkpoint: full
distributed:
  backend: fsdp2
  dp_replicate: 1
  dp_shard: auto
  cp: 1
  tp: 1
checkpoint:
  save_every_steps: 50
  async: true
  export_every_steps: 50
export:
  format: peft
