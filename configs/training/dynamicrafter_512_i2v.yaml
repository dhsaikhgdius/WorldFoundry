schema: worldfoundry-training
execution_owner: worldfoundry-native
run:
  id: dynamicrafter-512-i2v
  output_dir: runs/dynamicrafter-512-i2v
model:
  recipe: dynamicrafter-512-i2v
  checkpoint: default
  options:
    training_mode: image-to-video
    default_fps: 10
tuning:
  mode: full
data:
  manifest: data/dynamicrafter-512.jsonl
  cache: cache/dynamicrafter-512
  max_latent_tokens_per_microbatch: 81920
  split: train
  shuffle: true
  shuffle_seed: 42
  tail_policy: pad
  options:
    precomputed_tensors: precomputed/dynamicrafter-512
    video_buckets:
      - num_frames: 16
        height: 320
        width: 512
        conditioning_layout: dynamicrafter-hybrid
        tasks: [i2v]
    num_workers: 2
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    snapshot_every_n_steps: 1
objective:
  type: classic-diffusion
  prediction_type: v_prediction
  timestep_sampler: uniform
  conditioning_dropout: 0.05
  options:
    num_train_timesteps: 1000
    beta_start: 0.00085
    beta_end: 0.012
    loss_type: l2
    zero_terminal_snr: true
    dynamic_rescale_final: 0.7
    dynamic_rescale_transition_steps: 400
optimizer:
  type: adamw
  learning_rate: 0.00001
  weight_decay: 0.01
  betas: [0.9, 0.999]
  epsilon: 0.00000001
  max_grad_norm: 0.5
  gradient_accumulation_steps: 2
runtime:
  param_dtype: float16
  reduce_dtype: float32
  activation_checkpoint: full
  compile: false
distributed:
  backend: fsdp2
  dp_replicate: 1
  dp_shard: auto
  cp: 1
  tp: 1
checkpoint:
  save_every_steps: 9000
  async: true
